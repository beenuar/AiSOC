id: hunt-ssh-key-added-to-authorized-keys
name: Public key appended to an account's authorized_keys
description: |
  Configuration management owns authorized_keys in most estates. A shell appending to it is the cheapest persistence on Linux.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1098.004
  - hunt.endpoint
log_sources:
  - linux_auditd
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a key appended to authorized_keys by something other than configuration management?
  indicators:
    - field: "source"
      equals: "linux_auditd"
    - field: "path"
      regex: "authorized_keys$"
    - field: "parentIsConfigManagement"
      equals: false
expected:
  positive_incident_id: INC-HUNT-034
  positive_template_id: hunt-ssh-key-added-to-authorized-keys
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-034-NEG
  # The negative inverts parentIsConfigManagement, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1098/004/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
