id: hunt-backup-job-disabled
name: Scheduled backup job disabled or deleted
description: |
  Backup jobs are disabled for maintenance regularly. Outside a change window it is the step that makes encryption stick.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1490
  - hunt.endpoint
log_sources:
  - windows_security
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a backup job disabled outside a change window?
  indicators:
    - field: "source"
      equals: "windows_security"
    - field: "EventID"
      in: [4701, 4699]
    - field: "TaskName"
      regex: "(?i)backup"
    - field: "duringChangeWindow"
      equals: false
expected:
  positive_incident_id: INC-HUNT-048
  positive_template_id: hunt-backup-job-disabled
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-048-NEG
  # The negative inverts duringChangeWindow, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1490/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
