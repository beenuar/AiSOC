id: hunt-cloudtrail-logging-stopped
name: Cloud audit trail stopped or deleted
description: |
  Infrastructure pipelines reconfigure trails as part of ordinary change. A human identity stopping one is the first move in making the rest invisible.
version: 1.0.0
severity: critical
category: cloud
tags:
  - mitre.attack.t1562.008
  - hunt.cloud
log_sources:
  - aws_cloudtrail
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was an audit trail stopped, deleted, or had its logging disabled?
  indicators:
    - field: "source"
      equals: "aws_cloudtrail"
    - field: "eventName"
      in: ["StopLogging", "DeleteTrail", "PutEventSelectors"]
    - field: "performedByPipeline"
      equals: false
expected:
  positive_incident_id: INC-HUNT-022
  positive_template_id: hunt-cloudtrail-logging-stopped
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-022-NEG
  # The negative inverts performedByPipeline, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1562/008/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
