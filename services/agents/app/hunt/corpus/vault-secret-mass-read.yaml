id: hunt-vault-secret-mass-read
name: One identity read an unusual number of distinct secrets
description: |
  A pipeline reads the handful of secrets it needs. Enumerating the store is what an operator does when they have a token and do not yet know what it unlocks.
version: 1.0.0
severity: high
category: data-exfil
tags:
  - mitre.attack.t1552.007
  - hunt.data
log_sources:
  - vault
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did any identity read far more distinct secret paths in an hour than it normally does?
  indicators:
    - field: "source"
      equals: "vault"
    - field: "operation"
      equals: "read"
    - field: "distinct_paths_last_hour"
      gte: 50
expected:
  positive_incident_id: INC-HUNT-012
  positive_template_id: hunt-vault-secret-mass-read
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-012-NEG
  # The negative inverts distinct_paths_last_hour, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1552/007/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
