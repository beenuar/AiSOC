id: hunt-okta-mfa-factor-reset-by-other-admin
name: MFA factor reset for an account by an administrator who has never done so before
description: |
  Help-desk staff reset MFA factors all day. An administrator doing it for the first time, especially against a high-value account, is the shape of a compromised or socially-engineered admin session.
version: 1.0.0
severity: high
category: identity
tags:
  - mitre.attack.t1556.006
  - hunt.identity
log_sources:
  - okta
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did an administrator reset another user's MFA factor for the first time?
  indicators:
    - field: "source"
      equals: "okta"
    - field: "eventType"
      in: ["user.mfa.factor.reset_all", "user.mfa.factor.deactivate"]
    - field: "actorFirstTimeResettingMfa"
      equals: true
expected:
  positive_incident_id: INC-HUNT-011
  positive_template_id: hunt-okta-mfa-factor-reset-by-other-admin
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-011-NEG
  # The negative inverts actorFirstTimeResettingMfa, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1556/006/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
