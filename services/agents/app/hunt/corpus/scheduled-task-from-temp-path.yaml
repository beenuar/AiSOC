id: hunt-scheduled-task-from-temp-path
name: Scheduled task registered to run a binary from a temporary directory
description: |
  Scheduled tasks are how most software updates itself. A task whose action lives in a world-writable temporary directory is not how packaged software installs.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1053.005
  - hunt.endpoint
log_sources:
  - windows_security
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a scheduled task created whose action points at a user-writable temporary path?
  indicators:
    - field: "source"
      equals: "windows_security"
    - field: "EventID"
      in: [4698]
    - field: "TaskCommand"
      regex: "(?i)\\\\(temp|tmp|appdata\\\\local\\\\temp|users\\\\public)\\\\"
expected:
  positive_incident_id: INC-HUNT-013
  positive_template_id: hunt-scheduled-task-from-temp-path
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-013-NEG
  # The negative inverts TaskCommand, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
