id: hunt-sudoers-modified-outside-config-management
name: sudoers file changed outside configuration management
description: |
  sudoers is managed as code almost everywhere it matters. Edited by hand on one host, it is a privilege grant nobody reviewed.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1548.003
  - hunt.endpoint
log_sources:
  - linux_auditd
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was the sudoers configuration modified by a shell rather than by configuration management?
  indicators:
    - field: "source"
      equals: "linux_auditd"
    - field: "path"
      regex: "^/etc/sudoers"
    - field: "parentIsConfigManagement"
      equals: false
expected:
  positive_incident_id: INC-HUNT-052
  positive_template_id: hunt-sudoers-modified-outside-config-management
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-052-NEG
  # The negative inverts parentIsConfigManagement, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1548/003/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
