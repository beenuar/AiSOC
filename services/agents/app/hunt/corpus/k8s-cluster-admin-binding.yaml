id: hunt-k8s-cluster-admin-binding
name: Cluster-admin role bound to a service account
description: |
  Operators hold cluster-admin as people, with named accounts and an audit trail. A service account holding it means any workload that can read its token owns the cluster.
version: 1.0.0
severity: critical
category: cloud
tags:
  - mitre.attack.t1078.003
  - hunt.cloud
log_sources:
  - kubernetes_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was cluster-admin bound to a service account rather than to a person?
  indicators:
    - field: "source"
      equals: "kubernetes_audit"
    - field: "verb"
      in: ["create", "update"]
    - field: "roleRefName"
      equals: "cluster-admin"
    - field: "subjectKind"
      equals: "ServiceAccount"
expected:
  positive_incident_id: INC-HUNT-051
  positive_template_id: hunt-k8s-cluster-admin-binding
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-051-NEG
  # The negative inverts subjectKind, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1078/003/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
