id: hunt-zoom-recording-downloaded-externally
name: Meeting recording downloaded by an account outside the organisation
description: |
  Recordings are shared internally as a matter of course. An external download of one is a disclosure whether or not it was intended.
version: 1.0.0
severity: medium
category: data-exfil
tags:
  - mitre.attack.t1213
  - hunt.saas
log_sources:
  - zoom
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a recording downloaded by an external account?
  indicators:
    - field: "source"
      equals: "zoom"
    - field: "event"
      equals: "recording.downloaded"
    - field: "downloaderIsInternal"
      equals: false
expected:
  positive_incident_id: INC-HUNT-063
  positive_template_id: hunt-zoom-recording-downloaded-externally
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-063-NEG
  # The negative inverts downloaderIsInternal, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1213/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
