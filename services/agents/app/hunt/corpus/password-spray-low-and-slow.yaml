id: hunt-password-spray-low-and-slow
name: Many accounts failing authentication from one source with few attempts each
description: |
  Password spraying stays under per-account lockout thresholds by spreading across accounts, so the count of distinct accounts rather than the count of attempts is what surfaces it.
version: 1.0.0
severity: high
category: identity
tags:
  - mitre.attack.t1110.003
  - hunt.identity
log_sources:
  - okta
  - azure_ad
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did one source fail authentication against many distinct accounts, a couple of attempts each?
  indicators:
    - field: "source"
      equals: "okta"
    - field: "outcome"
      equals: "FAILURE"
    - field: "distinctAccountsFromIpLastHour"
      gte: 30
    - field: "attemptsPerAccount"
      lte: 3
expected:
  positive_incident_id: INC-HUNT-055
  positive_template_id: hunt-password-spray-low-and-slow
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-055-NEG
  # The negative inverts distinctAccountsFromIpLastHour, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
