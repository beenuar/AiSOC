id: hunt-saas-bulk-download
name: Bulk download from a SaaS application
description: |
  Everyone downloads files. Volume against the account's own baseline is what separates a working day from a copy of the document library.
version: 1.0.0
severity: high
category: data-exfil
tags:
  - mitre.attack.t1567.002
  - hunt.data
log_sources:
  - m365_audit
  - gsuite_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did any account download far more files in an hour than it normally does?
  indicators:
    - field: "source"
      equals: "m365_audit"
    - field: "Operation"
      in: ["FileDownloaded", "FileSyncDownloadedFull"]
    - field: "filesDownloadedLastHour"
      gte: 200
expected:
  positive_incident_id: INC-HUNT-036
  positive_template_id: hunt-saas-bulk-download
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-036-NEG
  # The negative inverts filesDownloadedLastHour, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
