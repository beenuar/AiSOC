id: hunt-timestomp-file-creation-time
name: File creation time changed to an older value
description: |
  Build tooling rewrites timestamps forward routinely. Moving a creation time backwards, especially by months, is done to make a file look like it was always there.
version: 1.0.0
severity: medium
category: endpoint
tags:
  - mitre.attack.t1070.006
  - hunt.endpoint
log_sources:
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did any process backdate a file's creation timestamp?
  indicators:
    - field: "source"
      equals: "sysmon"
    - field: "EventID"
      in: [2]
    - field: "creationTimeMovedBackwardsDays"
      gte: 1
expected:
  positive_incident_id: INC-HUNT-021
  positive_template_id: hunt-timestomp-file-creation-time
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-021-NEG
  # The negative inverts creationTimeMovedBackwardsDays, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
