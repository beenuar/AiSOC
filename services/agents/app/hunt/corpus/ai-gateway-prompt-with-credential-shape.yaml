id: hunt-ai-gateway-prompt-with-credential-shape
name: Prompt submitted to a model containing a credential-shaped string
description: |
  Pasting a config file into a model to debug it is a common habit. Whether the model runs inside the estate decides whether that is a disclosure.
version: 1.0.0
severity: high
category: application
tags:
  - mitre.attack.t1552.001
  - hunt.ai
log_sources:
  - ai_gateway
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did anyone paste something credential-shaped into a model prompt?
  indicators:
    - field: "source"
      equals: "ai_gateway"
    - field: "promptContainsSecretShape"
      equals: true
    - field: "destinationIsSelfHosted"
      equals: false
expected:
  positive_incident_id: INC-HUNT-065
  positive_template_id: hunt-ai-gateway-prompt-with-credential-shape
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-065-NEG
  # The negative inverts destinationIsSelfHosted, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
