[tool.poetry]
name = "aisoc-mesh"
version = "0.1.0"
description = "AiSOC Federated Threat Intel Mesh hub + client (v8 P1)"
authors = ["AiSOC contributors"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111,<0.140"
uvicorn = { version = ">=0.29,<0.52", extras = ["standard"] }
pydantic = ">=2.7,<2.14"
cryptography = ">=42,<51"
httpx = ">=0.27,<0.29"

[tool.poetry.group.dev.dependencies]
# Floored at 9.0.3 for GHSA advisory coverage; the caret pins excluded it.
# pytest-asyncio is widened to match — 0.23 predates pytest 9 and the two
# resolve together or not at all.
pytest = ">=9.0.3,<10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
