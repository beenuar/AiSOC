[tool.poetry]
name = "aisoc-osquery-tls"
version = "0.1.0"
description = "AiSOC osquery TLS plugin service — direct osqueryd TLS endpoint without a separate fleet manager"
authors = ["AiSOC Community"]
license = "MIT"
# No `readme` key: these services are installed with `--no-root` and are not
# published as packages. The key used to name a README.md that has never
# existed in this tree, which made `poetry check` fail on a manifest error
# and hid whether the lock was fresh.

[tool.poetry.dependencies]
python = "^3.11"
# Floor 0.117: below it a `-> None` handler under PEP 563 trips FastAPI's
# "204 must not have a response body" assert at import. One range for
# every service — see services/api/pyproject.toml for the measurement.
fastapi = ">=0.117,<0.142"
uvicorn = { version = "^0.29.0", extras = ["standard"] }
pydantic = ">=2.7,<2.11"
pydantic-settings = "^2.2.1"
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = ">=0.29.0,<0.32"
alembic = "^1.13.1"
httpx = ">=0.27,<0.29"
structlog = "^24.1.0"
prometheus-client = ">=0.20,<0.26"
# One range across every service that touches the vault: the Fernet /
# MultiFernet token format is a contract between the writer (api) and the
# readers (connectors, agents, osquery-tls), and they share one
# AISOC_CREDENTIAL_KEY. The floor is 46 rather than the 44.0.1 that cleared
# CVE-2024-12797 because agents already required 46 and CI was installing
# `>=41,<46` — a range disjoint from what the image shipped.
cryptography = ">=46,<51"

[tool.poetry.group.dev.dependencies]
# Floored at 9.0.3 for GHSA advisory coverage; the caret pins excluded it.
# pytest-asyncio is widened to match — 0.23 predates pytest 9 and the two
# resolve together or not at all.
pytest = ">=9.0.3,<10.0"
pytest-asyncio = ">=1.0,<2.0"
pytest-cov = "^5.0.0"
httpx = ">=0.27,<0.29"
# One range everywhere: `ruff format --check services/` is a hard gate and
# ruff's formatter output changes between minors, so a contributor whose
# manifest permits a newer ruff reformats the tree and reds their own PR.
# Moving this range means reformatting the tree, which is its own change.
ruff = ">=0.16.8,<0.17"
mypy = ">=2.3.1,<3"
aiosqlite = ">=0.19,<0.22"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


# Phase 2.2 — coverage floor for CI gate.
#
# Measured baseline at the time of introduction: 72%. Floor is
# set at 70% (current - 2pp) so flaky branch-execution variance
# doesn't break main, while still catching any real regression. Raise
# this number as the suite grows — never lower it without a written
# justification. The pyproject is consulted by
# `pytest --cov-config=pyproject.toml --cov=app` in CI.
#
# Why pyproject instead of pytest.ini: keeps the floor next to the
# dep constraint that produced it, so a bump in either is reviewed
# in the same diff.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# The Phase 2.2 gate was originally set to 70% across every Python
# service, but `osquery-tls` ships with only 12 small tests covering
# the TLS enroll / config / distributed-query / log paths and leaves
# the `db.py` + `auth.py` boilerplate uncovered. Measured coverage at
# the time the gate landed was 64.45%. Anchor the floor at 60% so we
# fail-fast on real regressions (a missed test for a new endpoint
# would drop coverage well below 60%) without forcing a low-value
# coverage-padding sprint. Raise this to 70% once db/auth get their
# own dedicated test pass.
fail_under = 60
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
