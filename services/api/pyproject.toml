[tool.poetry]
name = "aisoc-api"
version = "0.1.0"
description = "AiSOC Core API Service — Open-source AI Security Operations Center"
authors = ["Beenu Arora <beenu@cyble.com>"]
license = "MIT"
# No `readme` key: these services are installed with `--no-root` and are not
# published as packages. The key used to name a README.md that has never
# existed in this tree, which made `poetry check` fail on a manifest error
# and hid whether the lock was fresh.

[tool.poetry.dependencies]
python = "^3.11"
# Floored at 0.117 because below it this service cannot be imported at all.
# Under `from __future__ import annotations` a `-> None` handler reaches
# FastAPI as the string "None", which ForwardRef resolution turns into
# `NoneType` — truthy — so FastAPI concludes the route declares a response
# body and trips `assert is_body_allowed_for_status_code(204)`. 0.117.0
# treats the resolved `NoneType` as "no body" again. Measured, not inferred:
# every release from 0.111.0 to 0.116.2 raises at import on
# `api/v1/endpoints/community.py`, 0.117.0 and later do not.
# `tests/test_fastapi_floor.py` re-derives the boundary from the installed
# version, so a Dependabot bump that lowers the floor fails rather than
# producing an image that dies on startup.
fastapi = ">=0.117,<0.142"
uvicorn = { version = ">=0.29,<0.54", extras = ["standard"] }
# EmailStr (used in auth/passkeys/tenants endpoints) requires the optional
# email-validator package, which is only pulled in via the "email" extra.
# Without it the API crashes on import with "email-validator is not installed".
pydantic = { version = ">=2.7,<2.14", extras = ["email"] }
pydantic-settings = "^2.2.1"
sqlalchemy = { version = "^2.0.30", extras = ["asyncio"] }
asyncpg = ">=0.29.0,<0.32"
alembic = "^1.13.1"
redis = { version = ">=5.0.4,<9.0.0", extras = ["hiredis"] }
httpx = ">=0.27,<0.29"
# PyJWT is the only JWT implementation in this service: first-party access and
# refresh tokens, realtime tickets, and the OIDC / SAML assertion paths. It
# replaced python-jose, whose unconditional `ecdsa` requirement carried
# CVE-2024-23342 (Minerva timing attack on P-256) with no patched release
# upstream — the maintainers state python-ecdsa offers no side-channel
# resistance and will not fix it. Nothing here needed jose's JWE/JWS surface.
PyJWT = ">=2.8,<3"
# Direct dep for credential vault Fernet. One range across every service
# that reads or writes a vault token — see services/connectors/pyproject.toml.
cryptography = ">=46,<51"
bcrypt = ">=4.1.2,<6.0.0"  # Used directly by app.core.security (passlib is no longer compatible with bcrypt >= 4)
python-multipart = ">=0.0.9,<0.0.33"
tenacity = ">=8.3,<10.0"
structlog = ">=24.1,<27.0"
prometheus-client = ">=0.20,<0.27"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-instrumentation-sqlalchemy = "^0.45b0"
clickhouse-driver = "^0.2.8"
# sqlglot powers the tenant-lake SQL rewriter (Workstream 7). We use it to
# parse user-supplied SELECTs, enforce a table allowlist, and inject the
# mandatory `tenant_id = '<uuid>'` predicate into every relation (including
# subqueries) before the statement is forwarded to ClickHouse.
#
# The range must match the Dockerfile and every CI workflow exactly, and
# `scripts/check_sqlglot_pin.py` fails the build if they drift. This is not
# tidiness: sqlglot is the component that enforces tenant isolation on the
# lake, so two builds of the same commit resolving different versions means
# two different isolation guarantees. This line read `<31.0.0` while the
# Dockerfile and CI read `<27`, and on 27+ the rewriter returned unscoped
# SQL and reported success.
#
# One major wide, deliberately. The previous `>=23,<27` permitted four majors
# of which exactly one was ever exercised, so three of them were installable
# and untested. The rewriter suites and an adversarial corpus were run on the
# 30 line; 27, 28 and 29 were not, and a range is a statement about what may
# be installed rather than about what upstream has released.
sqlglot = ">=30,<31"
boto3 = "^1.34.0"
neo4j = ">=5.19,<7.0"
pysigma = "^0.11.0"
pysigma-backend-opensearch = "^1.0.0"
yara-python = "^4.5.0"
pyyaml = "^6.0.1"
strawberry-graphql = { version = ">=0.236,<0.328", extras = ["fastapi"] }
webauthn = ">=2.2,<4.0"
weasyprint = ">=62,<71"          # WS-G2: server-side PDF generation from print-ready HTML
# Phase 4.5 / Milestone 1F — the hunt scheduler now drives next-fire
# computation through croniter, replacing the bespoke parser that only
# understood a handful of common cadences. Pinned with a wide range
# because croniter is API-stable and we only use the
# `get_next` / `is_valid` surface.
croniter = ">=2.0,<7.0"

[tool.poetry.group.dev.dependencies]
# Floored at 9.0.3 for GHSA advisory coverage; the caret pins excluded it.
# pytest-asyncio is widened to match — 0.23 predates pytest 9 and the two
# resolve together or not at all.
pytest = ">=9.0.3,<10.0"
pytest-asyncio = ">=1.0,<2.0"
pytest-cov = ">=5,<8"
httpx = ">=0.27,<0.29"
# One range everywhere: `ruff format --check services/` is a hard gate and
# ruff's formatter output changes between minors, so a contributor whose
# manifest permits a newer ruff reformats the tree and reds their own PR.
# Moving this range means reformatting the tree, which is its own change.
ruff = ">=0.16.8,<0.17"
mypy = ">=1.10,<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff config lives in the repo-root `ruff.toml` so the CI gate is consistent
# across services. Don't add `[tool.ruff]` here — it would shadow the root.

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring a live Postgres + alembic-migrated schema (run explicitly with AISOC_RUN_INTEGRATION=1)",
]
