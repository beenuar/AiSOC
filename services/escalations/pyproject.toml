[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisoc-escalations"
version = "0.1.0"
description = "Ack-clock escalation bridge: Teams escalations for unacknowledged CRITICAL/HIGH cases while the native outbound-webhook emitters are unwired."
requires-python = ">=3.11"
dependencies = [
    # The service's only dependency. Sync psycopg on purpose: one query burst
    # every ESC_TICK_SECONDS from a single loop needs no event loop, and a
    # second async stack in a sidecar is surface without a payoff.
    "psycopg[binary]>=3.2,<4",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
