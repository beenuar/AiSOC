[tool.poetry]
name = "aisoc-actions"
version = "0.1.0"
description = "AiSOC Action Execution Service - blast-radius gated response actions with rollback"
authors = ["Beenu Arora <beenu@cyble.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
# Floor 0.117: below it a `-> None` handler under PEP 563 trips FastAPI's
# "204 must not have a response body" assert at import. One range for
# every service — see services/api/pyproject.toml for the measurement.
fastapi = ">=0.117,<0.143"
uvicorn = {extras = ["standard"], version = ">=0.27,<0.55"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = {extras = ["hiredis"], version = ">=5.0.1,<9.0.0"}
asyncpg = ">=0.29.0,<0.32"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
structlog = ">=24.1,<27.0"
httpx = ">=0.27,<0.29"
aiokafka = ">=0.10,<0.15"
python-dateutil = "^2.8.2"
cryptography = ">=46,<51"

[tool.poetry.group.dev.dependencies]
# Floored at 9.0.3 for GHSA advisory coverage; the caret pins excluded it.
# pytest-asyncio is widened to match — 0.23 predates pytest 9 and the two
# resolve together or not at all.
pytest = ">=9.0.3,<10.0"
pytest-asyncio = ">=1.0,<2.0"
# Fourteen test modules import respx to mock the vendor HTTP calls, and the
# manifest did not declare it — the workflow installed it as part of a set
# shared with seven other services, so `poetry install` gave a tree where
# this suite could not be collected at all. Same range as services/agents,
# which is the other consumer on httpx 0.28.
respx = ">=0.22,<0.24"
# The CI job that runs this suite reads a coverage floor out of the
# `[tool.coverage.report]` table below, and the plugin that enforces it was
# installed by the workflow rather than declared here. A floor whose reader
# lives somewhere else is a floor that can be dropped by editing a file this
# service does not own.
pytest-cov = ">=5,<8"

# Same shape as services/api and services/osquery-tls rather than a third
# strictness level. `python_version` is pinned so the finding set does not
# move with whatever interpreter mypy happens to run on.
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Phase 2.2 — coverage floor for CI gate.
#
# Measured baseline at the time of introduction: 48%. Floor is
# set at 46% (current - 2pp) so flaky branch-execution variance
# doesn't break main, while still catching any real regression. Raise
# this number as the suite grows — never lower it without a written
# justification. The pyproject is consulted by
# `pytest --cov-config=pyproject.toml --cov=app` in CI.
#
# Why pyproject instead of pytest.ini: keeps the floor next to the
# dep constraint that produced it, so a bump in either is reviewed
# in the same diff.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 46
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
