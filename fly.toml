# fly.toml app configuration file for AiSOC
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# This configuration enables one-click deployment of AiSOC to Fly.io
# It defines a single app that uses the docker-compose.demo.yml file for deployment

app = "aisoc-demo"
primary_region = "iad"

[build]
  dockerfile = "docker-compose.demo.yml"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = '1GB'
  cpu_kind = 'shared'
  cpus = 1