id: hunt-slack-external-shared-channel-with-finance
name: External shared channel opened against a sensitive internal channel
description: |
  Shared channels with suppliers are ordinary. Connecting one to a restricted channel exposes whatever has already been said in it.
version: 1.0.0
severity: medium
category: application
tags:
  - mitre.attack.t1199
  - hunt.saas
log_sources:
  - slack_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a channel holding sensitive discussion shared with an external organisation?
  indicators:
    - field: "source"
      equals: "slack_audit"
    - field: "action"
      equals: "external_shared_channel_connected"
    - field: "channelSensitivity"
      equals: "restricted"
expected:
  positive_incident_id: INC-HUNT-060
  positive_template_id: hunt-slack-external-shared-channel-with-finance
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-060-NEG
  # The negative inverts channelSensitivity, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1199/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
