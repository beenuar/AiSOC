id: hunt-run-key-persistence
name: Registry Run key written by a process that is not an installer
description: |
  Run keys are the most common persistence mechanism on Windows and also how a great deal of legitimate software starts. The writing process, not the key, is the signal.
version: 1.0.0
severity: medium
category: endpoint
tags:
  - mitre.attack.t1547.001
  - hunt.endpoint
log_sources:
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did a non-installer process write an autorun registry value?
  indicators:
    - field: "source"
      equals: "sysmon"
    - field: "EventID"
      in: [13]
    - field: "TargetObject"
      regex: "(?i)\\\\CurrentVersion\\\\Run"
    - field: "ImageIsSignedInstaller"
      equals: false
expected:
  positive_incident_id: INC-HUNT-014
  positive_template_id: hunt-run-key-persistence
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-014-NEG
  # The negative inverts ImageIsSignedInstaller, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
