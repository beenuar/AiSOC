id: hunt-shadow-copy-deletion
name: Volume shadow copies deleted
description: |
  Deleting every shadow copy is the step ransomware takes before encrypting, and it has almost no legitimate interactive use.
version: 1.0.0
severity: critical
category: endpoint
tags:
  - mitre.attack.t1490
  - hunt.endpoint
log_sources:
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Were shadow copies deleted, removing the local recovery path?
  indicators:
    - field: "source"
      equals: "sysmon"
    - field: "EventID"
      in: [1]
    - field: "CommandLine"
      regex: "(?i)(vssadmin|wmic).{0,40}(delete shadows|shadowcopy delete)"
expected:
  positive_incident_id: INC-HUNT-045
  positive_template_id: hunt-shadow-copy-deletion
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-045-NEG
  # The negative inverts CommandLine, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1490/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
