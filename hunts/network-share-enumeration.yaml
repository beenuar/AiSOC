id: hunt-network-share-enumeration
name: Host enumerated administrative shares across many peers
description: |
  Backup and management agents touch administrative shares on a handful of known hosts. Touching sixty in ten minutes is a sweep.
version: 1.0.0
severity: medium
category: network
tags:
  - mitre.attack.t1135
  - hunt.network
log_sources:
  - windows_security
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did one host connect to administrative shares on an unusual number of peers?
  indicators:
    - field: "source"
      equals: "windows_security"
    - field: "EventID"
      in: [5140]
    - field: "ShareName"
      regex: "(?i)\\\\\\\\\\*\\\\(ADMIN|C|IPC)\\$"
    - field: "distinctPeersLast10Min"
      gte: 20
expected:
  positive_incident_id: INC-HUNT-031
  positive_template_id: hunt-network-share-enumeration
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-031-NEG
  # The negative inverts distinctPeersLast10Min, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1135/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
