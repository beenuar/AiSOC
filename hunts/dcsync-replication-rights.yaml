id: hunt-dcsync-replication-rights
name: Directory replication requested by a non-domain-controller account
description: |
  DCSync abuses the same replication rights domain controllers use legitimately. Replication between DCs is routine; the same request from an ordinary account is not.
version: 1.0.0
severity: critical
category: identity
tags:
  - mitre.attack.t1003.006
  - hunt.identity
log_sources:
  - windows_security
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did an account that is not a domain controller request directory replication rights?
  indicators:
    - field: "source"
      equals: "windows_security"
    - field: "EventID"
      in: [4662]
    - field: "Properties"
      regex: "1131f6a[ad]-9c07-11d1-f79f-00c04fc2dcd2"
    - field: "SubjectIsDomainController"
      equals: false
expected:
  positive_incident_id: INC-HUNT-008
  positive_template_id: hunt-dcsync-replication-rights
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-008-NEG
  # The negative inverts SubjectIsDomainController, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1003/006/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
