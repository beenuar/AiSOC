id: hunt-gcp-service-account-key-created
name: Long-lived service account key created
description: |
  A downloadable key is a credential that leaves the platform and never expires. Pipelines still mint them for legacy systems; a person minting one usually wants it locally.
version: 1.0.0
severity: high
category: cloud
tags:
  - mitre.attack.t1098.001
  - hunt.cloud
log_sources:
  - gcp_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a downloadable service account key created despite workload identity being available?
  indicators:
    - field: "source"
      equals: "gcp_audit"
    - field: "methodName"
      regex: "(?i)\\.CreateServiceAccountKey$"
    - field: "performedByPipeline"
      equals: false
expected:
  positive_incident_id: INC-HUNT-053
  positive_template_id: hunt-gcp-service-account-key-created
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-053-NEG
  # The negative inverts performedByPipeline, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
