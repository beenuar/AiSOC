id: hunt-osquery-agent-stopped-reporting
name: Endpoint agent stopped reporting while the host stayed reachable
description: |
  Laptops go offline all the time, which is why silence alone means nothing. Silence from a host that is still answering means something stopped the agent.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1562.001
  - hunt.endpoint
log_sources:
  - osquery
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did an agent go silent on a host that is still answering on the network?
  indicators:
    - field: "source"
      equals: "osquery"
    - field: "agentSilentMinutes"
      gte: 60
    - field: "hostStillReachable"
      equals: true
expected:
  positive_incident_id: INC-HUNT-062
  positive_template_id: hunt-osquery-agent-stopped-reporting
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-062-NEG
  # The negative inverts hostStillReachable, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
