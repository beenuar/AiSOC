id: hunt-linux-cron-added-outside-package-manager
name: Cron entry created outside a package installation
description: |
  Package installs write cron entries routinely. A web-server account writing its own crontab is a different thing.
version: 1.0.0
severity: medium
category: endpoint
tags:
  - mitre.attack.t1053.003
  - hunt.endpoint
log_sources:
  - linux_auditd
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a cron file written by something other than the package manager?
  indicators:
    - field: "source"
      equals: "linux_auditd"
    - field: "syscall"
      equals: "openat"
    - field: "path"
      regex: "^/(etc/cron|var/spool/cron)"
    - field: "parentIsPackageManager"
      equals: false
expected:
  positive_incident_id: INC-HUNT-015
  positive_template_id: hunt-linux-cron-added-outside-package-manager
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-015-NEG
  # The negative inverts parentIsPackageManager, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
