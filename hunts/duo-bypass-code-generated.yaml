id: hunt-duo-bypass-code-generated
name: Multi-factor bypass code generated for an account
description: |
  Bypass codes exist because people lose phones, and the ticket is the record of that. A bypass with no ticket behind it is second-factor removal without a reason.
version: 1.0.0
severity: high
category: identity
tags:
  - mitre.attack.t1556.006
  - hunt.identity
log_sources:
  - duo
  - jumpcloud
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a bypass code generated for an account that was not in a recorded lockout?
  indicators:
    - field: "source"
      equals: "duo"
    - field: "action"
      equals: "bypass_create"
    - field: "hasOpenLockoutTicket"
      equals: false
expected:
  positive_incident_id: INC-HUNT-059
  positive_template_id: hunt-duo-bypass-code-generated
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-059-NEG
  # The negative inverts hasOpenLockoutTicket, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1556/006/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
