id: hunt-k8s-audit-policy-weakened
name: Kubernetes audit or admission policy removed
description: |
  GitOps controllers reconcile webhook configurations constantly. A human deleting one removes the control that would have refused the next pod.
version: 1.0.0
severity: high
category: cloud
tags:
  - mitre.attack.t1562.001
  - hunt.cloud
log_sources:
  - kubernetes_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was an admission or audit policy deleted from the cluster?
  indicators:
    - field: "source"
      equals: "kubernetes_audit"
    - field: "verb"
      in: ["delete", "patch"]
    - field: "resource"
      in: ["validatingwebhookconfigurations", "auditsinks"]
    - field: "performedByPipeline"
      equals: false
expected:
  positive_incident_id: INC-HUNT-024
  positive_template_id: hunt-k8s-audit-policy-weakened
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-024-NEG
  # The negative inverts performedByPipeline, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
