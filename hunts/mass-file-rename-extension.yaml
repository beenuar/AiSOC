id: hunt-mass-file-rename-extension
name: Large number of files renamed to a single new extension
description: |
  Batch processing renames thousands of files legitimately. An extension no installed application claims is what distinguishes encryption from a render farm.
version: 1.0.0
severity: critical
category: endpoint
tags:
  - mitre.attack.t1486
  - hunt.endpoint
log_sources:
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did one process rename a large number of files to the same unfamiliar extension?
  indicators:
    - field: "source"
      equals: "sysmon"
    - field: "EventID"
      in: [11]
    - field: "filesRenamedLast5Min"
      gte: 500
    - field: "extensionIsKnownApplication"
      equals: false
expected:
  positive_incident_id: INC-HUNT-046
  positive_template_id: hunt-mass-file-rename-extension
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-046-NEG
  # The negative inverts extensionIsKnownApplication, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1486/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
