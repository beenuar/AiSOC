id: hunt-jamf-device-unenrolled
name: Managed device removed from device management
description: |
  Devices are retired constantly. A user unenrolling their own machine removes every control and every source of telemetry from it at once.
version: 1.0.0
severity: medium
category: endpoint
tags:
  - mitre.attack.t1562.001
  - hunt.endpoint
log_sources:
  - jamf
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a device unenrolled from management by someone other than IT?
  indicators:
    - field: "source"
      equals: "jamf"
    - field: "event"
      equals: "ComputerRemoved"
    - field: "actorIsItAdmin"
      equals: false
expected:
  positive_incident_id: INC-HUNT-057
  positive_template_id: hunt-jamf-device-unenrolled
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-057-NEG
  # The negative inverts actorIsItAdmin, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
