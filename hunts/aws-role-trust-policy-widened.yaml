id: hunt-aws-role-trust-policy-widened
name: IAM role trust policy widened to an external principal
description: |
  Trust policies are edited as part of ordinary integration work. Trusting a principal outside the organisation hands standing access to somebody else's account.
version: 1.0.0
severity: critical
category: cloud
tags:
  - mitre.attack.t1098.001
  - hunt.cloud
log_sources:
  - aws_cloudtrail
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a role's trust policy changed to allow an account outside the organisation to assume it?
  indicators:
    - field: "source"
      equals: "aws_cloudtrail"
    - field: "eventName"
      in: ["UpdateAssumeRolePolicy", "CreateRole"]
    - field: "trustsExternalPrincipal"
      equals: true
expected:
  positive_incident_id: INC-HUNT-050
  positive_template_id: hunt-aws-role-trust-policy-widened
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-050-NEG
  # The negative inverts trustsExternalPrincipal, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
