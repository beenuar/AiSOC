id: hunt-wmi-remote-process-creation
name: Process created remotely over WMI
description: |
  Management servers drive WMI across the estate constantly. WMI-spawned processes arriving on an ordinary workstation are how lateral movement looks.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1047
  - hunt.endpoint
log_sources:
  - sysmon
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was a process created by the WMI provider host on a workstation?
  indicators:
    - field: "source"
      equals: "sysmon"
    - field: "EventID"
      in: [1]
    - field: "ParentImage"
      iendswith: "\\wmiprvse.exe"
    - field: "hostClass"
      equals: "workstation"
expected:
  positive_incident_id: INC-HUNT-028
  positive_template_id: hunt-wmi-remote-process-creation
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-028-NEG
  # The negative inverts hostClass, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1047/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
