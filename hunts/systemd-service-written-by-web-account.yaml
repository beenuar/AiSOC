id: hunt-systemd-service-written-by-web-account
name: systemd unit file created by a service account that serves traffic
description: |
  Configuration management writes unit files constantly. The account class is what separates a deployment from a web process that has been made to write one.
version: 1.0.0
severity: high
category: endpoint
tags:
  - mitre.attack.t1543.002
  - hunt.endpoint
log_sources:
  - linux_auditd
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did a web or application service account create a systemd unit?
  indicators:
    - field: "source"
      equals: "linux_auditd"
    - field: "path"
      regex: "^/(etc|lib|usr/lib)/systemd/system/"
    - field: "accountClass"
      equals: "web"
expected:
  positive_incident_id: INC-HUNT-016
  positive_template_id: hunt-systemd-service-written-by-web-account
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-016-NEG
  # The negative inverts accountClass, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1543/002/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
