id: hunt-email-forwarding-rule-external
name: Inbox rule forwarding mail to an external address
description: |
  Delegating mail internally is routine. Forwarding it to an address the organisation does not control is the standard follow-through after a mailbox compromise.
version: 1.0.0
severity: high
category: identity
tags:
  - mitre.attack.t1114.003
  - hunt.identity
log_sources:
  - m365_audit
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Was an inbox rule created that forwards mail outside the organisation?
  indicators:
    - field: "source"
      equals: "m365_audit"
    - field: "Operation"
      in: ["New-InboxRule", "Set-InboxRule"]
    - field: "forwardsExternally"
      equals: true
expected:
  positive_incident_id: INC-HUNT-040
  positive_template_id: hunt-email-forwarding-rule-external
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-040-NEG
  # The negative inverts forwardsExternally, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1114/003/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
