id: hunt-ad-enumeration-burst
name: Directory enumeration burst from one host
description: |
  Identity-management servers enumerate the directory by design. A marketing workstation reading three thousand objects in ten minutes is running a discovery tool.
version: 1.0.0
severity: medium
category: identity
tags:
  - mitre.attack.t1087.002
  - hunt.identity
log_sources:
  - windows_security
schedule:
  enabled: true
  interval_minutes: 60
  jitter_seconds: 60
hypothesis:
  question: |
    Did one host enumerate an unusual number of directory objects in a short window?
  indicators:
    - field: "source"
      equals: "windows_security"
    - field: "EventID"
      in: [4661, 4662]
    - field: "objectsEnumeratedLast10Min"
      gte: 500
    - field: "hostClass"
      equals: "workstation"
expected:
  positive_incident_id: INC-HUNT-029
  positive_template_id: hunt-ad-enumeration-burst
  min_match_score: 0.8
  negative_incident_id: INC-HUNT-029-NEG
  # The negative inverts hostClass, the clause this hunt is about,
  # and holds every other field constant. A negative that differed in the
  # log source would pass without testing anything.
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: AiSOC
created: '2026-09-27'
modified: '2026-09-27'
