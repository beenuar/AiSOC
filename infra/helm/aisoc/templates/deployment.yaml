{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisoc.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "aisoc.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicaCount | default 2 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aisoc.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "aisoc.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "aisoc.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "aisoc.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $name }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "aisoc.selectorLabels" $ | nindent 14 }}
              app.kubernetes.io/component: {{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort | default 8000 }}
              protocol: TCP
            {{- if $svc.metricsPort }}
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if eq $name "web" }}
            {{- /*
              The console proxies every browser request to these addresses.
              They have to be named here because the published image is built
              against the Compose network's DNS (`http://api:8000`), and no
              such host exists in a cluster — the chart's Services are
              `<release>-api`, `<release>-agents`, `<release>-realtime`. The
              chart set none of them, so a Helm install rendered a console
              whose every API call resolved nowhere.

              Setting them was necessary and not sufficient: until
              apps/web/docker-entrypoint.sh shipped, these were read by
              nothing at run time, because `next build` compiles rewrite
              destinations into .next/routes-manifest.json. An image older
              than that entrypoint will ignore these and still dial
              `http://api:8000`.

              `values.yaml`'s `services.web.env` wins, for an API that lives
              outside the release.
            */}}
            {{- $fullname := include "aisoc.fullname" $ }}
            {{- $webEnv := $svc.env | default dict }}
            {{- range $upstream, $target := dict "API_URL" "api" "AGENTS_URL" "agents" "REALTIME_URL" "realtime" }}
            {{- if not (hasKey $webEnv $upstream) }}
            {{- $targetSvc := get $.Values.services $target }}
            - name: {{ $upstream }}
              value: "http://{{ $fullname }}-{{ $target }}:{{ $targetSvc.service.port | default 80 }}"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "aisoc.fullname" $ }}-secrets
                optional: true
            - configMapRef:
                name: {{ include "aisoc.fullname" $ }}-config
                optional: true
          livenessProbe:
            httpGet:
              path: {{ $svc.healthCheckPath | default "/health" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default ($svc.healthCheckPath | default "/health") }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- if $svc.resources }}
            {{- toYaml $svc.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $svc.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range $svc.extraVolumes }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
{{- end }}
