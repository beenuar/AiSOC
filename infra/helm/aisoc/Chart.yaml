apiVersion: v2
name: aisoc
description: AiSOC - the open-source, AI-native Security Operations Center
type: application
# The *chart's* own version, independent of `appVersion` below, and it has to
# move whenever anything in this directory does. v13.0.0 bumped `appVersion`
# and left this at 5.9.2, so `helm push` republished an existing chart version
# pointing at a different application — one immutable-by-convention coordinate
# meaning two things depending on when it was pulled. A major here rather than
# a minor because the application this chart installs has a breaking change
# (see the v13.0.0 BREAKING section): a chart consumer running `helm upgrade`
# gets it, whatever the templates did or did not do.
version: 6.0.0
# Used as the image tag wherever a `tag:` in values.yaml is left empty, so
# it has to be a tag the registry actually holds — it read "5.2.0", which
# exists for no image, so every pod of a default install would have gone to
# ImagePullBackOff. scripts/check_published_images.py resolves it the same
# way the templates do and fails when it names nothing.
appVersion: "v13.0.0"

keywords:
  - security
  - soc
  - ai
  - siem
  - soar
  - xdr
  - mitre-attack

home: https://github.com/beenuar/AiSOC
sources:
  - https://github.com/beenuar/AiSOC

maintainers:
  - name: AiSOC Maintainers
    url: https://github.com/beenuar/AiSOC

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
