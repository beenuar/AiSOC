apiVersion: v2
name: aisoc
description: AiSOC - the open-source, AI-native Security Operations Center
type: application
# The *chart's* own version, independent of `appVersion` below, and it has to
# move whenever anything in this directory does. v13.0.0 bumped `appVersion`
# and left this at 5.9.2, so `helm push` republished an existing chart version
# pointing at a different application — one immutable-by-convention coordinate
# meaning two things depending on when it was pulled. The 5.x → 6.x boundary
# is where that breaking application change (see the v13.0.0 BREAKING section)
# is announced: a consumer moving off the published 5.9.2 crosses a major and
# knows to read the notes, whatever the templates did or did not do.
#
# 6.0.0 itself never reached the registry — it landed on `main` after the
# v13.0.0 tag, and only a tag push publishes — so the first pullable 6.x was
# 6.0.1. A patch, because the only thing that moved inside this directory was
# `appVersion` naming a patch release: no template, no default and no values
# key added, removed or renamed, so no consumer's values file changed.
# 6.0.0 is not reused for it. It is already declared on `main` against
# appVersion v13.0.0, and a version that names two applications is the defect
# the 5.9.2 overwrite taught; unpublished is not the same as free.
#
# 7.0.0 for v14.0.0 on the same reasoning the 5.x → 6.x boundary used. No
# template and no values key moved here either, but the application behind
# the chart refuses grants it used to accept (see the v14.0.0 BREAKING
# section), and the chart's major is the only coordinate a consumer pulling
# `oci://ghcr.io/beenuar/charts/aisoc` sees before they install it.
version: 7.6.0
# Used as the image tag wherever a `tag:` in values.yaml is left empty, so
# it has to be a tag the registry actually holds — it read "5.2.0", which
# exists for no image, so every pod of a default install would have gone to
# ImagePullBackOff. scripts/check_published_images.py resolves it the same
# way the templates do and fails when it names nothing.
appVersion: "v18.0.0"

keywords:
  - security
  - soc
  - ai
  - siem
  - soar
  - xdr
  - mitre-attack

home: https://github.com/beenuar/AiSOC
sources:
  - https://github.com/beenuar/AiSOC

maintainers:
  - name: AiSOC Maintainers
    url: https://github.com/beenuar/AiSOC

dependencies:
  - name: postgresql
    version: "13.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
