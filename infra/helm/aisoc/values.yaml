# AiSOC Helm Chart Values
# Default values for production HA deployment

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  environment: production
  logLevel: info
  otelEndpoint: ""
  extraConfig: {}

# ─── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

# ─── Services map (drives deployment.yaml, hpa.yaml, pdb.yaml, service.yaml) ─
services:
  api:
    image:
      repository: ghcr.io/beenuar/aisoc-core-api
      tag: ""  # defaults to Chart.AppVersion
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 8000
    metricsPort: 9090
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      cpuTargetUtilization: 70
      memTargetUtilization: 80
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  ingest:
    image:
      repository: ghcr.io/beenuar/aisoc-ingest
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 3
    containerPort: 8001
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      cpuTargetUtilization: 60
      memTargetUtilization: 75
    pdb:
      enabled: true
      minAvailable: 2
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  enrichment:
    image:
      repository: ghcr.io/beenuar/aisoc-enrichment
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 8002
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 800m
        memory: 1Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      cpuTargetUtilization: 70
      memTargetUtilization: 80
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  alert-fusion:
    image:
      repository: ghcr.io/beenuar/aisoc-alert-fusion
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 8003
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpuTargetUtilization: 65
      memTargetUtilization: 75
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  agents:
    image:
      repository: ghcr.io/beenuar/aisoc-agents
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 8004
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpuTargetUtilization: 60
      memTargetUtilization: 70
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  web:
    image:
      repository: ghcr.io/beenuar/aisoc-web
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 3000
    healthCheckPath: /api/health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      cpuTargetUtilization: 70
      memTargetUtilization: 80
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

  realtime:
    image:
      repository: ghcr.io/beenuar/aisoc-realtime
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    containerPort: 4000
    healthCheckPath: /health
    service:
      type: ClusterIP
      port: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      cpuTargetUtilization: 70
      memTargetUtilization: 80
    pdb:
      enabled: true
      minAvailable: 1
    env: {}
    extraVolumes: []
    extraVolumeMounts: []

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
  hosts:
    - host: aisoc.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
          port: 80
        - path: /ws
          pathType: Prefix
          service: realtime
          port: 80
        - path: /
          pathType: Prefix
          service: web
          port: 80
  tls:
    - secretName: aisoc-tls
      hosts:
        - aisoc.example.com

# ─── Standalone service deployments ───────────────────────────────────────────
# ueba-deployment.yaml, honeytokens-deployment.yaml and purple-team-deployment.yaml
# have shipped referencing .Values.ueba / .Values.honeytokens / .Values.purpleTeam,
# none of which existed here. `helm lint` failed and `helm template` errored on
# a nil pointer, so the chart could not be rendered at all, let alone installed —
# which is also why nobody noticed the missing keys.
ueba:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/beenuar/aisoc-ueba
    tag: ""              # defaults to Chart.AppVersion
    pullPolicy: IfNotPresent
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

honeytokens:
  enabled: false
  replicaCount: 1
  tokenTtlDays: 90
  otelEndpoint: ""
  image:
    repository: ghcr.io/beenuar/aisoc-honeytokens
    tag: ""
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

purpleTeam:
  enabled: false
  replicaCount: 1
  calderaUrl: ""
  artAtomicsPath: /opt/atomics
  otelEndpoint: ""
  image:
    repository: ghcr.io/beenuar/aisoc-purple-team
    tag: ""
    pullPolicy: IfNotPresent
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Referenced by ueba-deployment.yaml; also absent until now.
kafka:
  bootstrapServers: "kafka:9092"

otel:
  endpoint: ""

# ─── Scheduled backups ────────────────────────────────────────────────────────
# scripts/backup.sh has been correct and unscheduled: every deployment guide
# said "run it on a cron" and none shipped one, so the realistic state of a
# self-hosted install was no backups. This is the same script the DR gate
# exercises in CI, so what runs here is what has been proven to restore.
#
# Disabled by default because it needs a bucket, credentials and an encryption
# key that only the operator can supply — and a CronJob that fails every night
# is worse than an absent one.
backup:
  enabled: false
  # 02:30 daily. The RPO this implies is the schedule interval: anything
  # ingested since the last successful run is lost in a full-restore scenario.
  schedule: "30 2 * * *"
  timeZone: "UTC"
  component: all          # postgres|clickhouse|plugins|neo4j|qdrant|redis|all
  retentionDays: 30

  image:
    repository: ghcr.io/beenuar/aisoc-core-api
    tag: ""               # defaults to Chart.AppVersion
    pullPolicy: IfNotPresent

  s3:
    bucket: ""            # s3://your-bucket (required)
    prefix: "aisoc-backups"
    region: "us-east-1"
    endpointUrl: ""       # set for R2 / MinIO / any S3-compatible store

  encryption:
    mode: "on"            # "off" only if the bucket provides equivalent protection
    existingSecret: ""    # holds the 64-hex AES-256-GCM key
    secretKey: "backup-encryption-key"

  # Credentials and store URLs, by secret reference. Values are never inlined
  # here: a backup job reads every database in the deployment, so its env is
  # the highest-value secret set in the chart.
  #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / POSTGRES_URL /
  #   CLICKHOUSE_PASSWORD / NEO4J_PASSWORD / REDIS_URL
  secretEnv: {}
  #   AWS_ACCESS_KEY_ID:
  #     secretName: aisoc-backup-secret
  #     secretKey: aws-access-key-id

  # Non-secret endpoints (NEO4J_URI, NEO4J_HTTP_URL, QDRANT_URL, CLICKHOUSE_HOST…).
  extraEnv: {}

  # A stuck job blocks every later run because concurrencyPolicy is Forbid.
  activeDeadlineSeconds: 7200
  startingDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  scratchSize: 20Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ─── Bundled Infrastructure (disable in production; use managed services) ─────
postgresql:
  enabled: false
  auth:
    database: aisoc
    username: aisoc
    existingSecret: aisoc-postgres-secret
  primary:
    persistence:
      size: 100Gi

redis:
  enabled: false
  auth:
    existingSecret: aisoc-redis-secret
  master:
    persistence:
      size: 20Gi

# ─── Legacy top-level keys (kept for backward compat with core-api-deployment.yaml) ─
coreApi:
  enabled: false  # Replaced by services.api above

# ─── Network Policies ─────────────────────────────────────────────────────────
#
# Egress default-deny. This is the network half of "runs entirely on your
# infrastructure": the redaction half is gated by test_privacy_redactor, and
# until v9.0 nothing stopped a pod opening a socket to anywhere.
#
# Off by default on purpose. A cluster whose CNI does not enforce
# NetworkPolicy ignores this object silently, and a control that is silently
# ignored is worse than one an operator consciously switched on — it reads as
# protection while providing none. Check your CNI, then set this.
networkPolicy:
  enabled: false
  # Destinations reachable outside the release: vendor APIs, an LLM endpoint,
  # a SIEM. 169.254.169.254 is excluded from each of these automatically.
  allowedEgressCIDRs: []

# ─── Pod Security ─────────────────────────────────────────────────────────────
podSecurityPolicy:
  enabled: false
