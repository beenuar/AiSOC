# ─── AiSOC LiteLLM gateway config (issue #478) ──────────────────────────────────
#
# LiteLLM is the single entry point for every *live* LLM call AiSOC makes. AiSOC
# asks for a logical **task alias** (the `model_name` values below); this file —
# and only this file — decides which real provider/model each alias resolves to.
# Operators re-point a task to a different local or hosted model here, with no
# AiSOC code change and no redeploy of the app services.
#
#   AiSOC task ──▶ alias (e.g. "aisoc-triage") ──▶ LiteLLM ──▶ real model
#
# The aliases below mirror AiSOC's distinct LLM workloads. Keep this set in sync
# with the role pins in services/agents/app/llm/model_pins.py — the agents test
# `test_litellm_config.py` asserts they match.
#
# Every alias resolves its credential from the process env (os.environ/...), so
# no secret is ever written to this file. Point AiSOC at the gateway by setting
# (see .env.example):
#     OPENAI_BASE_URL=http://litellm:4000/v1
#     OPENAI_API_KEY=$LITELLM_MASTER_KEY
#
# ── WHICH MODEL ANSWERS, AND HOW TO CHANGE IT ─────────────────────────────────
#
# Every alias below takes its backend from the environment rather than naming
# one inline, and docker-compose.yml supplies the defaults. Out of the box those
# defaults point at the **Ollama service bundled in CORE**, running a pinned
# ~2 GB llama3.2:3b-instruct-q4_K_M sized for CPU-only inference in 8 GB of RAM.
# That is why a default `make up` can do real AI triage with no API key and no
# account: the local model is the floor, not a stub.
#
# It is a 3B quantized model. It is genuinely doing the work — real tokens, real
# cost accounting, real generated text — and it is not as good as a frontier
# model. **To upgrade**, put a provider key in `.env` and set the two model
# variables beside it:
#
#     OPENAI_API_KEY=sk-...
#     AISOC_LLM_MODEL_FAST=openai/gpt-4o-mini
#     AISOC_LLM_MODEL_DEEP=openai/gpt-4o
#     AISOC_LLM_API_BASE=
#
# then `make up` again. No code change, no profile change, no edit to this file.
# Air-gapped deployments keep the defaults and never set a key.
#
# When no live model is reachable at all AiSOC still degrades to its
# deterministic offline path (the `deterministic` floor in model_pins.py) and
# reports zero model calls and zero tokens rather than pretending to triage.

model_list:
  # ── Auto-triage: high volume, cheap+fast. ─────────────────────────────────────
  - model_name: aisoc-triage
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_FAST
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Recon / enrichment reasoning. ─────────────────────────────────────────────
  - model_name: aisoc-recon
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_FAST
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Deep investigation: the multi-step reasoning path — worth a stronger model.
  - model_name: aisoc-investigation
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_DEEP
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Contextual copilot: interactive analyst Q&A. ──────────────────────────────
  - model_name: aisoc-copilot
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_FAST
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Summaries: alert/incident condensation. ───────────────────────────────────
  - model_name: aisoc-summary
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_FAST
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Reports: analyst-facing write-ups — quality over cost. ────────────────────
  - model_name: aisoc-report
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_DEEP
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Natural-language generation: NL→query / NL→detection translation. ─────────
  - model_name: aisoc-nl
    litellm_params:
      model: os.environ/AISOC_LLM_MODEL_FAST
      api_base: os.environ/AISOC_LLM_API_BASE
      api_key: os.environ/OPENAI_API_KEY

  # ── Other backends ────────────────────────────────────────────────────────────
  # The two variables above take any LiteLLM model string, so most swaps need no
  # edit here at all:
  #
  #   self-hosted vLLM   AISOC_LLM_MODEL_DEEP=openai/Qwen2.5-32B-Instruct
  #                      AISOC_LLM_API_BASE=http://vllm:8000/v1
  #   Anthropic          AISOC_LLM_MODEL_DEEP=anthropic/claude-3-5-sonnet-latest
  #                      ANTHROPIC_API_KEY=...   (and clear AISOC_LLM_API_BASE)
  #   a bigger local     AISOC_LLM_MODEL_DEEP=ollama_chat/llama3.1:8b
  #                      (pull it first: docker compose exec ollama ollama pull llama3.1:8b)
  #
  # Per-alias divergence — a different model for one workload only — is the case
  # that does need an edit: replace that alias's `os.environ/...` with a literal.

# ── Gateway behaviour ─────────────────────────────────────────────────────────
litellm_settings:
  # Silently drop provider-specific params a given backend doesn't support, so
  # the same AiSOC request body works across OpenAI / Ollama / vLLM / Anthropic.
  drop_params: true
  # Per-request latency, tokens, cost, errors, retries and fallbacks are exported
  # on GET /metrics for Prometheus (scraped as job `aisoc-litellm`). This is the
  # centralized observability layer that complements the Investigation Ledger.
  callbacks: ["prometheus"]
  # Prometheus scrapes /metrics with no Authorization header; LiteLLM otherwise
  # requires auth on that endpoint (and the auth path needs the DB layer). Allow
  # unauthenticated scrapes so the `aisoc-litellm` job actually collects. The
  # port is bound to 127.0.0.1 in compose, so /metrics isn't publicly exposed.
  require_auth_for_metrics_endpoint: false
  # Never wait forever on a stalled provider — fall through to AiSOC's own
  # deterministic path instead of hanging the alert drawer.
  request_timeout: 60

# ── Router: retries + cross-model fallbacks ───────────────────────────────────
# model_pins.py documents that "the LiteLLM gateway owns any model-level
# fallback" — this block makes that real. Without it each alias had exactly one
# model and zero failover, so a single provider blip dropped straight to the
# offline deterministic floor.
router_settings:
  # Retry a transient failure (rate limit / 5xx / timeout) on the same alias
  # before falling back.
  num_retries: 2
  # Cross-model failover: if an alias's primary model keeps failing, route the
  # request to an adjacent/cheaper alias so quality degrades gracefully instead
  # of dropping to heuristics. Keys are the requested alias; values are ordered
  # fallbacks.
  fallbacks:
    - aisoc-investigation: ["aisoc-triage"]
    - aisoc-report: ["aisoc-summary"]
    - aisoc-recon: ["aisoc-triage"]
    - aisoc-copilot: ["aisoc-triage"]
    - aisoc-nl: ["aisoc-triage"]
  # Trip a per-model cooldown after repeated failures so a wedged provider stops
  # being tried for a short window.
  allowed_fails: 3
  cooldown_time: 30

general_settings:
  # Clients (the AiSOC services) authenticate to the gateway with this key. Set
  # it in the environment; AiSOC sends it as its OPENAI_API_KEY when
  # OPENAI_BASE_URL points here. Never commit a real key.
  master_key: os.environ/LITELLM_MASTER_KEY
