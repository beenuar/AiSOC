# GENERATED by scripts/generate_slo_alerts.py — do not edit.
#
# Thresholds come from docs/operations/slos.yaml. Editing them here makes
# the alert disagree with the objective it exists to enforce, which is the
# state this file was written to end: the SLOs declared targets nothing
# alerted on, and the alerts used thresholds no objective justified.
#
# Only services that expose /metrics are covered. An alert on a service
# Prometheus does not scrape can never fire, and an alert that can never
# fire reads as coverage.

groups:
- name: aisoc-slo
  rules:
  - alert: SloAgentsErrorBudgetFastBurn
    expr: |-
      sum(rate(aisoc_http_requests_total{job="aisoc-agents",status=~"5.."}[1h]))
        / clamp_min(sum(rate(aisoc_http_requests_total{job="aisoc-agents"}[1h])), 0.001)
        > 0.144000
    for: 5m
    labels:
      severity: page
      service: agents
      slo: availability
    annotations:
      summary: agents is burning its error budget fast
      description: At this rate agents consumes 2% of its 30-day error budget every 1h. Target is 99.000% availability (docs/operations/slos.yaml).
  - alert: SloAgentsErrorBudgetSlowBurn
    expr: |-
      sum(rate(aisoc_http_requests_total{job="aisoc-agents",status=~"5.."}[6h]))
        / clamp_min(sum(rate(aisoc_http_requests_total{job="aisoc-agents"}[6h])), 0.001)
        > 0.120000
    for: 30m
    labels:
      severity: ticket
      service: agents
      slo: availability
    annotations:
      summary: agents is steadily burning its error budget
      description: "Not an outage, which is why this is a ticket rather than a page \u2014 but at this rate agents exhausts its 30-day budget without any single incident to point at."
  - alert: SloAgentsLatencyBudgetMissed
    expr: |-
      histogram_quantile(0.95, sum by (le) (rate(aisoc_http_request_duration_seconds_bucket{job="aisoc-agents"}[30m])))
        > 120.000
    for: 15m
    labels:
      severity: ticket
      service: agents
      slo: latency
    annotations:
      summary: agents p95 latency is over its objective
      description: p95 above 120000 ms, the target in docs/operations/slos.yaml. Measured over 30 minutes so a single slow request does not page.
