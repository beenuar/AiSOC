id: sophos-central
name: Sophos Central Connector
version: "1.0.0"
plugin_type: connector
tier: stable
description: >
  Sophos Central alerts via the SIEM Integration API: endpoint and server
  threats, exploit and ransomware protection and intrusion prevention. The
  tenant and its data region are discovered from the API credential, and a
  partner or organization credential reads the one tenant it is pointed at.
  Sophos publishes LOW, MEDIUM and HIGH and no fourth tier, so no alert is
  ever promoted to critical. Read-only; nothing here changes an alert.
author: AiSOC Core Team
tags: [edr, endpoint, sophos, sophos-central, alerts]
homepage: https://github.com/beenuar/AiSOC/tree/main/services/connectors/app/connectors/sophos_central.py
license: MIT
min_aisoc_version: "23.2.0"
config_schema:
  type: object
  required: [client_id, client_secret]
  properties:
    client_id:
      type: string
      description: Client ID of a Sophos Central API credential.
    client_secret:
      type: string
      description: Client secret of the API credential, created under Global Settings → API Credentials Management.
      secret: true
    tenant_id:
      type: string
      description: Leave blank for a tenant credential. Required for a partner or organization credential — the ID of the tenant to read.
