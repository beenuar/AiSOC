# Security scanner ceilings and suppressions.
#
# Read by scripts/check_scanner_ratchet.py, which runs as a blocking step in
# each of the three observe-mode scanner jobs in .github/workflows/security.yml.
# Until that gate was written this file had no reader at all: the workflow
# described its scanners as "report-and-ratchet" and named this path as where
# the triaged baseline lives, and nothing opened it. An allow-list nobody
# reads is worse than no allow-list, because it looks like a control.
#
# ── ceilings ────────────────────────────────────────────────────────────────
#
# A scanner may report at most this many findings. The ratchet is shrink-only:
# reporting fewer also fails, with the measured number in the message, so the
# ceiling comes down in the same change that removes the finding rather than
# leaving room for the count to drift back up for free. Reporting zero against
# a non-zero ceiling fails too — a scanner that previously found dozens and
# now finds none did not run, and "clean" must never look like "did not run".
#
# `measured_with` is compared against the version the report declares. Counts
# move when rules move, so a ceiling compared against a different scanner is
# not a comparison; the scanners are pinned exactly in the workflow for the
# same reason, because for a ratchet the scanner version is the behaviour.
#
# To lower a ceiling: fix findings, read the measured count out of the gate's
# failure message, and write it here in the same pull request.

ceilings:
  # Every number here was measured by this gate in CI, not carried over.
  # The counts the workflow header used to publish were 92/35 for semgrep and
  # 91 for checkov, and both were wrong the first time the ratchet compared
  # them: semgrep came back 101/40 because the tree has grown since anyone
  # looked, and checkov came back 219 because the 91 covered infra/terraform
  # while the job had always scanned infra/helm as well and reported only the
  # first number. That is the whole argument for the ratchet in one run — a
  # count nothing compares to anything drifts, and nobody finds out.
  semgrep:
    # 101 -> 102 (error unchanged at 40). The added WARNING is
    # `dynamic-urllib-use-detected` on scripts/check_main_run_cancellations.py,
    # which asks the Actions API whether a run on `main` was cancelled. It is
    # the same finding the identical call in check_codeql_alerts.py already
    # contributes: both build the URL from a fixed API root and refuse
    # anything that does not start with it, so the `file://` read the rule
    # warns about is not reachable — but the rule fires on any non-literal
    # argument to `urlopen`, and counting it is better than suppressing it.
    # `entries:` below stays empty on purpose: a ceiling counts a finding, a
    # suppression hides it.
    #
    # Unchanged at v12.1.0, and the reason is worth recording rather than
    # smoothing over. Fixing GHSA-w754-prh8-m56j removed one ERROR
    # (`use-defused-xml`, which fired on the PAN-OS client's
    # `xml.sax.saxutils` import — string escaping with no parser and no XXE
    # surface, which the rule cannot distinguish from parsing; replaced with
    # `html.escape`). CI measured 39/101 at that point and asked for the
    # ceiling to be lowered. Adding the rest of the release commit took the
    # measurement back to 40/102, and **I could not attribute which file
    # contributed the returning finding** — the scan covered the same 2,265
    # files both times and `main` had not moved. Left at the measured value
    # rather than lowered on a number that then moved under it; the honest
    # state is that the net is unchanged and one finding is unexplained.
    #
    # That +/-1 was reproduced on 2026-09-29, which upgrades it from a
    # one-off nobody could attribute to a property of the scan. Four
    # dependency pull requests, all based on 7d3e90a7, all changing nothing
    # but a `poetry.lock`, ran this job within thirteen minutes of each other
    # against a ceiling of 102/40:
    #
    #   #1023  102 findings, error=40  -> pass
    #   #1035  102 findings, error=40  -> pass
    #   #1031  101 findings, error=39  -> FAIL (stale-ceiling)
    #   #1037  101 findings, error=39  -> FAIL (stale-ceiling)
    #
    # Every one reported `Ran 387 rules on 2267 files`, so it is not the
    # corpus and not the rule set. The obvious mechanism was checked and
    # **eliminated**: all four also reported the identical `Partially
    # scanned: 8 files` and `Scan skipped: 5 files`, so a file semgrep failed
    # to fully parse is not where the finding goes. The count simply differs
    # between runs of the same tree, and it moves `error` and `total`
    # together, which is why both sub-ceilings trip at once.
    #
    # Two consequences worth stating rather than discovering again. First,
    # this ratchet can fail a pull request that cannot possibly have changed
    # a finding — a lockfile-only dependency bump is the case observed twice
    # here, and a re-run clears it, so read a stale-ceiling failure on such a
    # change as this rather than as a stale branch. Second, and the reason
    # this is not merely noise: a gate that under-counts by one can just as
    # easily under-count a *real* finding into invisibility, because the
    # ratchet only fails on a count that disagrees with the ceiling and 39
    # against a ceiling of 39 would be silent. The ceiling stays at the
    # measured value; what is missing is an attribution, and the way to get
    # one is to retain `semgrep.json` as a run artefact and diff two runs of
    # the same tree. Nothing here does that yet.
    #
    # 102 -> 103 (error unchanged at 40). The added WARNING is a third
    # `dynamic-urllib-use-detected`, on scripts/check_required_check_substance.py,
    # which asks the Actions API which steps each required check actually
    # executed. It is byte-for-byte the same `_get` helper the two findings
    # above already count: the URL is built from a fixed API root and the
    # function refuses anything not starting with it, so the `file://` read
    # the rule warns about is unreachable — but the rule fires on any
    # non-literal argument to `urlopen`. Measured in isolation with
    # semgrep 1.86.0 on the same rule set the workflow uses: 205 rules over
    # the two new files, exactly 1 finding. Counted rather than suppressed,
    # for the reason stated at the bottom of this file.
    total: 103
    error: 40
    measured_with: "1.86.0"
  checkov:
    failed: 219
    measured_with: "3.2.334"
  tfsec:
    total: 32
    critical: 7
    high: 5
    measured_with: "1.28.13"

# ── suppressions ────────────────────────────────────────────────────────────
#
# Individual findings accepted as risk. Separate from the dependency-CVE
# ignore list at scripts/security_audit_ignores.txt.
#
# Schema, enforced by the gate:
#   entries:
#     - tool: semgrep|checkov|tfsec
#       id: <rule/check id>
#       path: <optional path glob>
#       reason: <why this is acceptable>       # required, non-empty
#       expires: YYYY-MM-DD                    # required, at most 90 days out
#
# An expired entry fails the build. Re-triage it or fix the finding; do not
# extend the date. Prefer lowering a ceiling over adding an entry here —
# a suppression hides a finding, a ceiling counts it.

entries: []
