version: 2

updates:
  # ── pnpm (web + root workspace) ──────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # `pnpm-workspace.yaml` excludes `apps/mobile` with a `!apps/mobile`
    # negation, and pnpm honours it: the root `pnpm-lock.yaml` has no
    # `apps/mobile` importer. Dependabot's manifest scan does not honour it.
    # It expands `apps/*`, finds `apps/mobile/package.json`, and proposes
    # updates for it from *this* entry — where none of the Expo holds written
    # into the `/apps/mobile` entry below apply, because that entry never sees
    # the dependency.
    #
    # That produced `expo-constants 18.0.14 -> 57.0.19`: the Expo SDK 57
    # release-train version of a package this repository pins to SDK 54, which
    # `pnpm install` resolves with `expo-router 6.0.24 unmet peer
    # expo-constants@^18.0.13`. It arrived with no lockfile change at all,
    # because from this entry's point of view the lockfile is the root one and
    # the root one does not contain the package.
    #
    # `exclude-paths` is version-updates-only, so the `/apps/mobile` entry
    # keeps sole ownership of that directory and its security alerts are
    # unaffected.
    exclude-paths:
      - "apps/mobile/**"
    groups:
      next-ecosystem:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      dev-tooling:
        # NOTE: `eslint*` and `@typescript-eslint/*` deliberately quarantined
        # below — see the `dev-tooling-eslint` group. ESLint 10 changed the
        # rule-context API in a way that `eslint-plugin-react@7.37.5`
        # doesn't support (`TypeError: contextOrFilename.getFilename is not
        # a function`), so the whole `eslint` family stays out of this group
        # until `eslint-plugin-react` ships an ESLint-10-compatible release.
        # Tracking issue: see the open `eslint-plugin-react / ESLint 10`
        # issue in this repo.
        patterns: ["typescript", "tailwindcss*", "postcss*"]
      dev-tooling-eslint:
        # Quarantined ESLint family. Dependabot still opens these PRs, but
        # they land separately so a single incompatible plugin can't block
        # the whole `dev-tooling` group from merging. Remove this group
        # (and merge it back into `dev-tooling`) once
        # `eslint-plugin-react` is ESLint-10-compatible.
        patterns: ["eslint*", "@typescript-eslint/*"]
      vitest:
        # `@vitest/coverage-v8` peer-requires `vitest` at the *exact* same
        # version, not a range — `@vitest/coverage-v8@4.1.10` declares
        # `peerDependencies: { vitest: "4.1.10" }`. Ungrouped, dependabot
        # proposes whichever one's manifest range is exceeded first and the
        # pair drifts; `pnpm install` on this lockfile already reports
        # `vitest 4.1.11 -> ✕ unmet peer @vitest/coverage-v8@4.1.11: found
        # 4.1.10`. Within a major that is survivable, which is exactly why it
        # went unnoticed. Grouping them means the next in-major bump is one
        # pull request that moves both or neither.
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # Hold `eslint` on v9: ESLint 10 removed the `context.getFilename()`
      # API that `eslint-plugin-react` (bundled via `eslint-config-next`)
      # still calls, so `pnpm run lint` crashes with
      # `TypeError: contextOrFilename.getFilename is not a function`.
      # Drop this ignore once `eslint-plugin-react` ships an
      # ESLint-10-compatible release, then bump the family in one pass.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Hold `typescript` on v6: TypeScript 7 (the native-port compiler)
      # fails `apps/web` type-checking (`Web — Lint & Type-check`). Moving
      # to TS 7 needs a dedicated migration PR with the web types fixed and
      # the whole toolchain re-verified — not a drive-by dependency bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Hold the Storybook family on v9. Storybook requires every
      # `@storybook/*` package (and `storybook` core) to share one major;
      # dependabot proposes them piecemeal (e.g. addon-themes 10 while core
      # is 9), which breaks the Storybook build. Bump the whole stack to 10
      # in one coordinated migration PR, then drop this ignore.
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
      # `@storybook/test-runner` needs its *minor* channel held too, and the
      # reason is a property of the rule shape rather than of this package:
      # `update-types: ["version-update:semver-major"]` cannot hold a 0.x
      # dependency, because for 0.x the breaking change arrives in the minor
      # slot. It is the only pre-1.0 member of the family, so the
      # `@storybook/*` rule above covered every other member and silently
      # covered nothing on this one.
      #
      # Measured on the 0.23.0 -> 0.24.5 proposal: 0.23.0 declares
      # `peerDependencies: { storybook: "^0.0.0-0 || ^8.2.0 || ^9.0.0" }` and
      # 0.24.5 declares `"^0.0.0-0 || ^10.0.0 || ... || ^11.0.0-0"`. Its
      # version line is independent of Storybook's, the way the Expo entry
      # below describes, but its *peer* tracks the Storybook major exactly —
      # so 0.24 is the Storybook 10 line of this package and installs against
      # this workspace's `storybook@9.1.20` as an unsatisfied peer.
      #
      # Nothing in CI can catch that: no workflow runs `test-storybook`, and
      # the only Storybook job runs `pnpm build-storybook`, which never loads
      # the runner. The proposal was green on all 22 required checks while
      # migrating the whole jest tree 29 -> 30 underneath it. Lift this with
      # the rest of the family in the Storybook 10 migration.
      - dependency-name: "@storybook/test-runner"
        update-types: ["version-update:semver-minor"]
      # Hold `vitest` and `@vitest/*` on v4. The group above keeps the family
      # together inside a major; the major itself needs more than a group,
      # because two of the three things it breaks are not dependency edges
      # dependabot can move.
      #
      # Measured on the 4.1.11 -> 5.0.1 proposal, which reached CI: all 59
      # test files and all 615 tests PASSED, and then the run failed with 59
      # unhandled rejections reading `TypeError: Expected string coverage
      # payload, received object` out of `V8CoverageProvider.onAfterSuiteRun`,
      # and a coverage report of `All files | 0 | 0 | 0 | 0`. vitest 5 changed
      # the shape of the V8 coverage payload, `@vitest/coverage-v8` stayed on
      # 4.1.10 because its own manifest range was still satisfied, and the
      # required `Web — Vitest smoke tests + coverage gate` is what caught it.
      # A reader skimming "615 passed" would not have.
      #
      # The second break is a resolution decision this file cannot express:
      # the root `pnpm.overrides` pins `@vitest/mocker` to `>=4.1.11 <5`,
      # while `vitest@5.0.1` depends on `@vitest/mocker@5.0.1`. The override
      # wins silently, so the proposal's lockfile carries a vitest 5 runtime
      # with a vitest 4 mocker.
      #
      # Moving to vitest 5 therefore means one commit that bumps `vitest` and
      # `@vitest/coverage-v8` in lockstep, raises the `@vitest/mocker`
      # override past 5, and re-verifies the two plugins that peer-depend on
      # vitest (`vitest-axe`, `@testing-library/jest-dom`). That is a
      # migration, not a dependency bump.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # ── apps/mobile ──────────────────────────────────────────────
  #
  # Its own install root, deliberately outside the pnpm workspace: React
  # Native needs Metro rather than Turbopack and brings an Expo dependency
  # tree that would add several hundred megabytes to every other TypeScript
  # CI job. That also means the `/` entry above does not cover it — and
  # Dependabot *alerts* scan every manifest regardless of this file, so
  # alerts appeared here that no update job could ever act on.
  #
  # Adding this entry made the directory visible to update jobs. It did not,
  # and cannot, make every advisory here actionable, and the difference is
  # worth writing down because the next person will read a red
  # `Dependabot Updates` run and look for a mistake in this file.
  #
  # A security update for a *transitive* npm dependency can only propose a
  # version the parent's own range permits. Two `image-size` advisories
  # (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr) are fixed in 2.0.3, and every
  # `metro` release that depends on `image-size` declares `^1.0.2` — so the
  # highest version Dependabot could install was 1.2.1 and it recorded
  # `security_update_not_possible`, which surfaces as a *failed job* rather
  # than as a pull request. Raising the parent was not a route either: the
  # only `@expo/metro` that drops `image-size` ships with Expo SDK 55, and
  # `expo` is pinned to 54 here.
  #
  # The fix for that class is a pnpm override in `apps/mobile/package.json`,
  # which is a resolution decision this file has no way to express.
  # `scripts/check_toolchain_pins.py` now compares the override sets and the
  # resolved versions of every install root against each other, so an
  # override applied in the workspace and not here fails CI instead of
  # sitting as an open alert nobody can action.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # Deliberately low. The first run against this directory opened fourteen
    # PRs at once and starved CI of runners for everything else.
    open-pull-requests-limit: 2
    labels: ["dependencies", "javascript", "mobile"]
    ignore:
      # Expo SDK packages do not version independently — they move together
      # with the SDK release, and their standalone version line is unrelated
      # to it. Dependabot reads `expo-linking@8.0.12 -> 57.0.10` as a major
      # bump; it is actually a different numbering scheme, and taking it
      # produces a package set no Expo SDK ever shipped. These move when
      # `expo` itself moves, via `npx expo install --fix`.
      - dependency-name: "expo-*"
      - dependency-name: "expo"
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      # Hold `typescript` on v6, for the same measured reason as the `/` and
      # `/services/realtime` entries above. This directory's CI gate is
      # `tsc --noEmit`, so a TypeScript 7 pull request reds it exactly the way
      # it reds `apps/web` — and it was the only Node install root running
      # `tsc` without the hold, which is the same shape as the `image-size`
      # finding: a decision taken for the workspace that never reached the
      # root installing separately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── services/realtime ────────────────────────────────────────
  #
  # npm rather than pnpm, with its own package-lock.json, so the root entry
  # does not reach it either. Three `qs` advisories sat here unactionable.
  - package-ecosystem: npm
    directory: /services/realtime
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript"]
    groups:
      # Four advisories here needed sdk-node, core, propagator-jaeger and
      # exporter-prometheus to move together — and the floor for one is not
      # the floor for the others, because sdk-node's transitive pins lag its
      # own version. Grouping them means the next bump is one reviewable PR
      # that either resolves all of them or none.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      # The eslint family has to move as one, for the same reason the root
      # entry quarantines it — but measured here rather than assumed.
      # `@eslint/js@10.0.1` declares `peerDependencies: { eslint: "^10.0.0" }`,
      # so an ungrouped bump of it alone against this service's `eslint@^9`
      # installs a tree `npm ls` reports as `invalid` in nine places. It is
      # not caught by anything: `npm ci`, `tsc`, `eslint src test` and the
      # test run were all green on that tree, and the effective rule set
      # actually *grew* by three rules, so the only signal was the peer graph.
      #
      # Unlike the root entry this service does not use `eslint-plugin-react`
      # — its flat config is `@eslint/js` plus `typescript-eslint`, and
      # `typescript-eslint@8.70.1` already accepts `eslint@^10`. So this is a
      # group and not an `ignore`: the family can move whenever the three
      # arrive in one reviewable pull request.
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "@typescript-eslint/*"]
    ignore:
      # Major bumps here are breaking-change reviews, not dependency hygiene:
      # typescript 5 -> 7 and @types/node 20 -> 26 both arrived as automatic
      # PRs against a service whose build is `tsc` with no other guard.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ── pip (api) ────────────────────────────────────────────────
  #
  # This entry had no `ignore` rules at all, which is why `ruff 0.4.10 ->
  # 0.16.8` and `mypy 1.20.2 -> 2.3.1` arrived as ordinary weekly bumps
  # against a service whose lint and type-check gates are both ratchets.
  #
  # Neither hold is about the tool being unwelcome. Both are about the fact
  # that Dependabot can only edit `services/api/pyproject.toml` and its lock,
  # while each of these versions is declared in several places that have to
  # move in one commit — and in both cases the `Python — Lint & Type-check`
  # required check is what fails, i.e. on every open pull request, not just
  # the bump's own.
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    ignore:
      # ruff is declared `>=0.4.4,<0.5` in fourteen files (seven
      # pyproject.toml plus CI and image install lines) — a count
      # `scripts/check_dependency_pins.py` enforces agreement across — and
      # `.github/workflows/ci.yml` runs `ruff format --check services/` as a
      # hard gate. Measured on 0.16.8: 90 files would be
      # reformatted and `ruff check services/` reports 3 errors, against
      # `All checks passed!` / `1229 files already formatted` on the pin.
      # Moving ruff is therefore a whole-tree reformat landed together with
      # all fourteen declarations, not a dependency bump. ruff is 0.x, so the
      # 0.4 -> 0.16 step is a *minor* under semver; patches inside 0.4.x are
      # deliberately still allowed through.
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # mypy is declared `>=1.10,<2` in six pyproject.toml files and in the
      # same CI job, which runs `scripts/check_mypy_baseline.py` — a
      # `(tree, file, code)` ratchet. Measured on 2.3.1 under Python 3.11
      # (the environment the baseline is recorded in): the gate exits 1 with
      # 35 entries no longer matching. They are all *shrinkages* — mypy 2
      # stops reporting `import-untyped` for those files — and the ratchet
      # refuses them in that direction on purpose, so the banked headroom
      # cannot silently absorb the next regression. Moving mypy means
      # re-recording the baseline with `--update` under 2.x on 3.11 and
      # moving all six declarations at once.
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]
      # Deliberately *not* held: `sqlglot`. It is the parser enforcing
      # ClickHouse tenant isolation, an `ignore` rule suppresses security
      # updates as well as version updates, and a single-path bump already
      # cannot merge — `scripts/check_sqlglot_pin.py` fails closed when the
      # seven install paths disagree. Noise that a gate catches is a better
      # trade here than a muted advisory on the isolation boundary.

  # ── pip (actions) ────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /services/actions
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  # ── pip (agents) ────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /services/agents
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  # ── Go (enrichment) ──────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /services/enrichment
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  # ── Go (ingest) ──────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /services/ingest
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  # ── Go (demo-producer) ───────────────────────────────────────
  - package-ecosystem: gomod
    directory: /services/demo-producer
    schedule:
      interval: weekly
      day: monday
      time: "06:00"

  # ── GitHub Actions ───────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      codeql-action:
        # `init`, `autobuild` and `analyze` must move in one commit. CodeQL
        # refuses to run when a single workflow mixes versions ("Not all
        # workflow steps that use `github/codeql-action` actions use the same
        # version") and fails the job as a configuration error, so ungrouped
        # dependabot PRs for these are individually unmergeable.
        patterns: ["github/codeql-action*"]
