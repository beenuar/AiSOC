name: Hosted hostname

# A self-hoster must never meet another deployment's hostname presented as
# their own product's URL. The maintainers' hosted host still appears
# legitimately in the managed-instance deploy configs, the marketing pages and
# the changelog, so this gate is not "the string must not appear" — it is
# "every appearance is one somebody signed off on", pinned by exact count.
#
# Runs on BOTH pull_request and push-to-main. A PR-only gate is one-directional:
# it checks what contributors propose but never what actually lands, so an edit
# made at merge time slips past while the gate stays green.
#
# No paths filter. A hostname default can appear in any file type — TypeScript,
# Go, Python, YAML, a plugin manifest — and a filtered gate that skips is
# indistinguishable from a gate that passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-hostname-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-hostname:
    name: No hosted hostname in OSS defaults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Runs first and on every invocation. If the detector or the
      # both-directions comparison stops working, this fails here rather than
      # letting the scan below report a clean tree it never inspected properly.
      - name: Self-test (gate is not vacuous)
        run: python3 scripts/check_hosted_hostname.py --self-test

      # Deliberately run from the repository root via the default working
      # directory: the gate resolves its root from the working directory, not
      # from its own file location, so it fails loudly if pointed anywhere else.
      - name: Scan the tree
        run: python3 scripts/check_hosted_hostname.py
