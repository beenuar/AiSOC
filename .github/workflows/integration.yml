name: Integration

# Phase 3 (world-class program) — prove the stack actually runs.
#
# Four jobs, all against real containers, no mocks:
#
#   spine            — raw vendor event → ingest (OCSF normalize) → Kafka →
#                      fusion (promote + dedup + correlate) → fused topic →
#                      realtime WebSocket frame → Postgres alert row →
#                      GET /api/v1/alerts. Plus duplicate suppression and two
#                      chaos steps: (a) kill the fusion consumer, produce,
#                      restart, assert recovery with zero event loss; and
#                      (b) kill Postgres mid-stream, assert fusion degrades
#                      fail-soft without crashing, then self-heals persistence
#                      once Postgres returns.
#   migrations       — the API's SQL migration chain applies cleanly on a
#                      fresh Postgres 16, is idempotent on re-run (strict
#                      mode), and the UEBA alembic chain round-trips
#                      upgrade → downgrade → upgrade.
#   backup-restore   — scripts/backup.sh + restore.sh against Postgres 16 and
#                      a real S3 endpoint: seed → backup → destroy → restore →
#                      assert full data integrity. Publishes measured RTO. An
#                      untested backup is not a backup.
#   upgrade          — install a prior release's migration set, seed data,
#                      then upgrade to HEAD and migrate: assert the seeded
#                      data survives (destructive-migration detection) and
#                      every HEAD migration applied. People upgrade; test it.
#
# The spine job builds `fusion` and `ingest-worker` from PR source (they own
# the bridges under test) and pulls the other service images from GHCR
# `:main` — those surfaces are gated by compose-smoke.yml with its own
# rebuild-on-change detection.

on:
  pull_request:
    paths:
      - 'services/ingest/**'
      - 'services/fusion/**'
      - 'services/realtime/**'
      - 'services/api/migrations/**'
      - 'services/api/app/scripts/run_migrations.py'
      - 'services/ueba/alembic/**'
      - 'docker-compose.yml'
      - 'scripts/integration/**'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'services/ingest/**'
      - 'services/fusion/**'
      - 'services/realtime/**'
      - 'services/api/migrations/**'
      - 'services/api/app/scripts/run_migrations.py'
      - 'services/ueba/alembic/**'
      - 'docker-compose.yml'
      - 'scripts/integration/**'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── The spine, end to end ──────────────────────────────────────────────────
  spine:
    name: Event spine (real containers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AISOC_VERSION: main
      COMPOSE_PROJECT_NAME: aisoc-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install --quiet httpx websockets

      - name: Seed environment file
        run: |
          cp .env.example .env
          if grep -q '^AISOC_VERSION=' .env; then
            sed -i "s|^AISOC_VERSION=.*|AISOC_VERSION=${AISOC_VERSION}|" .env
          else
            printf '\nAISOC_VERSION=%s\n' "${AISOC_VERSION}" >> .env
          fi

      - name: Pre-pull published images
        run: docker compose pull --ignore-pull-failures --quiet || true

      # The two spine-bridge owners are always built from PR source so the
      # code under test is the code that runs. Build AFTER the pull so the
      # locally-built tags are not clobbered by the registry.
      - name: Build fusion + ingest from source
        run: docker compose build fusion ingest-worker

      # This job verifies the FULL architecture — it asserts below that the
      # ClickHouse event lake is populated — so it must boot the `full`
      # profile. ClickHouse, Neo4j and the rest moved behind that profile so
      # a plain `docker compose up` is the 10-service CORE pipeline.
      #
      # The two flags travel with the profile: the lake writer and the graph
      # writer target stores that only exist in `full`, and in CORE they
      # default off rather than retrying against a host that is not there.
      - name: Boot stack (full profile — this job asserts on the lake)
        env:
          AISOC_LAKE_WRITER_ENABLED: "true"
          AISOC_GRAPH_ENABLED: "true"
        run: docker compose --profile full up -d

      - name: Run spine test
        run: python3 scripts/integration/spine_test.py

      # ── Phase A1: the ClickHouse event lake is actually populated ────────
      # The spine test ingested events; assert they landed in the
      # `aisoc.raw_events` lake (the writer flushes by size OR age, and the
      # fusion worker runs a periodic-flush ticker so a low-traffic batch is
      # never stranded). Queryability (count > 0), not exact-once, is the
      # claim — MergeTree does not dedup and a Kafka replay may duplicate.
      - name: Assert events landed in the ClickHouse lake
        run: |
          set -euo pipefail
          ok=""
          for i in $(seq 1 30); do
            N="$(docker compose exec -T clickhouse clickhouse-client \
                  --user aisoc --password clickhouse_dev_secret \
                  --query 'SELECT count() FROM aisoc.raw_events' 2>/dev/null || echo 0)"
            echo "lake row count (attempt ${i}): ${N}"
            if [ "${N:-0}" -gt 0 ]; then ok=1; break; fi
            sleep 2
          done
          [ -n "${ok}" ] \
            || { echo "::error::ClickHouse lake was never populated from the raw-events stream"; \
                 docker compose logs --tail=80 --no-color fusion || true; exit 1; }

      # ── Phase A2: the executable detection corpus fires on the live stream ─
      # Post an event whose recovered raw fields match a native detection rule
      # (aws-root-account-login) and assert the fusion detection engine turns
      # it into an alert — proving the 800+ rule corpus runs in production, not
      # just in CI fixture-replay.
      - name: Assert the detection engine fires on the live stream
        run: python3 scripts/integration/spine_test.py --detection --timeout 180

      # ── Phase A3: the default cold-boot stack is complete ────────────────
      # `docker compose up -d` (no profiles) now ships the connector runtime
      # and graph-at-ingest ON by default. Assert (a) the connectors service
      # booted in the default profile and (b) ingest enabled the Neo4j graph
      # writer, then (c) the graph actually has nodes after the spine flowed.
      - name: Assert default stack ships connectors + graph-at-ingest
        run: |
          set -euo pipefail
          echo "── connectors service present in default boot ──"
          docker compose ps --services | grep -qx connectors \
            || { echo "::error::connectors not in the default compose stack"; exit 1; }
          running="$(docker inspect -f '{{.State.Running}}' aisoc-connectors 2>/dev/null || echo false)"
          echo "connectors running: ${running}"
          [ "${running}" = "true" ] || { echo "::error::connectors container is not running"; docker compose logs --tail=60 --no-color connectors || true; exit 1; }

          echo "── ingest enabled the graph writer ──"
          docker compose logs --no-color ingest-worker 2>/dev/null | grep -q "graph: ingest-side writer enabled" \
            || { echo "::error::graph-at-ingest was not enabled by default"; docker compose logs --tail=60 --no-color ingest-worker || true; exit 1; }

          echo "── graph has nodes after the spine flowed ──"
          ok=""
          for i in $(seq 1 30); do
            N="$(docker compose exec -T neo4j cypher-shell -u neo4j -p neo4j_dev_secret --format plain \
                  'MATCH (n) RETURN count(n)' 2>/dev/null | tail -1 | tr -dc '0-9' || echo 0)"
            echo "graph node count (attempt ${i}): ${N:-0}"
            if [ "${N:-0}" -gt 0 ]; then ok=1; break; fi
            sleep 2
          done
          [ -n "${ok}" ] || { echo "::error::graph-at-ingest produced no nodes from the live stream"; \
                              docker compose logs --tail=80 --no-color ingest-worker || true; exit 1; }

      # ── Chaos: kill the fusion consumer, produce, restart, assert ────────
      # The event is produced while the consumer is down; on restart the
      # consumer group must resume from its committed offset and process it.
      # Zero event loss across a consumer crash is the claim under test.
      - name: Chaos — kill fusion consumer mid-stream
        run: |
          set -euo pipefail
          TITLE="ChaosTest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "chaos title: ${TITLE}"
          docker compose kill fusion
          python3 scripts/integration/spine_test.py --post-event --title "${TITLE}"
          sleep 5
          docker compose up -d fusion
          python3 scripts/integration/spine_test.py --await-alert --title "${TITLE}" --timeout 180

      # ── Chaos: Postgres outage — graceful degradation + self-heal ────────
      # Kill Postgres mid-stream. The fusion AlertSink must degrade to
      # "fused alerts still flow over Kafka/WS, persistence is dropped for the
      # outage window" WITHOUT crashing the consumer, and must self-heal once
      # Postgres returns. Distinct event titles side-step fusion's in-memory
      # dedup so the post-restart event is a fresh persist, not a duplicate.
      # (The during-outage event's row is intentionally not recovered — a hard
      # DB outage is a degradation window, not corruption; the healed event
      # proves persistence resumes.)
      - name: Chaos — Postgres outage (graceful degradation + self-heal)
        run: |
          set -euo pipefail
          OUT="PgOutage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-during"
          HEAL="PgOutage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-healed"

          echo "── killing postgres ──"
          docker compose kill postgres

          # An event produced with the DB down must be accepted + processed
          # (ingest and fusion do not depend on Postgres for the hot path).
          python3 scripts/integration/spine_test.py --post-event --title "${OUT}"
          sleep 8

          # The consumer must still be running — a DB outage must not crash it.
          fusion_cid="$(docker compose ps -q fusion)"
          running="$(docker inspect -f '{{.State.Running}}' "${fusion_cid}")"
          echo "fusion running during outage: ${running}"
          [ "${running}" = "true" ] \
            || { echo "::error::fusion crashed during the Postgres outage (fail-soft violated)"; exit 1; }

          echo "── restoring postgres ──"
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready >/dev/null 2>&1; then
              echo "postgres accepting connections after ${i}s"; break
            fi
            sleep 1
          done

          # A fresh event after restart must persist — proving the sink and the
          # API both self-heal their Postgres pools with no restart.
          python3 scripts/integration/spine_test.py --post-event --title "${HEAL}"
          python3 scripts/integration/spine_test.py --await-alert --title "${HEAL}" --timeout 180

      - name: Capture forensics on failure
        if: failure()
        run: |
          docker compose ps || true
          echo "── fusion ──";    docker compose logs --tail=150 --no-color fusion || true
          echo "── ingest ──";    docker compose logs --tail=100 --no-color ingest-worker || true
          echo "── realtime ──";  docker compose logs --tail=100 --no-color realtime || true
          echo "── api ──";       docker compose logs --tail=100 --no-color api || true
          echo "── postgres ──";  docker compose logs --tail=60  --no-color postgres || true
          echo "── kafka ──";     docker compose logs --tail=60  --no-color kafka || true

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Migration correctness ──────────────────────────────────────────────────
  migrations:
    name: Migrations (fresh apply, idempotent re-run, alembic round-trip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc_ci_secret
          POSTGRES_DB: aisoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_ci_secret@localhost:5432/aisoc
      SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
      ENVIRONMENT: development
      AISOC_MIGRATIONS_STRICT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # Same importable-subset recipe as ci.yml's API job — run_migrations
      # imports app.core.config, which needs the settings surface only.
      - name: Install API dependencies
        run: >-
          pip install --quiet
          "fastapi>=0.117,<0.142" "pydantic[email]" pydantic-settings "sqlalchemy[asyncio]" asyncpg
          structlog "PyJWT>=2.8,<3" "cryptography>=46,<51" "passlib[bcrypt]" tenacity pyyaml
          prometheus-client "opentelemetry-sdk" "opentelemetry-api"
          "opentelemetry-exporter-otlp-proto-grpc"
          "opentelemetry-instrumentation-fastapi"
          "strawberry-graphql[fastapi]"
          neo4j redis celery httpx aiofiles email-validator "PyJWT>=2.8,<3"
          "sqlglot>=23,<27" aiosqlite "croniter>=2.0,<7.0"

      - name: Apply full migration chain on fresh Postgres (strict)
        working-directory: services/api
        run: python -m app.scripts.run_migrations

      - name: Re-run must be a no-op (idempotency)
        working-directory: services/api
        run: |
          set -euo pipefail
          python -m app.scripts.run_migrations 2>&1 | tee /tmp/second-run.log
          grep -q "0 pending" /tmp/second-run.log \
            || { echo "::error::second migration run was not a no-op"; exit 1; }

      - name: Assert every migration file is tracked
        run: |
          set -euo pipefail
          FILES=$(ls services/api/migrations/*.sql | wc -l)
          ROWS=$(PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc -tAc \
            "SELECT count(*) FROM aisoc_schema_migrations")
          echo "migration files: ${FILES}, tracked rows: ${ROWS}"
          [ "${FILES}" = "${ROWS}" ] \
            || { echo "::error::tracked migrations (${ROWS}) != migration files (${FILES})"; exit 1; }

      # The MSSP portfolio surface reads across tenants on purpose, so
      # "does it stay inside its portfolio" cannot be answered by a mocked
      # session. This is the only job with a real database and the full
      # migration chain already applied, which makes it the honest home for
      # the replay: it seeds two organisations plus an unmanaged tenant and
      # asserts an aggregate as one operator never returns the others.
      #
      # MSSP_ISOLATION_REQUIRED turns an unreachable database into a failure
      # rather than a skip. A gate that quietly declines to run looks
      # identical to one that passed, which is how the public scoreboard sat
      # ten weeks stale; here it would mean shipping a cross-tenant surface
      # with nobody having checked it stays inside its portfolio.
      - name: Cross-tenant MSSP portfolio isolation (live Postgres)
        working-directory: services/api
        env:
          MSSP_ISOLATION_REQUIRED: '1'
        run: pip install --quiet pytest pytest-asyncio && python -m pytest tests/test_mssp_portfolio_isolation.py -v --tb=short

      # 060_rls_coverage.sql takes RLS from 31 of 95 tenant-scoped tables to
      # every one of them bar a documented exclusion. A migration that adds 49
      # policies is worth what the evidence that they filter is worth, so the
      # replay runs here — the only job with a real database and the full
      # chain already applied.
      #
      # It connects as a purpose-made role with neither SUPERUSER nor
      # BYPASSRLS, because the role the services actually use is a superuser
      # and would sail past every policy. That fact is itself asserted, so
      # nobody can read a green tick here as "isolation is on in production".
      #
      # POSTGRES_RLS_ISOLATION_REQUIRED turns an unreachable database into a
      # failure rather than a skip, for the same reason as the job above.
      - name: Postgres row-level security isolation (live, two tenants)
        env:
          POSTGRES_RLS_ISOLATION_REQUIRED: '1'
        run: python -m pytest tests/isolation/test_postgres_rls.py -v --tb=short

      # The UEBA package layout (app/ dir) isn't wheel-buildable; alembic's
      # env.py only needs `app.models.ueba` importable, so run in-place with
      # PYTHONPATH instead of pip-installing the service.
      - name: Install alembic
        run: pip install --quiet alembic

      - name: UEBA alembic round-trip (upgrade → downgrade → upgrade)
        working-directory: services/ueba
        env:
          PYTHONPATH: .
          # Dedicated database so the SQL-runner schema above is untouched.
          DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_ci_secret@localhost:5432/ueba_ci
        run: |
          set -euo pipefail
          PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc -c "CREATE DATABASE ueba_ci"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          echo "alembic round-trip clean"

  # ── Disaster recovery: an untested backup is not a backup ─────────────────
  backup-restore:
    name: Backup → destroy → restore (Postgres via S3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc_ci_secret
          POSTGRES_DB: aisoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://aisoc:aisoc_ci_secret@localhost:5432/aisoc
      BACKUP_S3_BUCKET: s3://aisoc-dr-test
      BACKUP_S3_PREFIX: ci-dr
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_DEFAULT_REGION: us-east-1
      # Backups are encrypted by default. A CI key is fine: the bucket is
      # ephemeral and holds nothing but the probe table.
      BACKUP_ENCRYPTION_KEY: 2b7e151628aed2a6abf7158809cf4f3c762e7160f38b4da56a784d9045190cfe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tooling (awscli + postgres client)
        run: |
          pip install --quiet awscli "cryptography>=46,<51"
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client

      # The S3 endpoint is a fixture: what this job tests is backup.sh and
      # restore.sh, not the object store. It still has to be a real S3 server,
      # because the scripts drive it through the aws CLI (s3 cp/ls/rm and
      # s3api head-object) and a stub would not exercise that path.
      #
      # This step has now lost MinIO twice to hosting decisions, not to bugs:
      # `minio/minio` on Docker Hub was withdrawn (the whole repository 404s),
      # and the quay.io mirror it was moved to — pinned by digest — now answers
      # 401 UNAUTHORIZED for every tag and for that digest. A third MinIO
      # coordinate would be the same bet a third time.
      #
      # versitygw is Versity's Apache-2.0 S3 gateway, published to GHCR. GHCR
      # is the registry this workflow's own images live in and is operated by
      # the platform the job already runs on, so it cannot be withdrawn
      # independently of CI itself, and it is not subject to Docker Hub's
      # anonymous pull limits. Pinned to the v1.8.0 multi-arch index digest.
      - name: Start the S3 endpoint (versitygw)
        run: |
          set -euo pipefail
          # The posix backend chdirs into its root, so the directory has to
          # exist before the server starts; a named volume creates it.
          docker volume create aisoc-dr-s3 >/dev/null
          docker run -d --name s3 -p 9000:7070 -v aisoc-dr-s3:/data \
            -e ROOT_ACCESS_KEY="${AWS_ACCESS_KEY_ID}" \
            -e ROOT_SECRET_KEY="${AWS_SECRET_ACCESS_KEY}" \
            ghcr.io/versity/versitygw@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 \
            --port 0.0.0.0:7070 posix /data

      # `docker run -d` succeeding only means the container was created. If the
      # server exits (bad flag, missing data dir) the bucket loop below would
      # burn its retries and fail with a connection error that says nothing
      # about why. Fail here instead, with the container's own logs.
      - name: Wait for the S3 endpoint
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "${AWS_ENDPOINT_URL}" 2>/dev/null \
               || [ "$(curl -s -o /dev/null -w '%{http_code}' "${AWS_ENDPOINT_URL}")" != "000" ]; then
              echo "S3 endpoint ready after ${i}s"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=s3 -f status=running)" ]; then
              echo "::error::the S3 endpoint container exited before becoming ready"
              docker logs s3 2>&1 | tail -30
              exit 1
            fi
            sleep 1
          done
          echo "::error::the S3 endpoint did not become ready within 30s"
          docker logs s3 2>&1 | tail -30
          exit 1

      - name: Create bucket
        run: aws s3 mb "${BACKUP_S3_BUCKET}"

      - name: Seed data
        run: |
          PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc <<'SQL'
          CREATE TABLE dr_probe (id SERIAL PRIMARY KEY, payload TEXT NOT NULL);
          INSERT INTO dr_probe (payload)
            SELECT md5(g::text) FROM generate_series(1, 500) AS g;
          SQL
          COUNT=$(PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc -tAc "SELECT count(*) FROM dr_probe")
          echo "seeded ${COUNT} rows"
          [ "${COUNT}" = "500" ]

      - name: Backup (scripts/backup.sh)
        run: ./scripts/backup.sh --component postgres

      # The restore assertion below proves the dump round-trips. It cannot
      # prove the object in the bucket is unreadable to whoever can list the
      # bucket, which is the property the encryption exists for — and which
      # architecture.md claimed for months while backup.sh shipped plaintext.
      - name: Assert the uploaded artifact is encrypted and manifested
        run: |
          set -euo pipefail
          KEY=$(aws s3 ls "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/postgres/" \
            | awk '{print $4}' | tail -1)
          echo "uploaded object: ${KEY}"
          case "$KEY" in
            *.enc) ;;
            *) echo "::error::backup uploaded without the .enc suffix: ${KEY}"; exit 1 ;;
          esac

          aws s3 cp "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/postgres/${KEY}" /tmp/artifact.enc

          # gzip magic would mean the dump went up in the clear.
          if head -c 2 /tmp/artifact.enc | od -An -tx1 | grep -q '1f 8b'; then
            echo "::error::artifact begins with gzip magic; it is not encrypted"
            exit 1
          fi
          head -c 8 /tmp/artifact.enc | grep -q 'AISOCBK1' || {
            echo "::error::artifact is missing the AiSOC backup header"; exit 1; }

          # And the table name must not be readable in the ciphertext.
          if grep -aq 'dr_probe' /tmp/artifact.enc; then
            echo "::error::plaintext schema leaked into the encrypted artifact"
            exit 1
          fi

          MANIFEST=$(aws s3 ls "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/manifests/" \
            | awk '{print $4}' | tail -1)
          [ -n "$MANIFEST" ] || { echo "::error::no manifest uploaded"; exit 1; }
          aws s3 cp "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/manifests/${MANIFEST}" /tmp/manifest.json
          python3 -c "
          import json, sys
          doc = json.load(open('/tmp/manifest.json'))
          assert doc['encryption'] == 'aes-256-gcm', doc
          arts = doc['artifacts']
          assert arts, 'manifest lists no artifacts'
          for a in arts:
              assert a['encrypted'] is True, a
              assert len(a['sha256_plaintext']) == 64, a
              assert len(a['sha256_ciphertext']) == 64, a
          print(f'manifest ok: {len(arts)} artifact(s), aes-256-gcm')
          "

      - name: Destroy all data
        run: |
          PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc \
            -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          COUNT=$(PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tables after destroy: ${COUNT}"
          [ "${COUNT}" = "0" ]

      - name: Restore (scripts/restore.sh) and measure RTO
        run: |
          set -euo pipefail
          START=$(date +%s)
          ./scripts/restore.sh --latest --component postgres < /dev/null
          RTO=$(( $(date +%s) - START ))
          echo "RTO_SECONDS=${RTO}" >> "$GITHUB_ENV"
          echo "measured restore time: ${RTO}s"

      - name: Assert full data integrity
        run: |
          COUNT=$(PGPASSWORD=aisoc_ci_secret psql -h localhost -U aisoc -d aisoc -tAc "SELECT count(*) FROM dr_probe")
          echo "rows after restore: ${COUNT}"
          [ "${COUNT}" = "500" ] || { echo "::error::data loss after restore (${COUNT}/500 rows)"; exit 1; }

      # A backup that restores is necessary but not sufficient: a corrupted
      # backup must refuse to restore rather than produce a partial database,
      # which is the failure that gets discovered during an incident.
      - name: Assert a tampered backup is refused
        run: |
          set -uo pipefail
          KEY=$(aws s3 ls "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/postgres/" \
            | awk '{print $4}' | tail -1)
          aws s3 cp "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/postgres/${KEY}" /tmp/tamper.enc

          # Flip one bit deep inside the ciphertext.
          python3 -c "
          import pathlib
          p = pathlib.Path('/tmp/tamper.enc')
          b = bytearray(p.read_bytes())
          b[len(b) // 2] ^= 0x01
          p.write_bytes(bytes(b))
          "
          aws s3 cp /tmp/tamper.enc "${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/postgres/${KEY}"

          if ./scripts/restore.sh --latest --component postgres < /dev/null; then
            echo "::error::restore accepted a tampered backup"
            exit 1
          fi
          echo "tampered backup correctly refused"

      - name: Publish DR summary
        run: |
          {
            echo "## Disaster-recovery gate"
            echo ""
            echo "| metric | value |"
            echo "|--------|-------|"
            echo "| rows seeded | 500 |"
            echo "| rows after restore | 500 |"
            echo "| measured RTO | ${RTO_SECONDS}s |"
            echo "| artifact encryption | AES-256-GCM (asserted unreadable in the bucket) |"
            echo "| integrity | SHA-256 manifest; tampered artifact refused |"
            echo "| RPO | last completed backup (event-loss window = backup cadence) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Upgrade safety: install a prior release, then upgrade to HEAD ──────────
  # "People upgrade. Nothing tested it." Apply the migration set as of a prior
  # release, seed data on that released schema, then apply HEAD's migration set
  # (the real self-host upgrade path) and assert the seeded rows survive and
  # every HEAD migration applied. The signal this adds over the fresh-apply job
  # above is destructive-migration detection: a migration that drops or rewrites
  # existing data fails here even though it applies cleanly on an empty database.
  #
  #   - v7.5.0 → HEAD: the real "last release → current" self-host upgrade path.
  #   - v7.3.1 → HEAD: an older baseline so several migrations land incrementally
  #     on a pre-existing, populated schema (not a fresh apply in disguise).
  upgrade:
    name: Upgrade (${{ matrix.from_ref }} → HEAD, data survives)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        from_ref: ['v7.3.1', 'v7.5.0']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: aisoc_ci_secret
          POSTGRES_DB: aisoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_ci_secret@localhost:5432/aisoc
      SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
      ENVIRONMENT: development
      AISOC_MIGRATIONS_STRICT: '1'
      PGPASSWORD: aisoc_ci_secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags so we can check out the released migration set.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # Same importable-subset recipe as the migrations job — run_migrations
      # imports app.core.config, which needs the settings surface only.
      - name: Install API dependencies
        run: >-
          pip install --quiet
          "fastapi>=0.117,<0.142" "pydantic[email]" pydantic-settings "sqlalchemy[asyncio]" asyncpg
          structlog "PyJWT>=2.8,<3" "cryptography>=46,<51" "passlib[bcrypt]" tenacity pyyaml
          prometheus-client "opentelemetry-sdk" "opentelemetry-api"
          "opentelemetry-exporter-otlp-proto-grpc"
          "opentelemetry-instrumentation-fastapi"
          "strawberry-graphql[fastapi]"
          neo4j redis celery httpx aiofiles email-validator "PyJWT>=2.8,<3"
          "sqlglot>=23,<27" aiosqlite "croniter>=2.0,<7.0"

      - name: Record HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install the released schema (${{ matrix.from_ref }})
        run: |
          set -euo pipefail
          # `git checkout <ref> -- <path>` only overwrites paths present in
          # <ref>; it will NOT delete files added since. rm -rf first so the
          # migrations dir exactly matches the released set (otherwise HEAD's
          # newer files leak in and pass 1 silently becomes a fresh apply).
          rm -rf services/api/migrations
          git checkout "${{ matrix.from_ref }}" -- services/api/migrations
          echo "migration files at ${{ matrix.from_ref }}: $(ls services/api/migrations/*.sql | wc -l)"
          ( cd services/api && python -m app.scripts.run_migrations )

      - name: Seed data on the released schema
        run: |
          set -euo pipefail
          psql -h localhost -U aisoc -d aisoc <<'SQL'
          CREATE TABLE upgrade_probe (id SERIAL PRIMARY KEY, payload TEXT NOT NULL);
          INSERT INTO upgrade_probe (payload)
            SELECT md5(g::text) FROM generate_series(1, 250) AS g;
          SQL
          COUNT=$(psql -h localhost -U aisoc -d aisoc -tAc "SELECT count(*) FROM upgrade_probe")
          echo "seeded ${COUNT} probe rows on the ${{ matrix.from_ref }} schema"
          [ "${COUNT}" = "250" ]

      - name: Upgrade to HEAD and migrate
        run: |
          set -euo pipefail
          rm -rf services/api/migrations
          git checkout "${{ steps.head.outputs.sha }}" -- services/api/migrations
          HEAD_COUNT=$(ls services/api/migrations/*.sql | wc -l)
          echo "migration files at HEAD: ${HEAD_COUNT}"
          ( cd services/api && python -m app.scripts.run_migrations )
          echo "HEAD_MIGRATION_COUNT=${HEAD_COUNT}" >> "$GITHUB_ENV"

      - name: Assert seeded data survived + every HEAD migration applied
        run: |
          set -euo pipefail
          PROBE=$(psql -h localhost -U aisoc -d aisoc -tAc "SELECT count(*) FROM upgrade_probe")
          TRACKED=$(psql -h localhost -U aisoc -d aisoc -tAc "SELECT count(*) FROM aisoc_schema_migrations")
          echo "PROBE_ROWS=${PROBE}" >> "$GITHUB_ENV"
          echo "probe rows after upgrade: ${PROBE} (expect 250)"
          echo "tracked migrations:       ${TRACKED} (expect ${HEAD_MIGRATION_COUNT})"
          [ "${PROBE}" = "250" ] \
            || { echo "::error::a migration destroyed data across the ${{ matrix.from_ref }} → HEAD upgrade (${PROBE}/250 rows survived)"; exit 1; }
          [ "${TRACKED}" = "${HEAD_MIGRATION_COUNT}" ] \
            || { echo "::error::not every HEAD migration applied on upgrade (${TRACKED}/${HEAD_MIGRATION_COUNT})"; exit 1; }

      - name: Publish upgrade summary
        if: always()
        run: |
          {
            echo "## Upgrade gate — ${{ matrix.from_ref }} → HEAD"
            echo ""
            echo "| check | value |"
            echo "|-------|-------|"
            echo "| probe rows seeded on released schema | 250 |"
            echo "| probe rows after upgrade | ${PROBE_ROWS:-?} |"
            echo "| HEAD migrations applied | ${HEAD_MIGRATION_COUNT:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
