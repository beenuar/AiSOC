name: Compose Smoke

# Boots the full Docker Compose stack from a clean checkout and asserts the
# user-facing surfaces (Postgres, API, web) become healthy within a 10-minute
# budget. This is the gate that proves a fresh `git clone && docker compose up`
# actually works — the workflow that catches `docker-compose.yml` regressions
# before they reach a new contributor.
#
# Strategy: pull-by-default. Services with published images on GHCR
# (`AISOC_VERSION=main`) are pulled; the two unpublished default-profile
# services (`honeytokens`, `purple-team`) are built locally. Profile-gated
# services (osquery, connectors, chatops, monitoring) are intentionally
# excluded — they are exercised by their own publish workflows.
#
# Use `workflow_dispatch` with `force_build: true` to force every service to
# rebuild from source — useful when validating Dockerfile changes that have
# not yet been published.

# Deliberately NOT path-filtered at the workflow level.
#
# It used to be. A workflow that does not trigger reports no check, and a
# required check that never reports blocks a pull request forever — so this
# gate could not be required while the filter lived up here, which is the
# single thing standing between "the first-run experience is tested" and "the
# first-run experience is tested and cannot regress".
#
# The condition moved into the job instead. `smoke` runs on every pull
# request, decides for itself whether anything under a build context changed,
# and reports success under the same name either way. The name is what branch
# protection matches on, and there is only one job producing it, so the two
# cases cannot drift apart.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force every service to build from source (skip GHCR pulls)'
        type: boolean
        default: false
      aisoc_version:
        description: 'Image tag to pull when not force-building (default: main)'
        type: string
        default: main

concurrency:
  # Supersede a pull request's own earlier runs; never supersede a push.
  # Only a branch's head commit needs grading, but every commit that lands
  # on a protected branch must be graded — and `cancel-in-progress: false`
  # alone does not achieve that, because a run left *pending* in a busy
  # group is cancelled when the next one queues. Gate:
  # scripts/check_workflow_concurrency.py
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: docker compose up — full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      AISOC_VERSION: ${{ github.event.inputs.aisoc_version || 'main' }}
      COMPOSE_PROJECT_NAME: aisoc-smoke
      # Health budget for the up + converge phase. The job timeout is wider
      # to leave room for checkout, log capture, and teardown.
      HEALTH_BUDGET_SECONDS: '600'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the rebuild-detection step below can resolve a
          # merge base against `origin/${base_ref}`. With the default
          # `fetch-depth: 1` shallow clone, `git diff base...HEAD` errors
          # with `no merge base`, our `|| true` swallows it, the diff
          # appears empty, and we silently pull a stale GHCR image even
          # when the PR has source-code fixes. Full history is cheap on
          # this runner and the only safe option.
          fetch-depth: 0

      # The workflow-level path filter used to answer this, at the cost of the
      # job not reporting at all when it said no. Now the job answers it and
      # reports either way.
      #
      # The answer only binds a pull request. Measured over the 100 most
      # recent successful push runs on `main` (2026-09-25 to 2026-09-29), this
      # job took its skip path on 27 of them — including 4 of the most recent
      # 20 — while reporting the same green tick as the 73 that booted the
      # stack.
      # Filtering by diff is right for a branch, where only the changed area
      # needs grading, and wrong for the branch everything lands on: a push
      # diffs only its own commits, so a squash merge that touched no build
      # context produced a commit on `main` that nothing had ever booted.
      # Gate: scripts/check_required_check_substance.py.
      - name: Is any of this PR's diff under the compose surface?
        id: relevant
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch: always run"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every step below also carries `|| github.event_name == 'push'`, so
          # this is belt and braces rather than the only guarantee — and it is
          # the half that puts the reason in the log.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push to ${{ github.ref_name }}: grading this commit in full"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same set the workflow-level `paths:` filter carried, in one place
          # now rather than duplicated across the two triggers it had.
          paths=(
            'docker-compose.yml'
            'docker-compose.prod.yml'
            'infra/compose/docker-compose.demo.yml'
            'scripts/check_published_secrets.py'
            '.env.example'
            '.github/workflows/compose-smoke.yml'
            'services/'
            'apps/web/'
            'packages/'
            'pnpm-lock.yaml'
            'pnpm-workspace.yaml'
            'turbo.json'
            'tsconfig.base.json'
            'package.json'
          )

          base_ref=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          fi

          # Fail-open, matching the rebuild decision below: with no base to
          # diff against, run the gate rather than skip it. A gate that
          # declines to run looks identical to one that passed.
          if [ -z "${base_ref}" ]; then
            echo "no diff base; running"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_status=0
          changed=$(git diff --name-only "${base_ref}"...HEAD -- "${paths[@]}") || diff_status=$?
          if [ "${diff_status}" -ne 0 ]; then
            echo "git diff vs ${base_ref} failed (exit ${diff_status}); running"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${changed}" ]; then
            echo "compose surface touched:"
            printf '  %s\n' ${changed}
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing under the compose surface changed vs ${base_ref}"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to smoke — reporting a verdict anyway
        if: steps.relevant.outputs.run != 'true' && github.event_name != 'push'
        run: |
          {
            echo "## Compose smoke — not exercised"
            echo ""
            echo "This pull request changes nothing under the compose surface"
            echo "(\`docker-compose.yml\`, \`services/\`, \`apps/web/\`, \`packages/\`,"
            echo "the lockfiles, or this workflow), so the stack was not booted."
            echo ""
            echo "The job still reports, under the same check name, because a"
            echo "required check that never reports blocks the pull request"
            echo "forever."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show runner capacity
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: |
          echo "## Runner snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uname -a >> "$GITHUB_STEP_SUMMARY"
          docker --version >> "$GITHUB_STEP_SUMMARY"
          docker compose version >> "$GITHUB_STEP_SUMMARY"
          free -h >> "$GITHUB_STEP_SUMMARY" || true
          df -h / >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Seed environment file
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: |
          cp .env.example .env
          # Override the image tag so smoke runs always pull a known-good
          # published tag. Manual dispatches can override this via input.
          if grep -q '^AISOC_VERSION=' .env; then
            sed -i "s|^AISOC_VERSION=.*|AISOC_VERSION=${AISOC_VERSION}|" .env
          else
            printf '\nAISOC_VERSION=%s\n' "${AISOC_VERSION}" >> .env
          fi
          echo "Resolved AISOC_VERSION=${AISOC_VERSION}"

          # `make up` runs this, and the stack now needs it to boot: with
          # ENVIRONMENT defaulting to production, ingest refuses to start
          # without a JWT_SECRET and the API refuses without METRICS_TOKEN.
          # That is the services being right — ingest previously started on a
          # literal published in this repository — but a workflow that copies
          # `.env.example` and stops has provisioned an environment no real
          # deployment ever has.
          python3 scripts/ensure_env.py
          python3 scripts/ensure_env.py --check

      - name: Validate compose file
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: docker compose config --quiet

      # `docker-compose.prod.yml` shipped sixteen passing assertions about
      # nothing starting on a default credential, and every one of them read
      # the file rather than starting it. Compose's `${VAR:?}` rejects an
      # unset or empty variable and cannot look at a value, so the guard
      # reading "the development default is a published literal" accepted
      # `aisoc_dev_secret`. This starts the stack, both ways, and asserts the
      # exit status — a static read of the same file cannot tell the
      # difference between these two runs.
      - name: A published credential cannot start the production stack
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        env:
          COMPOSE_PROJECT_NAME: aisoc-prodguard
        run: |
          set -euo pipefail
          # Derived from the compose file, not listed here. A hand-written
          # list is a second copy of the guards, and the first `${VAR:?}`
          # added after it was written broke this step with
          # `required variable AISOC_AGENTS_SERVICE_TOKEN is missing a value`.
          {
            python3 scripts/check_published_secrets.py --list-guarded \
              | while read -r name; do printf '%s=%s\n' "$name" "$(openssl rand -hex 24)"; done
            printf 'AISOC_VERSION=%s\n' "${AISOC_VERSION}"
          } > /tmp/prod-real.env
          test "$(wc -l < /tmp/prod-real.env)" -gt 10 \
            || { echo "::error::no guarded variables were derived"; exit 1; }
          sed 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=aisoc_dev_secret|' /tmp/prod-real.env > /tmp/prod-published.env

          echo "::group::published credential — must refuse"
          if docker compose --env-file /tmp/prod-published.env -f docker-compose.yml -f docker-compose.prod.yml \
               up --no-build --exit-code-from preflight-secrets preflight-secrets; then
            echo "::error::the production stack started on aisoc_dev_secret"
            exit 1
          fi
          docker compose --env-file /tmp/prod-published.env -f docker-compose.yml -f docker-compose.prod.yml down -v
          echo "::endgroup::"

          echo "::group::real credentials — must start"
          docker compose --env-file /tmp/prod-real.env -f docker-compose.yml -f docker-compose.prod.yml \
            up --no-build --exit-code-from preflight-secrets preflight-secrets
          docker compose --env-file /tmp/prod-real.env -f docker-compose.yml -f docker-compose.prod.yml down -v
          echo "::endgroup::"

      - name: Detect build-context changes
        id: dockerfile_changes
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: |
          # The published GHCR image becomes stale the moment ANY file inside
          # a service's build context changes — not only the Dockerfile. A PR
          # that fixes a Python bug under services/api/app/ but leaves the
          # Dockerfile untouched would otherwise silently boot the previous
          # image and mask the fix (or the bug). We diff the full build
          # contexts derived from docker-compose.yml to decide.
          force_build="${{ github.event.inputs.force_build || 'false' }}"
          if [ "${force_build}" = "true" ]; then
            echo "Manual force_build=true requested."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine the diff base.
          base_ref=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          fi

          if [ -z "${base_ref}" ]; then
            echo "No diff base; defaulting to pull."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build paths come from docker-compose.yml, not from a list kept
          # here. They used to be a list, with "keep this in sync when
          # adding/removing built services" written above it — and a service
          # added to compose but not to the list would have had its source
          # changes silently pulled from GHCR instead of built, so the gate
          # would boot a stale image and pass without ever running the code
          # under review. That is the exact shape this check exists to catch,
          # sitting inside the check.
          #
          # The web image's context is the repository root, so it is expanded
          # to the subset its Dockerfile actually copies; taking the root
          # literally would rebuild everything on every PR.
          python3 - <<'PYDETECT' > /tmp/build-contexts.txt
          import pathlib
          import yaml

          doc = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text()) or {}
          services = doc.get("services") or {}
          if not services:
              raise SystemExit("docker-compose.yml declares no services; the parser is wrong, not the tree")

          # What the repo-root build context (the web image) actually copies.
          ROOT_CONTEXT_SUBSET = (
              "apps/web/",
              "packages/",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "turbo.json",
              "tsconfig.base.json",
              "package.json",
          )

          out: list[str] = []
          for spec in services.values():
              build = spec.get("build")
              if not build:
                  continue
              context = build if isinstance(build, str) else build.get("context", "")
              context = str(context).strip().lstrip("./")
              if not context or context == ".":
                  out.extend(ROOT_CONTEXT_SUBSET)
              else:
                  out.append(context.rstrip("/") + "/")
          if not out:
              raise SystemExit("no build contexts found in docker-compose.yml")
          for entry in sorted(set(out)):
              print(entry)
          PYDETECT

          paths=()
          while IFS= read -r entry; do
            [ -n "${entry}" ] && paths+=("${entry}")
          done < /tmp/build-contexts.txt
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::derived no build contexts from docker-compose.yml; refusing to decide"
            exit 1
          fi
          echo "build contexts derived from docker-compose.yml (${#paths[@]}):"
          printf '  %s\n' "${paths[@]}"

          # Fail-open: if `git diff` errors (shallow clone, missing merge
          # base, etc.) we rebuild rather than risk pulling a stale image
          # that masks the very fix this PR is shipping. The previous
          # `|| true` form silently set `rebuild=false` and caused the
          # IndexError in detection_proposals.py to keep landing in CI
          # logs even after the source fix had been pushed.
          diff_status=0
          changed=$(git diff --name-only "${base_ref}"...HEAD -- "${paths[@]}") || diff_status=$?
          if [ "${diff_status}" -ne 0 ]; then
            echo "git diff vs ${base_ref} failed (exit ${diff_status}); rebuilding from source."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "${changed}" ]; then
            echo "Build-context file(s) changed since ${base_ref}:"
            printf '  %s\n' ${changed}
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-context changes vs ${base_ref}; pulling published images."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-pull published images
        if: (steps.relevant.outputs.run == 'true' || github.event_name == 'push') && steps.dockerfile_changes.outputs.rebuild != 'true'
        run: |
          # Best-effort pull. We don't fail the build here — services that
          # don't yet publish will fall through to the local build step
          # triggered by `compose up` honoring `pull_policy: missing`.
          docker compose pull --ignore-pull-failures --quiet || true

      - name: Boot stack (pull-by-default)
        if: (steps.relevant.outputs.run == 'true' || github.event_name == 'push') && steps.dockerfile_changes.outputs.rebuild != 'true'
        run: docker compose up -d --quiet-pull

      - name: Boot stack (force rebuild)
        if: (steps.relevant.outputs.run == 'true' || github.event_name == 'push') && steps.dockerfile_changes.outputs.rebuild == 'true'
        run: docker compose up -d --build

      # "Green" has meant two very different things here and the log did not
      # distinguish them: a run that built the changed service from this PR's
      # source, and a run that pulled `:main` and never compiled a line of it.
      # A required check that can pass without exercising the changed service
      # is the defect this whole effort is about, so the run now says which it
      # did, per service, and refuses when the two disagree.
      #
      # Read off the images that are actually running, not predicted from the
      # decision above: a pulled image carries a RepoDigest and a locally
      # built one does not, so this reports what happened rather than what was
      # intended.
      - name: Which services were built, and which were pulled
        id: provenance
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: |
          set -uo pipefail
          python3 - <<'PYPROV' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import subprocess
          import sys

          import yaml

          compose = yaml.safe_load(pathlib.Path("docker-compose.yml").read_text()) or {}
          buildable = {name for name, spec in (compose.get("services") or {}).items() if spec.get("build")}

          listed = subprocess.run(
              ["docker", "compose", "ps", "--format", "json"],
              capture_output=True, text=True, check=False,
          )
          rows = []
          for line in listed.stdout.splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  parsed = json.loads(line)
              except json.JSONDecodeError:
                  continue
              rows.extend(parsed if isinstance(parsed, list) else [parsed])
          if not rows:
              print("::error::`docker compose ps` listed no containers; this run exercised nothing")
              sys.exit(1)

          def provenance(image: str) -> str:
              """A pulled image has a RepoDigest; a locally built one does not."""
              out = subprocess.run(
                  ["docker", "image", "inspect", image, "--format", "{{len .RepoDigests}}"],
                  capture_output=True, text=True, check=False,
              )
              if out.returncode != 0:
                  return "unknown"
              return "pulled" if out.stdout.strip() not in {"0", ""} else "built"

          built, pulled, unknown, running = [], [], [], set()
          print("## What this run actually exercised\n")
          print("| service | image | from |")
          print("|---|---|---|")
          for row in sorted(rows, key=lambda r: r.get("Service", "")):
              service = row.get("Service", "?")
              image = row.get("Image", "?")
              if service not in buildable:
                  continue
              running.add(service)
              where = provenance(image)
              {"built": built, "pulled": pulled}.get(where, unknown).append(service)
              print(f"| `{service}` | `{image}` | **{where}** |")

          print()
          print(f"**{len(built)} built from this PR's source**: {', '.join(built) or 'none'}  ")
          print(f"**{len(pulled)} pulled from the registry**: {', '.join(pulled) or 'none'}  ")
          if unknown:
              print(f"**{len(unknown)} could not be determined**: {', '.join(unknown)}  ")

          # Neither built nor pulled: not started at all. This smoke test boots
          # the default profile, and the profile-gated services are excluded by
          # design — but "excluded by design" and "silently not covered" read
          # identically in a green tick, and a change to one of these goes
          # through this gate without the service ever starting.
          absent = sorted(buildable - running)
          if absent:
              print()
              print(f"**{len(absent)} buildable service(s) did not start in this profile and were not exercised at all**: "
                    f"{', '.join(absent)}. They are gated behind a compose profile and covered by their own publish "
                    f"workflows; this run says nothing about them.  ")

          rebuild = "${{ steps.dockerfile_changes.outputs.rebuild }}" == "true"
          if rebuild and not built:
              print()
              print("::error::a build-context change was detected and nothing was built from source; "
                    "this run booted published images and did not exercise the change under review")
              sys.exit(1)
          if not rebuild and pulled:
              print()
              print("> No build context changed, so the stack was pulled. This run proves the "
                    "published images still boot together; it does not exercise this PR's source.")
          PYPROV

      - name: Wait for stack to converge
        id: converge
        if: steps.relevant.outputs.run == 'true' || github.event_name == 'push'
        run: |
          set -u
          deadline=$(( $(date +%s) + HEALTH_BUDGET_SECONDS ))

          probe_postgres() {
            docker compose ps --format '{{.Name}} {{.Health}}' \
              | awk '$1=="aisoc-postgres" && $2=="healthy" {found=1} END {exit !found}'
          }

          probe_http() {
            local url="$1" expect="$2"
            local code
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 5 "$url" || echo "000")
            [ "$code" = "$expect" ]
          }

          ok_postgres=0
          ok_api=0
          ok_web=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$ok_postgres" -eq 0 ] && probe_postgres; then
              ok_postgres=1
              echo "✓ postgres healthy"
            fi
            if [ "$ok_api" -eq 0 ] && probe_http "http://localhost:8000/health" "200"; then
              ok_api=1
              echo "✓ api /health 200"
            fi
            if [ "$ok_web" -eq 0 ] && probe_http "http://localhost:3000" "200"; then
              ok_web=1
              echo "✓ web 200"
            fi
            if [ "$ok_postgres" -eq 1 ] && [ "$ok_api" -eq 1 ] && [ "$ok_web" -eq 1 ]; then
              elapsed=$(( $(date +%s) - (deadline - HEALTH_BUDGET_SECONDS) ))
              echo "elapsed_seconds=${elapsed}" >> "$GITHUB_OUTPUT"
              echo "Stack converged in ${elapsed}s"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Stack did not converge within ${HEALTH_BUDGET_SECONDS}s"
          echo "  postgres healthy: ${ok_postgres}"
          echo "  api /health 200:  ${ok_api}"
          echo "  web 200:          ${ok_web}"
          exit 1

      - name: Record success summary
        if: success() && (steps.relevant.outputs.run == 'true' || github.event_name == 'push')
        run: |
          {
            echo "## Smoke result"
            echo ""
            echo "Stack converged in **${{ steps.converge.outputs.elapsed_seconds }}s**"
            echo "(budget ${HEALTH_BUDGET_SECONDS}s)."
            echo ""
            echo "| gate | status |"
            echo "|------|--------|"
            echo "| postgres healthy | ✓ |"
            echo "| api /health 200  | ✓ |"
            echo "| web 200          | ✓ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture forensics on failure
        if: failure() && (steps.relevant.outputs.run == 'true' || github.event_name == 'push')
        run: |
          echo "## Compose state"
          docker compose ps || true
          echo
          echo "## Recent service logs"
          docker compose logs --tail=200 --no-color || true
          echo
          echo "## Disk after boot"
          df -h /
          echo
          echo "## Memory after boot"
          free -h || true

      - name: Teardown
        if: always() && (steps.relevant.outputs.run == 'true' || github.event_name == 'push')
        run: docker compose down -v --remove-orphans
