name: Graph schema drift check

# Drift gate for the AiSOC security knowledge graph (T1.3).
#
# Keeps three representations of the schema aligned:
#   1. schemas/graph-schema.yaml       — the checked-in source of truth
#   2. services/ingest/internal/graph/ — the Go enums consumed at ingest time
#                                        (may not exist yet during T1.1)
#   3. The live Neo4j database         — checked only when reachable
#
# The script falls through gracefully when the Go source is missing or Neo4j
# is unreachable, so this workflow is safe to run on branches where T1.1 is
# still in flight.

on:
  pull_request:
    paths:
      - "schemas/graph-schema.yaml"
      - "services/ingest/internal/graph/**"
      - "scripts/export_graph_schema.py"
      - ".github/workflows/graph-schema-check.yml"
  push:
    branches: [main, develop]
    paths:
      - "schemas/graph-schema.yaml"
      - "services/ingest/internal/graph/**"
      - "scripts/export_graph_schema.py"
      - ".github/workflows/graph-schema-check.yml"

concurrency:
  # Supersede a pull request's own earlier runs; never supersede a push.
  # Only a branch's head commit needs grading, but every commit that lands
  # on a protected branch must be graded — and `cancel-in-progress: false`
  # alone does not achieve that, because a run left *pending* in a busy
  # group is cancelled when the next one queues. Gate:
  # scripts/check_workflow_concurrency.py
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graph-schema-check:
    name: Graph schema — Drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Graph schema drift check
        run: python scripts/export_graph_schema.py --check
