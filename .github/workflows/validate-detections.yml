name: Validate Detection Rules

# Runs on every PR / push to main+develop, no path filter.
# Keeping a path filter let regressions ride in on PRs that touched neighbouring
# code without bumping a detections/** path — e.g. a refactor that breaks the
# YAML loader. The validator stays fast (~30s for 6,900+ rules), so the cost of
# running it always is negligible compared to that risk.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate & summarise detection rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install the runtime deps the fireability proof replays through
        # The proof runs a real connector's normalize() and the real
        # DetectionEngine rather than a copy of either, so it needs what those
        # modules import. A gate that reimplemented them would need nothing
        # here and would also prove nothing.
        run: pip install structlog httpx pydantic pydantic-settings

      - name: Rule ids must be stable
        # Ids were positional, so inserting a rule renumbered every rule
        # after it — and ids appear in alert rows, suppression priors and
        # customer-written exceptions, so a renumber makes a historical
        # alert reference a different rule than the one that fired. The
        # workaround was "append, never insert", which nothing enforced.
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_detection_id_stability.py -q

      - name: The committed pack must be what the generator emits
        # The lock made ids position-independent but nothing reconciled it
        # against the YAML already on disk, and no gate compared the two. The
        # committed pack fell 45 network ids behind, so the id the engine
        # stamps onto an alert and the id the catalogue publishes for the same
        # rule named different rules. Unreviewed drift in a generated artifact
        # is not cosmetic when the artifact is a join key.
        run: python3 scripts/generate_detections.py --check

      - name: Run detection rule validator (strict fixture replay)
        run: python3 scripts/validate_detections.py --strict-fixtures

      - name: Verify curated v1.0 coverage manifest
        run: python3 scripts/curate_detections.py --check

      - name: Verify detection content truth table (Phase 4 — honest coverage)
        # Fails if the committed docs/detections/truth-table.md drifts from the
        # on-disk reality, so the "executable rules" headline can never quietly
        # diverge from what the engine actually runs.
        run: python3 scripts/detection_truth_table.py --check

      - name: Verify exported detection ruleset is current (Phase A2)
        # The fusion live-detection engine loads
        # services/fusion/app/data/detection_ruleset.json (native match_when
        # specs). Fails if the specs changed without re-exporting, so the live
        # worker can't silently drift from the committed corpus.
        run: python3 scripts/export_detection_ruleset.py --check

      # A rule can be loaded by the engine, pass fixture replay, count toward
      # the published executable total, and still never fire — because the
      # matcher does a flat `event.get(field)` and nothing ever computes the
      # field. Fixture replay cannot catch this: fixtures are synthesized from
      # the rule they test, so replaying them is a tautology. Ratcheted rather
      # than clean, because the corpus already contains such rules and blocking
      # every unrelated PR on them would only invite weakening the gate.
      - name: Verify detection rules match on fields that exist
        run: python3 scripts/check_detection_fields.py

      # The windowed engine loads its corpus from a JSON artifact the same way
      # the stateless one does, so it needs the same drift gate: a spec change
      # without a re-export would leave the deployed engine running a corpus
      # nobody reviewed.
      - name: Verify exported windowed ruleset is current
        run: python3 scripts/export_windowed_ruleset.py --check

      # Recompiles every imported Sigma rule AND re-proves it: each shipped
      # rule is replayed, as a vendor-shaped event, through its connector's
      # real normalize() and the real engine. A rule that stops firing — because
      # a connector changed what it emits, or the matcher changed what an
      # operator means — fails here rather than going quiet in production.
      - name: Verify compiled Sigma ruleset is current and still fires
        run: python3 scripts/compile_sigma_ruleset.py --check

      # The proof above only means something if it can fail. This reverts the
      # connector to the behaviour that made Windows fields unreachable and
      # requires every rule depending on them to stop firing.
      - name: Prove the fireability gate is not vacuous
        run: python3 scripts/compile_sigma_ruleset.py --prove-gate

      - name: Count rules by severity
        if: always()
        run: |
          echo "### Detection Rule Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          for sev in critical high medium low; do
            count=$(grep -rl "^severity: $sev$" detections/ 2>/dev/null | wc -l | tr -d ' ')
            echo "| $sev | $count |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          total=$(find detections/ -name "*.yaml" 2>/dev/null | wc -l | tr -d ' ')
          echo "**Total rules: $total**" >> $GITHUB_STEP_SUMMARY

      - name: Count rules by category
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          for cat in network endpoint cloud identity application data-exfil; do
            count=$(find detections/$cat/ -name "*.yaml" 2>/dev/null | wc -l | tr -d ' ')
            echo "| $cat | $count |" >> $GITHUB_STEP_SUMMARY
          done
