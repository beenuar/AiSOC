name: Live agent eval (local model)

# The project's own REALITY_REPORT names this as "the hard ceiling on the
# project's credibility": no gated suite runs the live agent. `mitre_accuracy`
# is an offline keyword extractor, and the one job that does dispatch the real
# LangGraph — wet-eval.yml — no-ops without a funded provider key, so forks and
# most PRs have never measured agent accuracy at all.
#
# A local model removes the funding dependency. Ollama serves an
# OpenAI-compatible endpoint, `services/agents/app/llm/factory.py` already
# honours OPENAI_BASE_URL, so the real agent can be dispatched on a runner with
# no secret of any kind.
#
# Two deliberate constraints:
#
#   * `--wet-limit` — a CPU-hosted model cannot chew through all 200 incidents
#     in a CI budget. The slice is a deterministic prefix so runs stay
#     comparable, and the report records how many were dispatched.
#   * `--wet-require-live` — without it the harness degrades to substrate
#     numbers on any failure, which would publish deterministic estimates as
#     live-agent performance. A gate that can pass without calling the model is
#     worse than no gate.
#
# The floor now exists and is asserted on every run — see
# `scripts/check_live_agent_floor.py` and the runs recorded in
# `services/agents/tests/eval_data/live_agent_floor.json`. It was derived from
# measurements, which is why it took a working job to get one.
#
# Still not a PR gate, and now for a measured reason rather than a cautious
# one: a slice adds minutes to a run and a 0.5b model's output is a property
# of the machine it is decoded on, so a threshold tight enough to be useful
# would be tight enough to flake on a runner nobody controls. Scheduled plus
# on-demand, failing hard when the floor is breached, is what that supports.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model tag'
        type: string
        default: 'qwen2.5:0.5b'
      incidents:
        description: 'How many incidents to dispatch'
        type: string
        # Ten, measured rather than chosen. The default was 20, and the first
        # run that got as far as dispatching the agent hit `timeout-minutes`
        # with the slice unfinished, because one unbounded completion can
        # take twenty minutes on a runner. That cause is fixed in
        # `app/investigator/limits.py`; this keeps a margin anyway, because
        # GitHub reports a timeout as `cancelled` rather than `failed`, so a
        # weekly run that measured nothing would not look like a failure.
        default: '10'
  schedule:
    - cron: '0 3 * * 2'

permissions:
  # `write` so this job can do the thing the docs already promised and nothing
  # implemented: append a row to the public scoreboard. It previously had
  # `read`, so even a perfectly successful run could not have published its
  # result if it tried — which is why the table sat frozen at 2026-07-13 for
  # ten weeks across three releases while the page above it advertised a
  # weekly cadence.
  contents: write
  pull-requests: write

concurrency:
  # Per commit on a push and per pull request otherwise. Keying on
  # `github.ref` alone lets a push to main cancel the run before it:
  # across 1,000 push runs this repository lost 259 that way, and a
  # cancelled run reports neither pass nor fail.
  group: live-agent-eval-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  live-agent:
    name: Dispatch the real agent (${{ matrix.model }})
    # The deep run stays on the schedule and on demand: ten incidents
    # through a CPU-hosted model is a 90-minute budget, which is not a
    # pull-request shape. The PR gate is `live-agent-smoke` below.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Parity 3.2's first clause: grade the **shipped** model, not only
    # the small one that fits a runner comfortably.
    #
    # `qwen2.5:0.5b` is what the floor in `live_agent_floor.json` was
    # measured on, so it stays — removing it would orphan the floor. But
    # a number measured on a model nobody deploys describes the agent on
    # whatever the pins happened to resolve to, which is a different
    # claim from the one a reader takes from it.
    # `llama3.2:3b-instruct-q4_K_M` is what `docker-compose.yml` actually
    # pulls, so it is what a deployment runs.
    #
    # `fail-fast: false` because one model failing is a result about that
    # model, and cancelling the other would throw away the comparison
    # that is the entire point of a matrix.
    strategy:
      fail-fast: false
      matrix:
        model:
          - qwen2.5:0.5b
          - llama3.2:3b-instruct-q4_K_M

    env:
      OLLAMA_MODEL: ${{ github.event.inputs.model || matrix.model }}
      INCIDENT_LIMIT: ${{ github.event.inputs.incidents || '10' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The full agent dependency set, not the trimmed list ci.yml uses for
      # unit tests: this job needs `app.investigator` to actually import, and
      # the harness treats an ImportError as a degraded run.
      - name: Install agent dependencies
        working-directory: services/agents
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction

      - name: Install Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Serve the model
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "ollama up after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || {
            echo "::error title=live-agent-eval::Ollama never became ready."
            tail -50 "$RUNNER_TEMP/ollama.log"
            exit 1
          }
          ollama pull "$OLLAMA_MODEL"

      - name: Dispatch the agent
        env:
          # The harness reads its key from this dedicated slot; the value is
          # irrelevant to Ollama but the SDK requires one to be present.
          WET_EVAL_OPENAI_KEY: ollama
          OPENAI_API_KEY: ollama
          OPENAI_BASE_URL: http://127.0.0.1:11434/v1
          # One pin per role, because that is what the agents actually read.
          # This step used to set `AISOC_LLM_MODEL`, which nothing in
          # `services/agents` has looked at since #478 — the roles resolve
          # through `app.llm.model_pins.get_pin`, whose only env override is
          # `AISOC_MODEL_PIN_<ROLE>`. Left as it was, every agent would have
          # asked Ollama for a gateway alias (`aisoc-recon`) that Ollama has
          # never heard of.
          AISOC_MODEL_PIN_TRIAGE: ${{ env.OLLAMA_MODEL }}
          AISOC_MODEL_PIN_RECON: ${{ env.OLLAMA_MODEL }}
          AISOC_MODEL_PIN_INVESTIGATION: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
          AISOC_MODEL_PIN_COPILOT: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
          AISOC_MODEL_PIN_SUMMARY: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
          AISOC_MODEL_PIN_REPORT: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
          AISOC_MODEL_PIN_NL: ${{ env.OLLAMA_MODEL }}
          AISOC_MODEL_PIN_HUNT: ${{ env.OLLAMA_MODEL }}
        run: |
          set -euo pipefail
          python3 scripts/run_evals.py \
            --wet \
            --wet-require-live \
            --wet-model "$OLLAMA_MODEL" \
            --wet-limit "$INCIDENT_LIMIT" \
            --out live-agent-eval.json \
            --wet-out live-agent-eval.wet.json

      # The assertion. Until this existed the job measured and reported and
      # nothing could fail, which is why the two claim-matrix rows resting on
      # it stayed PARTIAL. The floor is read out of a committed file that
      # records the runs it was derived from, so the number cannot be edited
      # apart from its evidence.
      - name: The measured groundedness floor
        run: python3 scripts/check_live_agent_floor.py --report live-agent-eval.wet.json

      - name: Summarise
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f live-agent-eval.wet.json ]; then
            echo "No report produced — see the dispatch step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          block = json.load(open("live-agent-eval.wet.json"))
          print("## Live agent eval (local model)\n")
          print(f"- mode: `{block.get('mode')}`")
          print(f"- model: `{block.get('model')}`")
          # `latency_seconds` sits at the top of the block. This read
          # `block["aggregate"]["latency_ms"]`, and the report has neither
          # key, so the line it guards could never have printed.
          lat = block.get("latency_seconds", {})
          print(f"- incidents dispatched: {block.get('incidents', 'unknown')}")
          if lat:
              print(f"- latency p50/p95 s: {lat.get('p50')} / {lat.get('p95')}")
          grounded = block.get("groundedness") or {}
          if grounded.get("measured"):
              print(
                  f"- groundedness: mean {grounded['mean']}, median {grounded['median']}, "
                  f"min {grounded['min']} over {grounded['scored_incidents']} incident(s)"
              )
          else:
              print(f"- groundedness: {grounded.get('note', 'not measured')}")
          print(f"- MITRE accuracy: {block.get('mitre_accuracy')}")
          for w in block.get("warnings", []):
              print(f"- warning: {w}")
          PY

      # Parity 3.4 / gap-closure 6.4: replay before and after, publish
      # the delta. Without this the comparator would be a library nobody
      # calls, which this repository has shipped enough of.
      #
      # The previous run's report comes from the last successful run of
      # this workflow on this model. When there is none — a first run, a
      # new matrix leg, an expired artefact — the step says so and stops
      # rather than inventing a baseline of zeros, because a delta
      # against an absent run is exactly the "not measured is not zero"
      # failure the comparator exists to refuse.
      - name: Delta against the previous run of this model
        if: always()
        continue-on-error: true
        id: delta
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ matrix.model }}
        run: |
          set -uo pipefail
          slug=$(printf '%s' "$MODEL" | tr -c 'a-zA-Z0-9' '-')
          prev=$(gh run list --workflow=live-agent-eval.yml --branch=main \
                   --status=success --limit 10 --json databaseId --jq '.[].databaseId' | head -5)
          for run in $prev; do
            if gh run download "$run" -n "live-agent-eval-$run" -D /tmp/prev 2>/dev/null; then
              break
            fi
          done
          if [ ! -f /tmp/prev/live-agent-eval.json ]; then
            echo "No previous report for $MODEL. Reporting that, rather than a delta against" \
                 "a baseline of zeros — which is the failure the comparator exists to refuse."
            exit 0
          fi
          python3 scripts/compare_eval_runs.py \
            --before /tmp/prev/live-agent-eval.json \
            --after live-agent-eval.json \
            --out "delta-$slug.md" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-agent-eval-${{ github.run_id }}
          path: |
            live-agent-eval.json
            live-agent-eval.wet.json
            delta-*.md
          if-no-files-found: warn
          retention-days: 30

      # Substrate, and labelled as such. The row carries substrate:true and
      # eval_mode:substrate-only, and check_scoreboard's honesty check refuses
      # any other combination — appending a deterministic row must never look
      # like live-agent performance. The live half stays unpublished until
      # there is a funded provider key, which is an account action.
      - name: Append a substrate row to the public scoreboard
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cd services/agents
          python3 ../../scripts/check_scoreboard.py --append
          cd ../..
          if git diff --quiet apps/docs/static/data/scoreboard.json; then
            echo "No change to append."
            exit 0
          fi
          git config user.name "aisoc-bot"
          git config user.email "bot@users.noreply.github.com"
          BRANCH="scoreboard/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add apps/docs/static/data/scoreboard.json
          git commit -m "chore(scoreboard): append substrate row for $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(scoreboard): substrate row for $(date -u +%Y-%m-%d)" \
            --body "Appended by \`live-agent-eval.yml\`. Substrate row (deterministic, no LLM) — not live-agent performance."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ollama log on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/ollama.log" || true

  # Commit-level grading of the agent, which did not exist.
  #
  # `REALITY_REPORT.md` calls that "the hard ceiling on the project's
  # credibility": `mitre_accuracy` is an offline keyword extractor, and both
  # jobs that dispatch the real LangGraph ran only on a schedule or on
  # demand. So no pull request had ever been graded on agent behaviour.
  #
  # This job is deliberately small. One incident, the smallest bundled
  # model, and one question: **did the agent place a real LLM call and come
  # back with something schema-valid?** It is not an accuracy measurement —
  # the deep run above is — it is the check that the live path still works
  # on the commit being merged.
  #
  # The distinction matters because the harness has been fooled before. With
  # the model pins unset every agent caught its provider error and used its
  # deterministic fallback, and the run reported `mode: live` with a
  # groundedness of 0.8050 at 0.11s per investigation — flattering, and
  # faster than a network round trip. `--wet-require-live` could not see it
  # because records existed and the stack had imported. `llm_calls_placed`
  # is what closes that hole, and this job asserts on it directly.
  live-agent-smoke:
    name: The agent places a real LLM call on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_MODEL: qwen2.5:0.5b
      INCIDENT_LIMIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install agent dependencies
        working-directory: services/agents
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction

      - name: Install Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Serve the model
        run: |
          set -euo pipefail
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "ollama up after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || {
            echo "::error title=live-agent-smoke::Ollama never became ready."
            tail -50 "$RUNNER_TEMP/ollama.log"
            exit 1
          }
          ollama pull "$OLLAMA_MODEL"

      - name: Dispatch the agent on one incident
        env:
          WET_EVAL_OPENAI_KEY: ollama
          OPENAI_API_KEY: ollama
          OPENAI_BASE_URL: http://127.0.0.1:11434/v1
          # One pin per role: the roles resolve through
          # `app.llm.model_pins.get_pin`, whose only env override is
          # `AISOC_MODEL_PIN_<ROLE>`. Leave them unset and every agent asks
          # Ollama for a gateway alias it has never heard of, then falls back
          # deterministically — which is the failure this job exists to catch.
          AISOC_MODEL_PIN_TRIAGE: qwen2.5:0.5b
          AISOC_MODEL_PIN_RECON: qwen2.5:0.5b
          AISOC_MODEL_PIN_NL: qwen2.5:0.5b
          AISOC_MODEL_PIN_HUNT: qwen2.5:0.5b
        run: |
          set -euo pipefail
          python3 scripts/run_evals.py \
            --wet \
            --wet-require-live \
            --wet-model "$OLLAMA_MODEL" \
            --wet-limit "$INCIDENT_LIMIT" \
            --out live-agent-smoke.json \
            --wet-out live-agent-smoke.wet.json

      # The assertion, and the only one this job makes.
      #
      # A report with `llm_calls_placed: 0` means every agent fell back
      # without a provider ever being reached — a run that looks measured
      # and measured nothing.
      - name: A real LLM call was placed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys

          report = pathlib.Path("live-agent-smoke.wet.json")
          if not report.is_file():
              print("::error title=live-agent-smoke::No report produced; the dispatch step "
                    "did not get far enough to write one.")
              sys.exit(1)

          data = json.loads(report.read_text())
          # Nested under `groundedness`, which is where the harness writes
          # it and where `check_live_agent_floor.py` reads it. The
          # top-level lookup is a fallback rather than the primary, so a
          # schema change surfaces as a failure here rather than as a
          # silently absent field.
          groundedness = data.get("groundedness") or {}
          placed = groundedness.get("llm_calls_placed", data.get("llm_calls_placed"))
          if placed is None:
              print("::error title=live-agent-smoke::The report carries no "
                    "`llm_calls_placed`. That field is what distinguishes a live run from "
                    "one where every agent used its deterministic fallback, and without it "
                    "this job cannot tell them apart.")
              sys.exit(1)
          if not placed:
              print(f"::error title=live-agent-smoke::llm_calls_placed={placed}. The agent "
                    "placed no LLM call at all, so whatever it reported came from a "
                    "fallback rather than a model.")
              sys.exit(1)

          print(f"OK: {placed} LLM call(s) placed against the local model.")
          PY

      - name: Report on failure
        if: failure()
        run: |
          set -uo pipefail
          tail -40 "$RUNNER_TEMP/ollama.log" || true
          [ -f live-agent-smoke.wet.json ] && head -c 2000 live-agent-smoke.wet.json || true
