name: Deploy Web to Fly

# ── Why this no longer runs on push ──────────────────────────────────────────
#
# The Fly account has overdue invoices and both demo apps were reclaimed for
# non-payment. Fly says so itself, verbatim, on every attempt:
#
#   Error: Your account has overdue invoices. Please update your payment
#   information: https://fly.io/dashboard/<account>/billing
#
# That is a billing action, not an engineering one, so a push trigger here can
# only ever fail — and a job that cannot pass teaches everyone to ignore a red
# `main`, which is how a real breakage gets through.
#
# The fix is deliberately NOT a silent `exit 0`. That is exactly what hid this
# for weeks of green runs before: the workflow swallowed "app not found" and
# reported success while nothing was deployed. It still fails loudly — it just
# no longer fails on every push for a reason no contributor can act on.
#
# Settle the invoice, then run this from the Actions tab. Nothing else needs
# to change. The OSS demo path meanwhile is Codespaces, not Fly.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy aisoc-demo-web
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy to Fly
        run: |
          set -uo pipefail
          # Deploy only when the demo app is actually provisioned. The public
          # Fly demo can be torn down / re-provisioned out-of-band; when the
          # app is absent (or no token is configured) a hard `flyctl deploy`
          # fails the run with "app not found" and turns main red for an
          # infra state that isn't a code problem. Skip cleanly instead — the
          # deploy auto-resumes as soon as the app exists again.
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::warning title=deploy-web::FLY_API_TOKEN not set — skipping deploy (demo not provisioned)."
            exit 0
          fi
          # Self-provision rather than skip. The previous behaviour printed a
          # warning and exited 0 when the app was absent, which is how the
          # public demo stayed down for weeks while every deploy run showed
          # green: nothing distinguished "nothing to deploy to" from
          # "deployed fine", and a warning in a passing run is a warning
          # nobody reads.
          if ! flyctl status --app aisoc-demo-web >/dev/null 2>&1; then
            echo "Fly app 'aisoc-demo-web' not found — creating it."
            # Capture the vendor's own error rather than guessing at the
            # cause. The first real run of this said "Your account has
            # overdue invoices", which no list of plausible reasons would
            # have included — and which is the actual reason the public
            # demo has been unreachable.
            if ! create_output=$(flyctl apps create aisoc-demo-web --org personal 2>&1); then
              echo "$create_output"
              echo "::error title=deploy-web::Could not create 'aisoc-demo-web'. Fly said: ${create_output//$'\n'/ }"
              exit 1
            fi
          fi

          flyctl deploy \
            --remote-only \
            --dockerfile apps/web/Dockerfile \
            --config apps/web/fly.toml \
            .

      # A deploy that returns zero is not a demo that works. The app can boot,
      # fail its first request and sit there — which is indistinguishable from
      # success unless something asks it.
      - name: Verify the demo actually responds
        run: |
          set -uo pipefail
          URL="https://aisoc-demo-web.fly.dev"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -A 'AiSOC-deploy-check/1.0' "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "demo responding: HTTP 200 after ${attempt} attempt(s)"
              exit 0
            fi
            echo "  attempt ${attempt}: HTTP ${code} — waiting for the machine to start"
            sleep 15
          done
          echo "::error title=deploy-web::Deploy succeeded but ${URL} never returned 200. The demo is down; a green deploy that leaves the demo unreachable is the failure this check exists to surface."
          exit 1
