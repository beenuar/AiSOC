name: Adoption snapshot

# Nobody could answer "of the people who arrive, how many end up using this?".
# The CLI's opt-in telemetry endpoint does not resolve, and the packages that
# would have reported were never published, so there was no signal at all
# between a visitor landing on the README and a contributor opening a PR.
#
# This reads what is already public — GitHub traffic, release downloads, npm
# and PyPI download counts — and commits a dated row. No collector to run, no
# data asked of users, and a missing source is recorded as "not measured"
# rather than zero.

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adoption-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Collect and commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # GITHUB_TOKEN carries push access for this repo, which the traffic API
      # requires. Without it views/clones come back 403 and land as
      # "not measured".
      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/adoption_snapshot.py --write

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/adoption; then
            echo "::notice title=adoption::No change since the last snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adoption
          git commit -m "chore(adoption): monthly snapshot"
          git push
