name: Adoption snapshot

# Nobody could answer "of the people who arrive, how many end up using this?".
# The CLI's opt-in telemetry endpoint does not resolve, and the packages that
# would have reported were never published, so there was no signal at all
# between a visitor landing on the README and a contributor opening a PR.
#
# This reads what is already public — GitHub traffic, release downloads, npm
# and PyPI download counts — and commits a dated row. No collector to run, no
# data asked of users, and a missing source is recorded as "not measured"
# rather than zero.
#
# The row lands on the unprotected `adoption-data` branch, not on `main`
# (#1445). `main` is branch-protected with no bypass actors, so the old
# direct push failed with GH006 on every scheduled run since protection
# landed — and the obvious alternative, a PR opened with GITHUB_TOKEN, sits
# unmergeable forever because events created by that token never trigger the
# `pull_request` workflows the ~28 required checks come from. Every escape
# that keeps the data on `main` needs an owner-provisioned credential (PAT,
# App, or a protection bypass that re-opens the hole protection closed).
# A data branch needs none of that, and nothing on `main` ever consumed
# `docs/adoption` programmatically — it is a ledger humans read, and the
# ledger's own history lives inside snapshot.json either way.

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adoption-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Collect and commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # The ledger lives on `adoption-data`; the collector appends to whatever
      # history it finds in the working tree, so the branch's state is
      # overlaid first. A missing branch is the fresh-ledger state, not an
      # error — the json carries its own history, so nothing is lost either
      # way.
      - name: Overlay the ledger from the data branch
        run: |
          set -euo pipefail
          # The branch tip is carried in GITHUB_ENV, never read back from
          # FETCH_HEAD in a later step: actions/checkout runs its own fetch,
          # so FETCH_HEAD exists even when this branch does not, and a data
          # commit parented on main's tip would render as a mass deletion.
          if git fetch --depth 1 origin adoption-data; then
            tip=$(git rev-parse FETCH_HEAD)
            git checkout "$tip" -- docs/adoption
            echo "ADOPTION_PARENT=$tip" >> "$GITHUB_ENV"
            echo "overlaid docs/adoption from adoption-data (${tip})"
          else
            echo "::notice title=adoption::no adoption-data branch yet; starting a fresh ledger"
          fi

      # GITHUB_TOKEN carries push access for this repo, which the traffic API
      # requires. Without it views/clones come back 403 and land as
      # "not measured".
      - name: Collect snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/adoption_snapshot.py --write

      # Commit to `adoption-data` without touching this checkout's branch:
      # build a root tree holding ONLY docs/adoption (so the data branch can
      # never be mistaken for a code branch), parent it on the branch tip, and
      # fast-forward push. No force — month over month this is an append.
      - name: Commit the row to the data branch
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/adoption; then
            echo "::notice title=adoption::No change since the last snapshot."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adoption
          full_tree=$(git write-tree)
          adoption_tree=$(git rev-parse "${full_tree}:docs/adoption")
          docs_tree=$(printf '040000 tree %s\tadoption\n' "$adoption_tree" | git mktree)
          root_tree=$(printf '040000 tree %s\tdocs\n' "$docs_tree" | git mktree)
          if [ -n "${ADOPTION_PARENT:-}" ]; then
            commit=$(git commit-tree "$root_tree" -p "$ADOPTION_PARENT" -m "chore(adoption): monthly snapshot")
          else
            commit=$(git commit-tree "$root_tree" -m "chore(adoption): monthly snapshot")
          fi
          git push origin "${commit}:refs/heads/adoption-data"
          echo "::notice title=adoption::Snapshot committed to adoption-data (${commit})."
