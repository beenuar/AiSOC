name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  # Keyless cosign signing + SLSA provenance attestation need an OIDC token.
  id-token: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CLEAN="${VERSION#v}"
          BODY=$(awk "/^## \[${CLEAN}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Reproducible source tarball — excludes the .git directory but keeps
      # everything a user needs to build / inspect the release contents
      # offline.
      - name: Build source tarball
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.VERSION }}"
          git archive --format=tar.gz \
            --prefix="aisoc-${VERSION#v}/" \
            -o "dist/aisoc-${VERSION}-source.tar.gz" \
            "$GITHUB_REF_NAME"

      # SBOM (SPDX 2.3 JSON) so downstream users can vet what's in the
      # release without re-running their own scanners.
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/aisoc-sbom-${{ steps.version.outputs.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Checksums for every file in dist/ — both SHA-256 and SHA-512 so we
      # cover both common verification preferences.
      - name: Compute checksums
        working-directory: dist
        run: |
          : > checksums.txt
          for f in *; do
            if [ "$f" = "checksums.txt" ]; then continue; fi
            sha256sum "$f" >> checksums.txt
            sha512sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: "AiSOC ${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/aisoc-${{ steps.version.outputs.VERSION }}-source.tar.gz
            dist/aisoc-sbom-${{ steps.version.outputs.VERSION }}.spdx.json
            dist/checksums.txt

  # Build & push Docker images
  #
  # Most services build from their own service directory. The `web` app is
  # special: its Dockerfile copies workspace packages and pnpm config from the
  # monorepo root, so its build context must be `.` (the repo root) with the
  # Dockerfile path explicitly set.
  #
  # The matrix here must stay aligned with publish-images.yml — every service
  # whose `:main` / `:latest` tag is published on push-to-main also needs a
  # pinned `:vX.Y.Z` tag on release, so users who set `AISOC_VERSION=vX.Y.Z`
  # in their .env get a reproducible deploy across the full stack.
  docker-push:
    name: Docker — Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Demo-stack images (pulled by `pnpm aisoc:demo`).
          - service: api
            context: services/api
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-core-api
          - service: agents
            context: services/agents
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-agents
          - service: realtime
            context: services/realtime
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-realtime
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/beenuar/aisoc-web

          # Full-stack backend images (pulled by `docker compose up -d` with
          # `pull_policy: missing` when AISOC_VERSION is pinned).
          - service: ingest
            context: services/ingest
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-ingest
          - service: enrichment
            context: services/enrichment
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-enrichment
          - service: fusion
            context: services/fusion
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-fusion
          - service: actions
            context: services/actions
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-actions
          - service: connectors
            context: services/connectors
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-connectors
          - service: threatintel
            context: services/threatintel
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-threatintel
          - service: ueba
            context: services/ueba
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-ueba
          - service: slack-bot
            context: services/slack-bot
            dockerfile: Dockerfile
            image: ghcr.io/beenuar/aisoc-slack-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Web image needs NEXT_PUBLIC_DEMO_* flags baked in at build time so the
      # released ghcr.io/beenuar/aisoc-web:vX.Y.Z image (used by AISOC_VERSION
      # pinning) ships a bundle that knows it's a demo. Mirrors the same step
      # in publish-images.yml. Other images gate demo behavior at runtime via
      # AISOC_DEMO_MODE so they don't need build args.
      - id: web-build-args
        if: matrix.service == 'web'
        run: |
          {
            echo 'build_args<<EOF'
            echo 'NEXT_PUBLIC_DEMO_MODE=true'
            echo 'NEXT_PUBLIC_DEMO_DEEPLINK=/cases/INC-RT-001?tab=ledger'
            echo 'NEXT_PUBLIC_DEMO_BANNER=Demo data resets daily at 00:00 UTC. All write actions are disabled.'
            echo 'NEXT_PUBLIC_DEMO_AUTOLOGIN_EMAIL=demo@tryaisoc.com'
            echo 'NEXT_PUBLIC_DEMO_AUTOLOGIN_PASSWORD=aisoc-demo'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:latest
          build-args: ${{ steps.web-build-args.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
          # SLSA provenance + SPDX SBOM attached to the image by BuildKit.
          provenance: mode=max
          sbom: true

      # ── Supply-chain attestation (mirrors publish-images.yml) ────────────
      # Keyless cosign signature + CycloneDX SBOM attestation per released
      # image. Verification commands: docs/operations/verifying-releases.md.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"

      - name: Attach CycloneDX SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${{ matrix.image }}@${DIGEST}" -o cyclonedx-json > /tmp/sbom.cdx.json
          cosign attest --yes \
            --type cyclonedx \
            --predicate /tmp/sbom.cdx.json \
            "${{ matrix.image }}@${DIGEST}"

  # ── Publish the npm packages ───────────────────────────────────────────────
  #
  # Every package is built and packed on every release, whether or not the
  # upload is enabled, so this job fails the moment a package stops being
  # publishable — a broken `npx aisoc` must never reach the README again.
  #
  # Only the final upload is gated on `NPM_TOKEN`, so the release does not go
  # red before the registry credential exists. One-time setup (including the
  # move to token-free trusted publishing after the first release) is in
  # docs/operations/publishing.md.
  #
  # `pnpm pack` rather than `npm pack`: it rewrites `workspace:*` dependency
  # specifiers to real versions, which npm would otherwise reject. The tarball
  # is then handed to `npm publish`, which is what supports `--provenance`.
  npm-publish:
    name: npm — publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    # Job-level so the step-level `if` guards below can read it. A step cannot
    # see its own `env` block from its `if` expression.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: aisoc
            dir: packages/aisoc-lite
          - pkg: '@aisoc/mcp'
            dir: services/mcp
          - pkg: '@aisoc/sdk'
            dir: packages/sdk-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build ${{ matrix.pkg }}
        run: pnpm --filter ${{ matrix.pkg }} build

      - name: Pack tarball
        id: pack
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls -t "$RUNNER_TEMP"/*.tgz | head -1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          tar -tzf "$TARBALL" | head -20

      # Republishing an unchanged version is a hard error on npm, and package
      # versions move independently of the monorepo tag, so most releases will
      # legitimately have nothing to push for some packages.
      - name: Is this version already on npm?
        id: exists
        run: |
          set -euo pipefail
          if npm view "${{ matrix.pkg }}@${{ steps.pack.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.already == 'false' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance

      - name: Explain a skipped publish
        if: steps.exists.outputs.already == 'true' || env.NPM_TOKEN == ''
        run: |
          if [ "${{ steps.exists.outputs.already }}" = "true" ]; then
            echo "::notice title=npm::${{ matrix.pkg }}@${{ steps.pack.outputs.version }} is already published — nothing to do."
          else
            echo "::warning title=npm::NPM_TOKEN is not configured, so ${{ matrix.pkg }} was built and packed but not uploaded. See docs/operations/publishing.md."
          fi

  # ── Publish the PyPI packages ──────────────────────────────────────────────
  #
  # Uses PyPI Trusted Publishing (OIDC), so there is no API token to store or
  # rotate. PyPI supports "pending" publishers, which means the trust
  # relationship can be registered before the project exists — that is how the
  # first upload of each of these works. Setup: docs/operations/publishing.md.
  pypi-publish:
    name: PyPI — publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: aisoc-sandbox
            dir: packages/aisoc-sandbox
          - pkg: aisoc-cli
            dir: packages/aisoc-cli
          - pkg: aisoc-sdk
            dir: packages/sdk-py
          - pkg: aisoc-plugin-sdk
            dir: packages/plugin-sdk-py
          - pkg: aisoc-detections
            dir: packages/aisoc-detections
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade build twine
          python -m build
          python -m twine check dist/*
          ls -la dist/

      # `skip-existing` because package versions move independently of the
      # monorepo tag, so a release often has nothing new for a given package.
      - name: Publish to PyPI
        if: vars.AISOC_PYPI_TRUSTED_PUBLISHING == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ matrix.dir }}/dist
          skip-existing: true

      - name: Explain a skipped publish
        if: vars.AISOC_PYPI_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "::warning title=PyPI::Trusted publishing is not enabled, so ${{ matrix.pkg }} was built and validated but not uploaded. Set the AISOC_PYPI_TRUSTED_PUBLISHING repository variable to 'true' once the pending publishers exist — see docs/operations/publishing.md."
