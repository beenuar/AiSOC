name: Deploy API to Fly

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "packages/types/**"
      - "marketplace/**"
      - "plugins/**"
      - "scripts/build_marketplace.py"
      - "infra/fly/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy aisoc-demo-api
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      # Deploy only when the demo app is actually provisioned. The public Fly
      # demo can be torn down / re-provisioned out-of-band; when the app is
      # absent (or no token is configured) a hard `flyctl deploy` fails the run
      # with "app not found" and turns main red for an infra state that isn't a
      # code problem. Gate the remaining steps instead — deploy auto-resumes as
      # soon as the app exists again.
      - name: Check Fly app provisioned
        id: flycheck
        run: |
          set -uo pipefail
          # Without a token there is nothing to do, so skipping is the only
          # option. A missing *app* is different: self-provision it. Exiting
          # 0 on a missing app is how the public demo stayed down for weeks
          # while every run showed green — nothing in the history
          # distinguished "nothing to deploy to" from "deployed fine", and a
          # warning inside a passing run is a warning nobody reads.
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::warning title=deploy-api::FLY_API_TOKEN not set — skipping deploy (nothing to deploy to)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ! flyctl status --app aisoc-demo-api >/dev/null 2>&1; then
            echo "Fly app 'aisoc-demo-api' not found — creating it."
            if flyctl apps create aisoc-demo-api --org personal; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error title=deploy-api::Could not create 'aisoc-demo-api'. The token may lack org permissions, or the name may be taken."
              exit 1
            fi
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.flycheck.outputs.deploy == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Mirror infra/fly/fly-demo-deploy.sh::stage_marketplace_index. The api
      # Dockerfile does `COPY . .` against services/api/, so anything outside
      # that dir is invisible to the image. /api/v1/marketplace returns 503
      # without index.json present at /app/marketplace/index.json in the image.
      - name: Stage marketplace/index.json into services/api
        if: steps.flycheck.outputs.deploy == 'true'
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/build_marketplace.py
          mkdir -p services/api/marketplace
          cp marketplace/index.json services/api/marketplace/index.json
          ls -la services/api/marketplace/

      # The api Dockerfile was written assuming build context = services/api/
      # (it does `COPY pyproject.toml ./` and `COPY . .`). flyctl deploy uses
      # its cwd as the build context, so we cd into services/api/ and pass an
      # absolute path to the fly.toml so flyctl still finds it. This mirrors
      # the deploy_app() helper in infra/fly/fly-demo-deploy.sh.
      - name: Deploy to Fly (context=services/api)
        if: steps.flycheck.outputs.deploy == 'true'
        working-directory: services/api
        run: |
          flyctl deploy \
            --remote-only \
            --config "${GITHUB_WORKSPACE}/infra/fly/api/fly.toml" \
            --app aisoc-demo-api

      # A deploy that returns zero is not an API that works. /health is the
      # cheapest thing that tells the two apart, and without it a green run
      # says nothing about whether the demo is reachable.
      - name: Verify the API actually responds
        if: steps.flycheck.outputs.deploy == 'true'
        run: |
          set -uo pipefail
          URL="https://aisoc-demo-api.fly.dev/health"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -A 'AiSOC-deploy-check/1.0' "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "api responding: HTTP 200 after ${attempt} attempt(s)"
              exit 0
            fi
            echo "  attempt ${attempt}: HTTP ${code} — waiting for the machine to start"
            sleep 15
          done
          echo "::error title=deploy-api::Deploy succeeded but ${URL} never returned 200. Fly Postgres autostop can leave the database unwakeable, which 500s every data-backed route while the deploy itself looks clean."
          exit 1
