name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, go]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # `plans/cyble-aisoc/` is a historical-spec mirror of the (private)
          # AISOC-Cyble repository, kept for open-source provenance. Its
          # `platform/` Python prototype was superseded by the canonical
          # implementation under `services/` and is not a deployed artifact;
          # CodeQL findings there would be noise, not actionable security
          # issues.
          config: |
            paths-ignore:
              - 'plans/cyble-aisoc/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: '/language:${{ matrix.language }}'
