name: Mobile

# apps/mobile is outside the root pnpm workspace — it needs Metro rather than
# Turbopack and brings its own Expo dependency tree, which would add several
# hundred megabytes to every other TypeScript job for no benefit to any of
# them. So it gets its own workflow, and it only runs when it or the SDK it
# depends on changes.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/sdk-ts/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/sdk-ts/**'
      - '.github/workflows/mobile.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile — Type-check & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # No --frozen-lockfile: this project keeps its own lockfile and is not
      # part of the root one, so a root lockfile refresh must not red this job.
      - name: Install
        run: pnpm install

      - name: Type-check
        run: pnpm typecheck

      # Only src/lib runs here. Storage, the device-token provider and the API
      # client are injected, so those modules run under plain Node with no
      # React Native runtime, no Metro and no simulator. The screens are
      # deliberately thin over them.
      - name: Unit tests
        run: pnpm test

      # The README claims what is and is not verified. This keeps it honest:
      # if somebody later adds an Expo build or a device test, the claim has
      # to move at the same time.
      - name: The README must not claim a device build happened
        run: |
          set -euo pipefail
          if grep -qiE '^\| Built for a device \| \*\*No\.\*\*' README.md; then
            echo "OK: README states no device build has been performed."
          else
            echo "::error::apps/mobile/README.md no longer states that no device build has been performed."
            echo "Either restore the statement, or update it because a device build is now actually gated here."
            exit 1
          fi
