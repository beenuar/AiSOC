name: Lake tenant isolation

# The ClickHouse lake holds every tenant's raw events in one table, so the
# only thing standing between tenant A and tenant B is the `tenant_id`
# predicate that `services/api/app/services/lake_sql.py` injects into
# untrusted operator SQL before it reaches the warehouse. That rewriter is
# built on sqlglot's AST, and sqlglot's AST is not a stable contract.
#
# It has already broken once in exactly the way that is hardest to notice.
# sqlglot 27 moved the SELECT's FROM clause from `args["from"]` to
# `args["from_"]`. The rewriter read the old key, found nothing, concluded
# the statement was a constant projection with no tables, and returned it
# unchanged — skipping the table allowlist, the ban on ClickHouse table
# functions such as `url()`, and the tenant predicate — while reporting
# success. `services/api/pyproject.toml` allowed `<31.0.0` at the time, so a
# `poetry install` produced an API with no lake isolation at all. CI never
# saw it because every workflow installed the narrow `>=23,<27` range.
#
# Two gates, both cheap, both addressing that specific failure:
#
#   1. `check_sqlglot_pin.py` — every install path must declare the same
#      range, so two builds of one commit cannot disagree about the
#      version of the parser that enforces isolation.
#   2. The rewriter suite runs against the pinned range *and* against the
#      newest sqlglot pip will resolve. The second leg is forward-compatibility
#      coverage: we ship the pinned range, but a future bump must fail loudly
#      here rather than quietly downgrade isolation in production.
#
# Why the forward leg is unbounded above rather than naming the next major.
# It used to read `>=27,<31`, which worked only while the shipped range sat
# below 27. With the pin on the 30 line there is no sqlglot 31 to name, and
# the three ways of writing that leg are all worse than leaving the ceiling
# off:
#
#   `>=31`          pip cannot resolve it, so the leg is red every run for a
#                   reason that has nothing to do with the change under test.
#   `>=30,<31`      identical to the shipped leg. Two legs, one question, and
#                   the matrix reports two greens for one piece of evidence.
#   `>=27,<30`      tests majors *below* the pin. That is regression coverage
#                   for versions nothing installs, and it removes the only
#                   thing standing between a future major and production —
#                   which is precisely the hole 27 came through.
#
# Unbounded resolves the newest release on every run, so the leg arms itself
# the day sqlglot 31 is published, with no edit and no one remembering. Until
# then it resolves inside the shipped range, and the `Forward coverage`
# step below says so as a warning annotation rather than letting a duplicate
# green pass for evidence. `scripts/check_sqlglot_pin.py` enforces the
# structural half — the leg must carry no upper bound and must not float
# below the shipped floor — because that is the part that can rot silently.
# Whether upstream has published a higher major is not this repository's to
# assert.
#
# The cost is stated rather than hidden: this leg depends on the outside
# world, so an upstream release can turn it red without a local change. That
# is the job. The workflow is path-filtered to the rewriter, its tests and
# its pins, so the people it interrupts are the ones who need to know.

on:
  push:
    branches: [main]
    paths:
      - 'services/api/app/services/lake_sql.py'
      - 'services/api/tests/test_lake_sql*.py'
      - 'services/api/pyproject.toml'
      - 'services/api/Dockerfile'
      - 'scripts/check_sqlglot_pin.py'
      - '.github/workflows/lake-isolation.yml'
  pull_request:
    paths:
      - 'services/api/app/services/lake_sql.py'
      - 'services/api/tests/test_lake_sql*.py'
      - 'services/api/pyproject.toml'
      - 'services/api/Dockerfile'
      - 'scripts/check_sqlglot_pin.py'
      - '.github/workflows/lake-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lake-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-agreement:
    name: sqlglot pin is identical everywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python scripts/check_sqlglot_pin.py

  rewriter:
    name: rewriter (sqlglot ${{ matrix.sqlglot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The range the service ships and CI installs everywhere else.
          - sqlglot: '>=30,<31'
            label: shipped
          # Whatever is newest. Not shipped; proves a bump cannot silently
          # turn the isolation guarantee off the way 27 did. No ceiling, so
          # it starts testing the next major the day one exists.
          - sqlglot: '>=30'
            label: forward-compat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --quiet --upgrade pytest "sqlglot${{ matrix.sqlglot }}"
      - name: Record resolved version
        run: python -c "import sqlglot; print('resolved sqlglot', sqlglot.__version__)"
      - name: Forward coverage — is this leg above the shipped ceiling?
        if: matrix.label == 'forward-compat'
        # A leg that resolves back inside the shipped range is re-running the
        # shipped version. The suite below is still worth running, but the
        # result is not forward coverage and must not read as though it were.
        run: |
          python - <<'PY'
          import sqlglot

          # Kept equal to the `<N` bound of the shipped range by
          # `scripts/check_sqlglot_pin.py`, so this number cannot drift away
          # from the pin it describes and start reporting the wrong verdict.
          SHIPPED_CEILING = 31

          major = int(sqlglot.__version__.split(".")[0])
          if major >= SHIPPED_CEILING:
              print(f"forward coverage: sqlglot {sqlglot.__version__} is above the shipped ceiling {SHIPPED_CEILING}")
          else:
              print(
                  f"::warning title=No forward coverage today::sqlglot {sqlglot.__version__} is the newest "
                  f"release and it is inside the shipped range, so this leg is re-running the shipped "
                  f"version rather than proving a future major is safe. It becomes real forward coverage "
                  f"with no edit to this file once {SHIPPED_CEILING}.0.0 is published."
              )
          PY
      - name: Rewriter + fail-closed suites
        working-directory: services/api
        run: python -m pytest tests/test_lake_sql.py tests/test_lake_sql_fail_closed.py -q
