# The two playbook-step routes that touch vendor credentials, against real stores.
#
# Why this exists
# ---------------
# POST /api/v1/playbook-steps/references returns a tenant's vault-decrypted
# integration secrets — bearer header values, webhook URLs with embedded
# tokens, PagerDuty routing keys, SMTP passwords — and admitted any session
# holding actions:execute, which every soc_analyst has (GHSA-c5qq-vhf5-wjqc).
#
# POST /api/v1/playbook-steps/dispatch forwards a free-form params dict to
# services/actions, where it was merged on top of the fields translated from
# the connector's decrypted auth_config. Naming cs_base_url therefore made the
# platform present the tenant's stored CrowdStrike credential to a host the
# caller chose, and for the vendors with no entry in VENDOR_CREDENTIAL_MAP the
# caller supplied the whole connection, giving a read-SSRF from the actions
# container with the reply reflected into the dispatch report
# (GHSA-78jg-x2ch-638f).
#
# Why live, and why the vendor is a socket
# ----------------------------------------
# Neither finding is "a dict had the wrong key". They are "the platform handed
# a secret to somebody who should not have it" and "the platform spent a secret
# at an address a user named". The first is answerable only by reading the real
# response body off the real application; the second only by asking the vendor
# what it was paid with. So Postgres is real, the vault does real Fernet, the
# JWTs are real, the actions service runs on a real socket, and CrowdStrike is
# a real HTTP server.
#
# ENVIRONMENT=production throughout: development is in AUTH_BYPASS_ENVIRONMENTS
# and resolves an uncredentialed request to a demo admin, which would make an
# authorization test pass for the worst possible reason.
#
# No `paths:` filter. A path filter here would mean the gate skips on exactly
# the pull request that reshapes the resolver it exists to protect.
name: Playbook step credentials (live)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed per commit on push and per pull request on PRs, never on `github.ref`
  # alone: that shape cancels the run for the commit before it, and a check
  # that was cancelled never graded the commit it is reported against.
  group: playbook-step-credentials-live-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  playbook-step-credentials-live:
    name: vendor secrets reach only the peer that may have them
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The runtime role, not the owner: a superuser ignores every RLS policy
      # even under FORCE ROW LEVEL SECURITY, so grading as `aisoc` would grade
      # nothing. RLS is not the control on these two routes — both depend on
      # get_db, which binds no app.current_tenant_id, so the policy's
      # `OR current_tenant_id() IS NULL` arm matches every row and the tenant
      # predicate in the query is the only scoping there is. The suites assert
      # that predicate directly; running as aisoc_app keeps the seeds honest,
      # because the WITH CHECK arm has no unbound form and an unbound seed is
      # refused rather than silently landing.
      LIVE_DSN: postgresql+asyncpg://aisoc_app:aisoc_app_ci_only@localhost:5432/aisoc
      PGPASSWORD: aisoc_ci_only
      REF_SUITE: ../../tests/isolation/test_playbook_reference_secrets_live.py
      DISPATCH_SUITE: ../../tests/isolation/test_playbook_step_credential_redirect_live.py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start PostgreSQL with registry fallback
        uses: ./.github/actions/start-postgres
        with:
          password: aisoc_ci_only

      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6
        with:
          python-version: "3.11"

      # Each service from its own lockfile, into its own virtualenv. They both
      # name their top-level package `app`, so one interpreter cannot hold
      # both — which is also why the dispatch suite starts the actions service
      # as a subprocess rather than importing it.
      - name: Install the API from its lockfile
        working-directory: services/api
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
          python -m pip install --quiet pytest pytest-asyncio

      - name: Install the actions service into its own virtualenv
        run: |
          set -euo pipefail
          python -m venv /tmp/actions-venv
          /tmp/actions-venv/bin/python -m pip install --quiet --upgrade pip
          # Written to a file and installed with -r, never shell-split: the
          # locked set carries environment markers containing spaces, so
          # word-splitting the output hands pip a fragment and it answers
          # `Invalid requirement: ''`.
          python3 scripts/service_requirements.py actions --locked > /tmp/actions-requirements.txt
          /tmp/actions-venv/bin/python -m pip install --quiet -r /tmp/actions-requirements.txt
          /tmp/actions-venv/bin/python -m pip install --quiet uvicorn
          echo "ISOLATION_ACTIONS_PYTHON=/tmp/actions-venv/bin/python" >> "$GITHUB_ENV"

      - name: Apply every migration, in order
        run: |
          set -euo pipefail
          for f in services/api/migrations/*.sql; do
            psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Give the runtime role its password
        run: |
          set -euo pipefail
          psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -c \
            "ALTER ROLE aisoc_app WITH PASSWORD 'aisoc_app_ci_only';"
          psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -c \
            "GRANT USAGE ON SCHEMA public TO aisoc_app;"

      # Without this a future change to the DSN could silently move the whole
      # job onto the owner, and every seed would land regardless of policy.
      - name: Refuse to grade as a role that bypasses RLS
        run: |
          set -euo pipefail
          privileged=$(psql -h localhost -U aisoc -d aisoc -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'aisoc_app';")
          if [ "$privileged" != "f" ]; then
            echo "FAIL: aisoc_app is SUPERUSER or BYPASSRLS, so this job would grade nothing."
            exit 1
          fi
          echo "OK: aisoc_app is neither SUPERUSER nor BYPASSRLS."

      - name: Mint a credential key for the vault
        run: |
          KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "AISOC_CREDENTIAL_KEY=$KEY" >> "$GITHUB_ENV"

      # ── GHSA-c5qq-vhf5-wjqc ────────────────────────────────────────────
      - name: Decrypted references reach the service peer and nobody else
        working-directory: services/api
        env:
          ISOLATION_PLAYBOOK_REF_DSN: ${{ env.LIVE_DSN }}
        run: python -m pytest "$REF_SUITE" -v --tb=short

      # The negative control, which re-injects the real defect: the route used
      # _resolve_caller, which admits a session as well as the service peer.
      # If putting it back does not make the suite fail, the suite is not
      # driving the production resolver and its green tick means nothing.
      #
      # The guard above the edit is what keeps this honest over time: if the
      # call is ever reshaped so the string is not found, this control fails
      # loudly rather than passing by editing nothing.
      - name: The reference gate fails when the session caller is readmitted
        working-directory: services/api
        env:
          ISOLATION_PLAYBOOK_REF_DSN: ${{ env.LIVE_DSN }}
        run: |
          set -euo pipefail
          cp app/api/v1/endpoints/playbook_steps.py /tmp/playbook_steps.bak
          restore() { cp /tmp/playbook_steps.bak app/api/v1/endpoints/playbook_steps.py; }
          trap restore EXIT
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/api/v1/endpoints/playbook_steps.py")
          s = p.read_text()
          needle = "    tenant_id = _resolve_reference_caller(body.tenant_id, user, x_aisoc_service_token)"
          if needle not in s:
              print("FAIL: the call this control reverts is not there to revert.")
              print("      The resolver has been reshaped and this control proves nothing.")
              sys.exit(1)
          p.write_text(s.replace(needle, "    tenant_id, _ = _resolve_caller(body.tenant_id, user, x_aisoc_service_token)", 1))
          PY
          if python -m pytest "$REF_SUITE" -q >/dev/null 2>&1; then
            echo "FAIL: the suite passed with the session caller readmitted."
            echo "      It is not grading the production resolver."
            exit 1
          fi
          echo "OK: readmitting the session caller makes the suite fail, as it must."
          restore
          trap - EXIT
          python -m pytest "$REF_SUITE" -q

      # ── GHSA-78jg-x2ch-638f ────────────────────────────────────────────
      - name: A caller's params cannot redirect a stored credential
        working-directory: services/api
        env:
          ISOLATION_STEP_DISPATCH_DSN: ${{ env.LIVE_DSN }}
        run: python -m pytest "$DISPATCH_SUITE" -v --tb=short

      - name: The dispatch contract holds inside the actions service
        working-directory: services/actions
        run: |
          set -euo pipefail
          PYTHONPATH=. "$ISOLATION_ACTIONS_PYTHON" -m pytest \
            tests/test_param_override_credential_redirect.py tests/test_credential_resolver.py -v --tb=short

      # Two negative controls, one per half of the fix. Each removes the real
      # control and requires the suite to go red.
      - name: The gate fails when a caller may override a stored field again
        working-directory: services/actions
        run: |
          set -euo pipefail
          cp app/services/credential_resolver.py /tmp/credential_resolver.bak
          restore() { cp /tmp/credential_resolver.bak app/services/credential_resolver.py; }
          trap restore EXIT
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/services/credential_resolver.py")
          s = p.read_text()
          needle = "    refused = sorted(key for key in (extra or {}) if key in protected)\n    if refused:"
          if needle not in s:
              print("FAIL: the refusal this control removes is not there to remove.")
              sys.exit(1)
          p.write_text(s.replace("    if refused:", "    if False:  # negative control", 1))
          PY
          if PYTHONPATH=. "$ISOLATION_ACTIONS_PYTHON" -m pytest \
               tests/test_param_override_credential_redirect.py -q >/dev/null 2>&1; then
            echo "FAIL: the suite passed with the protected-key refusal removed."
            exit 1
          fi
          echo "OK: removing the refusal makes the suite fail, as it must."
          restore
          trap - EXIT

      - name: The gate fails when the SSRF destination guard is removed
        working-directory: services/actions
        run: |
          set -euo pipefail
          cp app/live_actions/dispatcher.py /tmp/dispatcher.bak
          restore() { cp /tmp/dispatcher.bak app/live_actions/dispatcher.py; }
          trap restore EXIT
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/live_actions/dispatcher.py")
          s = p.read_text()
          needle = "    refused_destination = await asyncio.to_thread(_first_blocked_destination, request.params)\n"
          if needle not in s:
              print("FAIL: the guard call this control removes is not there to remove.")
              sys.exit(1)
          p.write_text(s.replace(needle, "    refused_destination = None\n", 1))
          PY
          if PYTHONPATH=. "$ISOLATION_ACTIONS_PYTHON" -m pytest \
               tests/test_param_override_credential_redirect.py -q >/dev/null 2>&1; then
            echo "FAIL: the suite passed with the SSRF destination guard removed."
            exit 1
          fi
          echo "OK: removing the guard makes the suite fail, as it must."
          restore
          trap - EXIT
          PYTHONPATH=. "$ISOLATION_ACTIONS_PYTHON" -m pytest tests/test_param_override_credential_redirect.py -q
