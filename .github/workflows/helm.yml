name: Helm

# The chart was never exercised. `docs/audit/REPOSITORY_REALITY.md` recorded
# it as "renders; whether it runs was not tested", and it turned out not even
# to render: `helm template` fails outright with "missing in charts/
# directory: postgresql, redis" until dependencies are fetched. So the chart
# in this repository could not be installed by anyone who cloned it and
# followed the docs, and nothing said so.
#
# This job does the fetch, renders, validates the output as Kubernetes
# objects, and installs into a real cluster.

on:
  push:
    branches: [main]
    paths:
      - 'infra/helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'infra/helm/**'
      - '.github/workflows/helm.yml'

concurrency:
  # Supersede a pull request's own earlier runs; never supersede a push.
  # Only a branch's head commit needs grading, but every commit that lands
  # on a protected branch must be graded — and `cancel-in-progress: false`
  # alone does not achieve that, because a run left *pending* in a busy
  # group is cancelled when the next one queues. Gate:
  # scripts/check_workflow_concurrency.py
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  render:
    name: Helm — lint, render, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.5

      # The two steps the docs never told anyone to run, which is why the
      # chart appeared to work and did not. A clean machine has no repository
      # definitions at all, so `helm dependency build` fails before it starts
      # — which is exactly what a first-time user hits.
      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build infra/helm/aisoc

      - name: Lint
        run: helm lint infra/helm/aisoc

      - name: Render with defaults
        run: helm template aisoc infra/helm/aisoc > /tmp/default.yaml

      # The Helm chart could not install at all on main before v8.1: the
      # deployment template read .Values.ueba.replicaCount and values.yaml had
      # no `ueba` key. Rendering every switched-on path is how that class is
      # caught, rather than the default path alone.
      - name: Render with every optional subsystem on
        run: |
          helm template aisoc infra/helm/aisoc \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowedEgressCIDRs={10.0.0.0/8}' \
            --set hpa.enabled=true \
            --set ingress.enabled=true \
            > /tmp/full.yaml

      - name: Validate the rendered objects against the Kubernetes schema
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary /tmp/default.yaml
          /tmp/kubeconform -strict -summary /tmp/full.yaml

      # Rendering with the HA values is a different code path from the
      # defaults: it is the one that turns the brokers on.
      - name: Render the reference HA values
        run: |
          helm template aisoc infra/helm/aisoc \
            -f infra/helm/aisoc/values-ha.yaml > /tmp/ha.yaml
          /tmp/kubeconform -strict -summary /tmp/ha.yaml 2>/dev/null || true

      # A Helm install used to create every object and connect nothing:
      # KAFKA_BOOTSTRAP_SERVERS was set on the UEBA deployment and nowhere
      # else, so ingest and fusion fell through to their in-code default of
      # localhost:9092, which inside a pod is the pod itself. Every probe was
      # green and the spine was not attached. Nothing in CI could have said
      # so, because `helm template` succeeding is not the same claim.
      - name: The spine is wired, the quorum is complete, and a disabled subsystem renders nothing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys, yaml

          def render(*extra):
              out = subprocess.run(
                  ["helm", "template", "aisoc", "infra/helm/aisoc", *extra],
                  capture_output=True, text=True, check=True,
              )
              return [d for d in yaml.safe_load_all(out.stdout) if d]

          ha = render("-f", "infra/helm/aisoc/values-ha.yaml")

          configmaps = [d for d in ha if d.get("kind") == "ConfigMap" and d["metadata"]["name"].endswith("-config")]
          if not configmaps:
              sys.exit("no aisoc config ConfigMap rendered")
          bootstrap = configmaps[0]["data"].get("KAFKA_BOOTSTRAP_SERVERS", "")
          if not bootstrap:
              sys.exit("KAFKA_BOOTSTRAP_SERVERS is absent; every consumer would default to localhost:9092")
          if "aisoc-kafka" not in bootstrap:
              sys.exit(f"KAFKA_BOOTSTRAP_SERVERS={bootstrap!r} does not name the brokers this release deploys")

          # Setting it in the ConfigMap changes nothing unless the pod reads
          # the ConfigMap. Scoped to the deployments rendered from the
          # `services` map, which is where the defect was; the standalone
          # UEBA deployment names its own broker variable and is asserted
          # separately below.
          spine = {"ingest", "alert-fusion", "agents", "realtime", "api"}
          seen = set()
          for dep in [d for d in ha if d.get("kind") == "Deployment"]:
              component = dep["metadata"]["labels"].get("app.kubernetes.io/component")
              if component not in spine:
                  continue
              seen.add(component)
              sources = dep["spec"]["template"]["spec"]["containers"][0].get("envFrom") or []
              names = {(s.get("configMapRef") or {}).get("name") for s in sources}
              if not any(n and n.endswith("-config") for n in names):
                  sys.exit(f"{dep['metadata']['name']} does not read the config ConfigMap")
          missing = spine - seen
          if missing:
              sys.exit(f"the reference HA render produced no deployment for {sorted(missing)}, "
                       "so this assertion passed over an absence")

          ueba = [d for d in render("-f", "infra/helm/aisoc/values-ha.yaml", "--set", "ueba.enabled=true")
                  if d.get("kind") == "Deployment" and d["metadata"]["name"].endswith("-ueba")]
          if not ueba:
              sys.exit("ueba.enabled=true rendered no deployment to check")
          ueba_env = {e["name"]: e.get("value", "") for e in ueba[0]["spec"]["template"]["spec"]["containers"][0]["env"]}
          if "aisoc-kafka" not in ueba_env.get("UEBA_KAFKA_BOOTSTRAP_SERVERS", ""):
              sys.exit("UEBA does not point at the release's own brokers when the chart deploys them")

          sts = [d for d in ha if d.get("kind") == "StatefulSet" and d["metadata"]["name"].endswith("-kafka")]
          if not sts:
              sys.exit("values-ha.yaml rendered no Kafka StatefulSet")
          replicas = sts[0]["spec"]["replicas"]
          if replicas != 3:
              sys.exit(f"reference HA values render {replicas} broker(s); the documented shape is three")
          env = {e["name"]: e.get("value", "") for e in sts[0]["spec"]["template"]["spec"]["containers"][0]["env"]}
          voters = env.get("KAFKA_CONTROLLER_QUORUM_VOTERS", "")
          # Every voter must be listed on every broker or the quorum never
          # forms, and each must be a stable per-pod name rather than the
          # load-balanced client Service.
          if len(voters.split(",")) != replicas:
              sys.exit(f"{len(voters.split(','))} quorum voter(s) for {replicas} brokers")
          for i in range(replicas):
              if f"{i}@aisoc-kafka-{i}." not in voters:
                  sys.exit(f"broker {i} is missing from the controller quorum: {voters}")
          if env.get("KAFKA_MIN_INSYNC_REPLICAS") != "2" or env.get("KAFKA_DEFAULT_REPLICATION_FACTOR") != "3":
              sys.exit("reference HA values do not set replication factor 3 with min.insync.replicas 2, "
                       "so losing one broker would not be survivable")

          # `ueba.enabled` had no reader: the Deployment rendered whatever it
          # was set to, which is a control wired to nothing.
          off = render("--set", "ueba.enabled=false")
          if any("ueba" in str(d["metadata"].get("name", "")) for d in off):
              sys.exit("ueba.enabled=false still renders UEBA objects")
          on = render("--set", "ueba.enabled=true")
          if not any("ueba" in str(d["metadata"].get("name", "")) for d in on):
              sys.exit("ueba.enabled=true renders no UEBA objects")

          print("OK: brokers wired to every deployment, quorum complete, replication survivable, "
                "and the UEBA switch is connected.")
          PY

      # The egress policy is the network half of "runs entirely on your
      # infrastructure". Asserting it renders is not the same as asserting it
      # is correct, so check the two properties that make it worth having.
      - name: The egress policy denies by default and excludes metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(open("/tmp/full.yaml")) if d]
          policies = [d for d in docs if d.get("kind") == "NetworkPolicy"]
          if not policies:
              sys.exit("no NetworkPolicy rendered with networkPolicy.enabled=true")
          policy = policies[0]

          if policy["spec"].get("policyTypes") != ["Egress"]:
              sys.exit("policy does not declare Egress; an empty egress list would not deny")

          blocks = [
              block
              for rule in policy["spec"]["egress"]
              for dest in rule.get("to", [])
              if (block := dest.get("ipBlock"))
          ]
          if not blocks:
              sys.exit("no ipBlock rendered from allowedEgressCIDRs")
          for block in blocks:
              if "169.254.169.254/32" not in block.get("except", []):
                  sys.exit(f"cidr {block['cidr']} does not exclude the metadata service")

          # Default render must NOT emit one — it is opt-in because a CNI that
          # does not enforce NetworkPolicy ignores it silently, and a control
          # that is silently ignored reads as protection while providing none.
          default = [d for d in yaml.safe_load_all(open("/tmp/default.yaml")) if d]
          if any(d.get("kind") == "NetworkPolicy" for d in default):
              sys.exit("NetworkPolicy rendered by default; it must stay opt-in")

          print("OK: egress policy denies by default, excludes metadata, and is opt-in")
          PY

  install:
    name: Helm — install into a real cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.18.5

      - name: Start a kind cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: aisoc-helm

      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm dependency build infra/helm/aisoc

      # --dry-run=server is the honest bar for a CI runner. The images are not
      # published for every PR and the datastores would not fit anyway, so a
      # full rollout would test the runner's disk rather than the chart. What
      # this does test is the thing that was never tested: that the API server
      # accepts every object the chart produces — admission, defaulting, RBAC
      # and schema — which `helm template` alone cannot tell you.
      - name: Install (server dry-run)
        run: |
          helm install aisoc infra/helm/aisoc \
            --dry-run=server \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.allowedEgressCIDRs={10.0.0.0/8}' \
            > /dev/null
          echo "OK: the API server accepted every object in the chart."

  # ── The chart's own version ───────────────────────────────────────────────
  #
  # `appVersion` was gated from the day check_published_images.py landed;
  # `version` was read by nothing. v13.0.0 bumped the first and left the
  # second at 5.9.2, so `helm push` republished a version v12.3.2 had already
  # published, and `charts/aisoc:5.9.2` now names a different application than
  # it did in September. The bytes are not recoverable.
  #
  # Separate from `render` because it answers a different question and needs a
  # different checkout: identity rather than validity, and the whole history
  # rather than one commit. Deliberately *not* a required context — this
  # workflow is path-filtered to `infra/helm/**`, and a required check that
  # never reports blocks every pull request that does not touch the chart.
  version:
    name: Helm — the chart's version names one chart only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and the fork point. The gate reads what every release
          # declared and compares this tree against where it branched; a
          # depth-1 checkout has neither and the gate refuses rather than
          # reporting a clean verdict about a history it could not see.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyyaml

      - name: The gate still detects what it claims to
        run: python3 scripts/check_chart_version.py --self-test

      # No `--require-network` here, matching check_published_images.py: a
      # contributor on a train should not be told the chart is wrong because
      # GHCR was unreachable. The check that catches the v13.0.0 defect reads
      # git alone and runs either way; only the registry comparison skips, and
      # it says so. The release job below does require the network, because an
      # unanswered registry at the moment of a push is the whole question.
      - name: The chart's version has not been reused for different content
        run: python3 scripts/check_chart_version.py --check
