name: Upgrade test

# Upgrade the previous minor to this tree, with data already in the database.
#
# A fresh install applies every migration to an empty schema, which is the one
# case that cannot go wrong. The defects that reach operators are the other
# ones: an `ALTER TABLE ... ADD COLUMN ... NOT NULL` with no default against a
# populated table, a unique index added over rows that already violate it, a
# backfill that assumes a column it is about to create, a type change that
# succeeds on zero rows and fails on a million. None of those is visible
# without data present.
#
# How it works, and why it uses the published image
# -------------------------------------------------
# The migration runner lives in `services/api` and needs that service's
# dependencies. Rather than reconstruct them, this runs the *published*
# previous-minor image twice:
#
#   1. with its own `/app/migrations`, producing the schema an operator on the
#      previous release actually has;
#   2. with this tree's `services/api/migrations` bind-mounted over
#      `/app/migrations`, which is the upgrade.
#
# The same runner applies both legs, so what is being tested is the migration
# chain rather than a re-implementation of how it is applied. The limit is
# stated rather than hidden: a migration that needs a *newer runner* than the
# previous release shipped is not covered here, and would show up as a failure
# in the second leg rather than as a silent pass.

# Deliberately NOT path-filtered, at the workflow level or anywhere else.
#
# It was filtered on both triggers, and that is exactly what kept `Previous
# minor to this tree, with data present` out of `.github/required-checks.json`:
# a workflow that does not trigger creates no check run, and a required check
# that never reports blocks the pull request forever. Measured over the 18 most
# recently merged pull requests before this changed, reading every page of
# `commits/{sha}/check-runs` (113-143 checks each, so the usual one-page cap
# was not the cause): the context was absent from **18 of 18**, and none of the
# 18 had touched a filtered path. Requiring it in that shape would have
# deadlocked the queue on the first pull request that did not edit a migration.
#
# `integration.yml` solved the same problem by moving the condition into the
# jobs, which is the right shape for a 15-minute disaster-recovery rehearsal.
# This workflow does not need it. Execution is 1-3 minutes measured over its
# own recent runs (the hour-long ones are queue time on a saturated pool, not
# work), so there is no filter at all here and therefore no expression that can
# switch the assertions off. The job cannot report success having done nothing
# because there is no path through it that does nothing -- which is a structural
# property a reader can check in one pass, rather than a behaviour someone has
# to go and measure. `.github/required-checks.json` records what the other
# answer cost: the disaster-recovery gate rehearsed nothing on 74 of 100 runs
# while reporting the same green tick.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede a pull request's own earlier runs; never supersede a push.
  # Only a branch's head commit needs grading, but every commit that lands
  # on a protected branch must be graded — and `cancel-in-progress: false`
  # alone does not achieve that, because a run left *pending* in a busy
  # group is cancelled when the next one queues. Gate:
  # scripts/check_workflow_concurrency.py
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  upgrade:
    name: Previous minor to this tree, with data present
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start PostgreSQL with registry fallback
        uses: ./.github/actions/start-postgres
        with:
          password: aisoc_dev_secret

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Which release are we upgrading from?
        id: from
        run: |
          set -euo pipefail
          previous="$(python3 scripts/check_release_policy.py --previous-minor)"
          echo "Upgrading from v${previous} to the migration chain in this tree."
          echo "version=v${previous}" >> "$GITHUB_OUTPUT"

      - name: Install a psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # `check_runtime_db_role.py --dsn` connects with asyncpg. Without it the
      # check refuses rather than reporting a pass it did not earn, which is
      # the right behaviour and is how this was found — so install it here
      # rather than letting the job discover it three minutes in.
      - name: Install the driver the role check connects with
        run: python3 -m pip install --quiet "asyncpg>=0.29,<0.31"

      # Leg one: the schema an operator on the previous release has.
      - name: Apply the previous release's migration chain
        env:
          IMAGE: ghcr.io/beenuar/aisoc-core-api:${{ steps.from.outputs.version }}
        run: |
          set -euo pipefail
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          MIGRATION_DSN='postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc'
          docker run --rm --network host \
            -e DATABASE_MIGRATION_URL="$MIGRATION_DSN" \
            -e DATABASE_URL='postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc' \
            -e AISOC_APP_DB_PASSWORD='aisoc_app_dev_secret' \
            "$IMAGE" python -m app.scripts.run_migrations
          echo "Applied at the previous release:"
          psql "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -tAc \
            "select count(*) from aisoc_schema_migrations"

      # The whole point. An empty database cannot exercise a backfill, a NOT
      # NULL addition, or a unique index over existing rows.
      - name: Seed data that the upgrade has to survive
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" \
            -f scripts/upgrade_fixture.sql

      - name: Record what is there before the upgrade
        run: |
          set -euo pipefail
          # Which case table the previous release has depends on which release
          # it is: 083 renames `cases` and consolidates into `aisoc_cases`, so a
          # pinned name is right on exactly one side of that boundary. Resolve
          # it -- the count is what this snapshot is for, not the name.
          DSN="postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc"
          CASES=$(psql -v ON_ERROR_STOP=1 -tA "$DSN" -c \
            "select coalesce(to_regclass('public.aisoc_cases')::text, to_regclass('public.cases')::text, '')")
          if [ -z "$CASES" ]; then
            echo "::error::the previous release has neither \`aisoc_cases\` nor \`cases\`" >&2
            exit 1
          fi
          echo "previous release holds its cases in: $CASES"
          psql -v ON_ERROR_STOP=1 -tA "$DSN" \
            -c "\copy (select 'alerts', count(*) from alerts union all select 'cases', count(*) from ${CASES} union all select 'tenants', count(*) from tenants union all select 'users', count(*) from users order by 1) to '/tmp/before.tsv'"
          cat /tmp/before.tsv

      # Leg two: this tree's chain, applied by the release's own runner.
      - name: Apply this tree's migration chain over the populated schema
        env:
          IMAGE: ghcr.io/beenuar/aisoc-core-api:${{ steps.from.outputs.version }}
        run: |
          set -euo pipefail
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          MIGRATION_DSN='postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc'
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/services/api/migrations:/app/migrations:ro" \
            -e DATABASE_MIGRATION_URL="$MIGRATION_DSN" \
            -e DATABASE_URL='postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc' \
            -e AISOC_APP_DB_PASSWORD='aisoc_app_dev_secret' \
            "$IMAGE" python -m app.scripts.run_migrations

      - name: Every migration in this tree is recorded as applied
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, sys

          dsn = "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc"
          applied = set(subprocess.run(
              ["psql", "-tA", dsn, "-c", "select name from aisoc_schema_migrations"],
              capture_output=True, text=True, check=True,
          ).stdout.split())
          on_disk = {p.name for p in pathlib.Path("services/api/migrations").glob("*.sql")}
          if not on_disk:
              sys.exit("no migrations found on disk; this check would pass over an absence")
          missing = sorted(on_disk - applied)
          if missing:
              sys.exit(f"{len(missing)} migration(s) in this tree were not applied by the upgrade: {missing}")
          print(f"OK: all {len(on_disk)} migrations applied, {len(applied)} rows in aisoc_schema_migrations.")
          PY

      # The row counts that were there before must still be there, and the
      # rows themselves must still be readable. A migration that drops and
      # recreates a table passes a count check on an empty database and
      # destroys a customer's alert history on a real one.
      - name: The data survived
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" \
            -c "\copy (select 'alerts', count(*) from alerts union all select 'cases', count(*) from aisoc_cases union all select 'tenants', count(*) from tenants union all select 'users', count(*) from users order by 1) to '/tmp/after.tsv'"
          echo "before:"; cat /tmp/before.tsv
          echo "after:";  cat /tmp/after.tsv
          diff /tmp/before.tsv /tmp/after.tsv || {
            echo "::error::row counts changed across the upgrade"
            exit 1
          }
          # Named rows, not just counts: a table recreated with the same
          # number of fabricated rows would pass the diff above.
          psql -v ON_ERROR_STOP=1 -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c \
            "select title from alerts where id = '11111111-1111-1111-1111-111111111111'" | grep -q 'pre-upgrade alert'
          # Read from `aisoc_cases`, not `cases`. Migration 083
          # consolidated the two case tables that had never synchronised
          # and renamed the old one to `cases_pre_consolidation`; the row
          # moved, which is what this check is for. Following the data is
          # the point — asserting the old table name would be asserting
          # that the consolidation did not happen.
          psql -v ON_ERROR_STOP=1 -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c \
            "select title from aisoc_cases where id = '22222222-2222-2222-2222-222222222222'" | grep -q 'pre-upgrade case'
          # And the archive still holds what it held, so a consolidation
          # that lost a row is detectable after the fact.
            # `cases_pre_consolidation` only exists when 083 ran during *this*
            # upgrade. Once the previous release is itself 16.x the rename
            # happened before this test started, so its absence is then the
            # correct state and not a regression. Assert on it only when it is
            # there, and say out loud which case was taken, because "the check
            # silently did nothing" is the failure mode this whole workflow is
            # about.
            if [ -n "$(psql -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c "select to_regclass('public.cases_pre_consolidation')")" ]; then
              psql -v ON_ERROR_STOP=1 -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c \
                "select count(*) from cases_pre_consolidation" >/dev/null
              echo "083 ran during this upgrade; the pre-consolidation archive is intact."
            else
              echo "the previous release already carried the consolidation; no archive expected."
            fi
          echo "OK: the rows that were there before the upgrade are still there, by id."

      # The runtime role is what every service connects as, and a migration
      # that creates a table without granting it is a table the application
      # cannot read. That failure surfaces as a 500 after deploy, not here,
      # unless it is checked here.
      - name: The runtime role can still read what it owns nothing of
        run: |
          set -euo pipefail
          python3 scripts/check_runtime_db_role.py \
            --dsn "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc"
          psql -v ON_ERROR_STOP=1 -tA \
            "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" \
            -c "select count(*) from alerts"

      - name: Re-applying the chain is a no-op
        env:
          IMAGE: ghcr.io/beenuar/aisoc-core-api:${{ steps.from.outputs.version }}
        run: |
          set -euo pipefail
          before=$(psql -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c "select count(*) from aisoc_schema_migrations")
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          MIGRATION_DSN='postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc'
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}/services/api/migrations:/app/migrations:ro" \
            -e DATABASE_MIGRATION_URL="$MIGRATION_DSN" \
            -e DATABASE_URL='postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc' \
            -e AISOC_APP_DB_PASSWORD='aisoc_app_dev_secret' \
            "$IMAGE" python -m app.scripts.run_migrations
          after=$(psql -tA "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc" -c "select count(*) from aisoc_schema_migrations")
          test "$before" = "$after" || {
            echo "::error::a second run applied $((after - before)) more migration(s); the chain is not idempotent"
            exit 1
          }
          echo "OK: a second run applied nothing."

  # ── Across a major boundary ───────────────────────────────────────────────
  # Nothing in this repository had ever upgraded across a major version.
  #
  # The job above resolves its starting point with `--previous-minor`, which is
  # 22.1.0 today: same major, every time, by construction. `integration.yml`
  # pins v7.3.1 and v7.5.0, which are also same-major and additionally seed a
  # throwaway `upgrade_probe` table — so what that leg proves is that a
  # migration did not drop an unrelated table, which is a weaker claim than it
  # reads as. Meanwhile `apps/docs/docs/operations/upgrades.md` tells operators
  # that crossing more than one major "is supported but untested as a single
  # step", and that was literally true.
  #
  # Two boundaries, chosen for different reasons rather than for coverage:
  #
  #   v21.0.0  the most recent major boundary, and the one a supported operator
  #            crosses today -- SUPPORT.md backports fixes to the previous major
  #            for 90 days, so v21 deployments are in-support and expected to
  #            arrive here. It is also the only boundary a *new* migration can
  #            still break: everything below it is frozen history.
  #
  #   v17.0.0  five majors in one step, which is the case the documentation
  #            admits is untested. v17 is the oldest release whose schema this
  #            fixture can seed unmodified -- migration 083 (`cases` ->
  #            `aisoc_cases`) landed in v16.0.0, so v17 is the first release on
  #            the far side of the rename.
  #
  # Better than either existing leg in the two ways that matter. It seeds the
  # real tables (`tenants`, `users`, `alerts` at every severity, `aisoc_cases`)
  # from the same fixture the job above uses, and it applies this tree's chain
  # with **this tree's runner** rather than the released image's. The job above
  # deliberately uses the old release's runner -- stated at the top of this file
  # -- which means a migration needing a newer runner than the previous release
  # shipped is invisible to it. Here the runner under test is the one in the
  # pull request, so that gap is covered from the other side.
  #
  # Unconditional for the same reason as the job above: no filter, so no
  # expression can switch it off. It is not in `.github/required-checks.json`
  # -- a matrix job's context name contains the matrix value, so adding a
  # starting version would silently orphan a required context that can then
  # never report. The stable single-name job above carries the requirement.
  cross-major:
    name: Cross-major upgrade (${{ matrix.from_version }} → this tree)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        from_version: ['v21.0.0', 'v17.0.0']
    env:
      # The runtime role, which is what every assertion below reads as. The
      # owner DSN is deliberately NOT declared here: it is needed by exactly
      # two steps, both of which carry it inline under an `aisoc-db-role`
      # marker, and a job-wide owner credential is the shape
      # `scripts/check_runtime_db_role.py` exists to refuse.
      APP_DSN: postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start PostgreSQL with registry fallback
        uses: ./.github/actions/start-postgres
        with:
          password: aisoc_dev_secret
          tag: "16"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install a psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # This tree's runner, not the released image's. `run_migrations` imports
      # `app.core.config`, so this is the settings surface plus asyncpg --
      # the same importable subset `integration.yml` installs for its
      # migrations job, kept in step with it deliberately.
      - name: Install this tree's migration runner
        run: >-
          python3 -m pip install --quiet
          "fastapi>=0.117,<0.162" "pydantic[email]" pydantic-settings
          "sqlalchemy[asyncio]" "asyncpg>=0.29,<0.31" structlog "PyJWT>=2.8,<3"
          "cryptography>=46,<51" "passlib[bcrypt]" tenacity pyyaml
          prometheus-client "opentelemetry-sdk" "opentelemetry-api"
          "opentelemetry-exporter-otlp-proto-grpc"
          "opentelemetry-instrumentation-fastapi"
          "strawberry-graphql[fastapi]" neo4j redis celery httpx aiofiles
          email-validator "sqlglot>=30,<31" aiosqlite "croniter>=2.0,<7.0"

      # Leg one: the released image applies its own chain, so the starting
      # point is the schema an operator on that major actually has -- produced
      # by the runner that release shipped, not by a replay of its SQL.
      - name: Build the ${{ matrix.from_version }} schema with that release's own runner
        env:
          IMAGE: ghcr.io/beenuar/aisoc-core-api:${{ matrix.from_version }}
        run: |
          set -euo pipefail
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          docker run --rm --network host \
            -e DATABASE_MIGRATION_URL='postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc' \
            -e DATABASE_URL='postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc' \
            -e AISOC_APP_DB_PASSWORD='aisoc_app_dev_secret' \
            "$IMAGE" python -m app.scripts.run_migrations
          FROM_COUNT=$(psql -tA "$APP_DSN" -c "select count(*) from aisoc_schema_migrations")
          echo "${{ matrix.from_version }} applied ${FROM_COUNT} migration(s)."
          # A released chain that applied nothing would make every assertion
          # below vacuous, so refuse that rather than measuring it.
          [ "${FROM_COUNT}" -gt 0 ] \
            || { echo "::error::${{ matrix.from_version }} applied no migrations; there is no starting schema to upgrade"; exit 1; }

      # Real AiSOC tables, from the same fixture the previous-minor job uses:
      # one tenant, one user, one alert at each of the five severities, one
      # case. Seeded as the runtime role, because seeding as the owner bypasses
      # row-level security and is the exact workaround that has hidden defects
      # in this tree before.
      - name: Seed the real tables the upgrade has to carry
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 "$APP_DSN" -f scripts/upgrade_fixture.sql

      - name: Record what is there before the upgrade
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c \
            "\copy (select 'alerts', count(*) from alerts union all select 'aisoc_cases', count(*) from aisoc_cases union all select 'tenants', count(*) from tenants union all select 'users', count(*) from users order by 1) to '/tmp/before.tsv'"
          cat /tmp/before.tsv

      # Leg two: this tree's chain, applied by THIS TREE's runner.
      - name: Upgrade to this tree, with this tree's runner
        env:
          # The runtime DSN. The runner reads it to provision the login this
          # job's later assertions connect as; it applies no DDL through it.
          DATABASE_URL: postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc
          AISOC_APP_DB_PASSWORD: aisoc_app_dev_secret
          SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
          ENVIRONMENT: development
          AISOC_MIGRATIONS_STRICT: '1'
          # Declared last so the marker below attaches to this DSN and only
          # this one — it covers the lines that follow it, and sitting above
          # the block it claimed the runtime DSN too, which reads as "the app
          # role needs DDL" and is the opposite of true.
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          DATABASE_MIGRATION_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc
        run: |
          set -euo pipefail
          ( cd services/api && python3 -m app.scripts.run_migrations )

      - name: Every migration in this tree is recorded as applied
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess, sys

          dsn = "postgresql://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc"
          applied = set(subprocess.run(
              ["psql", "-tA", dsn, "-c", "select name from aisoc_schema_migrations"],
              capture_output=True, text=True, check=True,
          ).stdout.split())
          on_disk = {p.name for p in pathlib.Path("services/api/migrations").glob("*.sql")}
          if not on_disk:
              sys.exit("no migrations found on disk; this check would pass over an absence")
          missing = sorted(on_disk - applied)
          if missing:
              sys.exit(f"{len(missing)} migration(s) did not apply across the major boundary: {missing}")
          print(f"OK: all {len(on_disk)} migrations applied, {len(applied)} rows in aisoc_schema_migrations.")
          PY

      - name: The data survived the major boundary
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c \
            "\copy (select 'alerts', count(*) from alerts union all select 'aisoc_cases', count(*) from aisoc_cases union all select 'tenants', count(*) from tenants union all select 'users', count(*) from users order by 1) to '/tmp/after.tsv'"
          echo "before:"; cat /tmp/before.tsv
          echo "after:";  cat /tmp/after.tsv
          diff /tmp/before.tsv /tmp/after.tsv || {
            echo "::error::row counts changed across the ${{ matrix.from_version }} → this tree upgrade"
            exit 1
          }
          # By id, not by count: a table dropped and repopulated with the same
          # number of fabricated rows passes the diff above.
          psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c \
            "select title from alerts where id = '11111111-1111-1111-1111-111111111111'" | grep -q 'pre-upgrade alert'
          psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c \
            "select title from aisoc_cases where id = '22222222-2222-2222-2222-222222222222'" | grep -q 'pre-upgrade case'
          # Every severity still present. A migration rewriting the ladder or
          # adding a constraint to it meets all five here, not one.
          SEVERITIES=$(psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c \
            "select count(distinct severity) from alerts where tenant_id = '00000000-0000-0000-0000-0000000000aa'")
          [ "${SEVERITIES}" = "5" ] \
            || { echo "::error::only ${SEVERITIES}/5 severities survived the upgrade"; exit 1; }
          echo "OK: rows readable by id and all five severities intact after crossing a major."

      - name: The runtime role can still read across the boundary
        run: |
          set -euo pipefail
          python3 scripts/check_runtime_db_role.py --dsn "$APP_DSN"
          psql -v ON_ERROR_STOP=1 -tA "$APP_DSN" -c "select count(*) from alerts"

      - name: Re-applying this tree's chain is a no-op
        env:
          # The runtime DSN. The runner reads it to provision the login this
          # job's later assertions connect as; it applies no DDL through it.
          DATABASE_URL: postgresql+asyncpg://aisoc_app:aisoc_app_dev_secret@127.0.0.1:5432/aisoc
          AISOC_APP_DB_PASSWORD: aisoc_app_dev_secret
          SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
          ENVIRONMENT: development
          AISOC_MIGRATIONS_STRICT: '1'
          # Declared last so the marker below attaches to this DSN and only
          # this one — it covers the lines that follow it, and sitting above
          # the block it claimed the runtime DSN too, which reads as "the app
          # role needs DDL" and is the opposite of true.
          # aisoc-db-role: owner - the migration chain is DDL and the runtime role holds no DDL grant.
          DATABASE_MIGRATION_URL: postgresql+asyncpg://aisoc:aisoc_dev_secret@127.0.0.1:5432/aisoc
        run: |
          set -euo pipefail
          before=$(psql -tA "$APP_DSN" -c "select count(*) from aisoc_schema_migrations")
          ( cd services/api && python3 -m app.scripts.run_migrations )
          after=$(psql -tA "$APP_DSN" -c "select count(*) from aisoc_schema_migrations")
          test "$before" = "$after" || {
            echo "::error::a second run applied $((after - before)) more migration(s); the chain is not idempotent"
            exit 1
          }
          echo "OK: a second run applied nothing."
