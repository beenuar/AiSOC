name: Chaos

# Gap-closure wave 5.
#
# `scripts/chaos/fusion_restart.py` grades exactly-once event delivery
# against real Postgres and is good. CI ran **only its self-test**, and
# the live harness had been executed once, by hand. A harness nobody
# triggers is a harness that rots: the thing it grades drifts, and the
# first anyone finds out is during an incident.
#
# Three things run here that did not run anywhere before:
#
#   1. The event harness, live, against a real stack rather than its
#      own self-test.
#   2. Actions. Only events were covered, and the failure modes are not
#      comparable — a lost event is a gap in a timeline, a lost action
#      is a host that was never isolated while the console says it was.
#   3. Store outages. Only Postgres and fusion were exercised; the
#      platform also depends on ClickHouse, Neo4j, Qdrant, Redis and
#      Kafka, and each has a *different* correct answer when it goes
#      away.
#
# Scheduled plus dispatchable rather than per-PR: it takes a stack up
# and tears it down repeatedly, and a job that slow on every pull
# request gets disabled within a month.

on:
  schedule:
    # Mondays 04:00 UTC, ahead of the week rather than after it.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      stores:
        description: "Comma-separated stores to take down, or 'all'"
        required: false
        default: "all"
  pull_request:
    # On a PR only when the harness itself changes, so a change to the
    # grader is graded by the grader.
    paths:
      - "scripts/chaos/**"
      - ".github/workflows/chaos.yml"

permissions:
  contents: read

concurrency:
  # Per commit on push, per pull request otherwise. Keying on the ref
  # alone lets a push cancel the run before it, which across this
  # repository lost 259 runs of 1,000.
  group: chaos-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  graders:
    # Unconditional and fast. These prove the three graders separate
    # the outcomes they claim to, with no stack at all — so a broken
    # grader is caught even when the live legs below cannot run.
    name: Chaos graders self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Event exactly-once grader
        run: python3 scripts/chaos/fusion_restart.py --self-test

      - name: Action exactly-once grader
        # A duplicate action is worse than a delay and both are worse
        # than a refusal, so the grader has to tell three outcomes
        # apart rather than pass/fail.
        run: python3 scripts/chaos/action_exactly_once.py --self-test

      - name: Store outage grader
        # The question is not "does it crash" — crashing is fine. It is
        # whether readiness admits the dependency is gone, which is the
        # failure UEBA shipped: consumer detached, container `running`,
        # `/health` 200, permanently.
        run: python3 scripts/chaos/store_outage.py --self-test

  store-outages:
    name: Store outages (live containers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: graders
    # Never on a pull request: this stops and starts containers
    # repeatedly and would make the PR queue unusable.
    if: github.event_name != 'pull_request'
    strategy:
      # One store's result must not cancel the others — the interesting
      # output is which of the six behave and which do not.
      #
      # Each leg names the readiness surface that OWNS the store and the
      # dependents the expectation declares (#1446). The previous shape
      # probed one API URL for all six stores and two fixed dependents, and
      # every one of its findings was an artifact of that contract rather
      # than a fact about a service: `/api/v1/health/ready` did not exist
      # (404 → every key "reads None"), `/api/v1/health` did not exist
      # either (404 → "api stopped serving" on every leg), the `ingest`
      # URL pointed at the *enrichment* service's host port (8080; ingest
      # publishes 8081), and the recovery poll re-read the same 404
      # forever ("never reconnected"). clickhouse and neo4j are behind
      # `--profile full`, so those legs graded a container that was never
      # started and exited 2 blaming Docker.
      #
      # Dependent URLs point at readiness-class endpoints: a 503 there
      # means "alive but cannot do my job", which `_responding` counts as
      # not serving — the required outcome for a block store's dependents.
      #
      # Every URL below now names the endpoint that actually carries the
      # store's key. It previously named `/health` for fusion, ingest,
      # agents and actions, and none of those four reports a dependency
      # there: `register_dependency` writes to `/readyz` only, fusion's
      # `/health` is a static `{"status": "healthy"}` from
      # `app/api/router.py`, and ingest's is `Handler.Health`, which
      # deliberately checks nothing so a restart loop stays
      # distinguishable from a dependency outage. So four legs read a key
      # that the endpoint they asked was never going to mention, and
      # reported "readiness does not say so" about services that do say
      # so, one route over. The two legs that passed are exactly the two
      # already pointing somewhere the key exists.
      #
      # Conflating liveness and readiness on one route would be the other
      # way to close that gap, and it is the anti-pattern `app/_health.py`
      # and `Handler.Readyz` are both written against — a service that
      # fails `/health` because a dependency is gone gets restarted in a
      # loop instead of taken out of rotation.
      #
      # qdrant is the one leg that still reads `/health`, and deliberately:
      # threatintel declares `vector_store` on a hand-written `/health`
      # rather than through `register_dependency`, so `/readyz` does not
      # carry it. Worth making uniform one day; pointing this leg at
      # `/readyz` today would simply lose the key.
      #
      # realtime answers `/health`, `/healthz` and `/readyz` from one
      # handler; it is spelled `/readyz` here so the sentence above is true
      # of every row.
      fail-fast: false
      matrix:
        include:
          - store: postgres
            profile: core
            readiness_url: http://127.0.0.1:8000/api/v1/health/ready
            dependent_urls: >-
              api=http://127.0.0.1:8000/api/v1/health/ready
              fusion=http://127.0.0.1:8003/readyz
              agents=http://127.0.0.1:8001/readyz
              actions=http://127.0.0.1:8002/readyz
          - store: redis
            profile: core
            readiness_url: http://127.0.0.1:8000/api/v1/health/ready
            dependent_urls: >-
              api=http://127.0.0.1:8000/api/v1/health/ready
              agents=http://127.0.0.1:8001/readyz
          - store: qdrant
            profile: core
            readiness_url: http://127.0.0.1:8005/health
            dependent_urls: >-
              threatintel=http://127.0.0.1:8005/health
          - store: kafka
            profile: core
            readiness_url: http://127.0.0.1:8081/readyz
            dependent_urls: >-
              ingest=http://127.0.0.1:8081/readyz
              fusion=http://127.0.0.1:8003/readyz
              realtime=http://127.0.0.1:8086/readyz
          - store: clickhouse
            profile: full
            readiness_url: http://127.0.0.1:8003/readyz
            dependent_urls: >-
              fusion=http://127.0.0.1:8003/readyz
              api=http://127.0.0.1:8000/api/v1/health/ready
          - store: neo4j
            profile: full
            readiness_url: http://127.0.0.1:8081/readyz
            dependent_urls: >-
              ingest=http://127.0.0.1:8081/readyz
              api=http://127.0.0.1:8000/api/v1/health/ready
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate the secrets the stack refuses to start without
        # `make up` runs this; a workflow that calls `docker compose up`
        # directly does not, and then provisions an environment with
        # every generated secret empty. ingest refuses to start without
        # JWT_SECRET and the API without METRICS_TOKEN, so the outage
        # below would grade a stack that never came up — which is the
        # vacuous pass this whole programme is about.
        run: python3 scripts/ensure_env.py

      - name: Bring the stack up
        id: boot
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # The full profile is how clickhouse and neo4j exist at all: they
          # are `--profile full` services, and the flags are what turn the
          # lake writer and graph writer on in fusion and ingest. Grading a
          # full-profile store on the core stack stops a container that was
          # never started.
          if [ "$PROFILE" = "full" ]; then
            AISOC_LAKE_WRITER_ENABLED=true AISOC_GRAPH_ENABLED=true \
              docker compose --profile full up -d --wait --wait-timeout 300 || {
                echo "::error::the stack did not come up; the outage below would grade nothing"
                docker compose --profile full ps
                exit 1
              }
          else
            docker compose up -d --wait --wait-timeout 300 || {
              echo "::error::the stack did not come up; the outage below would grade nothing"
              docker compose ps
              exit 1
            }
          fi

      - name: Take ${{ matrix.store }} down and grade what the services say
        env:
          STORE: ${{ matrix.store }}
          READINESS_URL: ${{ matrix.readiness_url }}
          DEPENDENT_URLS: ${{ matrix.dependent_urls }}
        run: |
          set -euo pipefail
          args=(--store "$STORE" --readiness-url "$READINESS_URL")
          for pair in $DEPENDENT_URLS; do
            args+=(--dependent-url "$pair")
          done
          python3 scripts/chaos/store_outage.py "${args[@]}"

      - name: Logs, on failure
        if: failure()
        run: docker compose logs --tail 200

  # `fusion_restart.py` is the grader behind the claim "a fusion replica can be
  # destroyed mid-stream and every accepted event still becomes exactly one
  # alert row". Until this job existed the workflow ran only its `--self-test`,
  # which exercises the grading arithmetic against fixtures and proves nothing
  # about fusion -- the live run had happened once, by hand, which is a
  # measurement with no expiry and no witness.
  #
  # Scheduled rather than per-PR for the same reason the store outages are:
  # it boots the spine, pushes thousands of events and kills a container
  # mid-stream, which is minutes, not seconds.
  #
  # `integration.yml`'s kill test is not a substitute: it posts a single event
  # while fusion is down and checks only for loss. One event cannot show a
  # duplicate, and duplicates are the half that an at-least-once consumer gets
  # wrong.
  fusion-restart:
    name: Kill fusion mid-stream (live)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build the producer
        run: go build -o /tmp/demo-producer .
        working-directory: services/demo-producer

      - name: Bring up the spine
        run: |
          set -euo pipefail
          python3 scripts/ensure_env.py
          docker compose up -d postgres redis zookeeper kafka ingest-worker fusion api
          for _ in $(seq 1 60); do
            if docker compose ps --format '{{.Name}} {{.Health}}' | grep -q 'aisoc-api healthy'; then break; fi
            sleep 10
          done
          docker compose ps

      - name: Mint an ingest credential
        id: token
        run: |
          set -euo pipefail
          token="$(docker compose run --rm -T api python -m app.scripts.mint_ingest_token --quiet | tail -1 | tr -d '\r')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Destroy fusion mid-stream and grade loss *and* duplicates
        env:
          AISOC_INGEST_TOKEN: ${{ steps.token.outputs.token }}
          AISOC_PRODUCER_BIN: /tmp/demo-producer
        run: |
          set -euo pipefail
          python3 scripts/chaos/fusion_restart.py \
            --target compose \
            --events 3000 --target-eps 60 --workers 4 --batch 25 \
            --kill-at 0.5 \
            --drain-timeout 420 \
            --out /tmp/fusion-restart.json

      - name: Publish the verdict
        if: always()
        run: |
          {
            echo "## Fusion destroyed mid-stream"
            echo ""
            echo '```json'
            cat /tmp/fusion-restart.json 2>/dev/null || echo '{"note": "the grader produced no report"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs, on failure
        if: failure()
        run: docker compose logs --tail 200 fusion ingest-worker kafka || true

