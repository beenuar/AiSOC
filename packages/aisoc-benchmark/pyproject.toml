[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisoc-benchmark"
version = "0.1.0"
description = "Grade any SOC agent on a common corpus: accuracy, hallucination rate, containment, calibration and cost."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29"]

[project.scripts]
aisoc-benchmark = "aisoc_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aisoc_benchmark"]

[tool.hatch.build.targets.sdist]
include = ["aisoc_benchmark", "corpus", "README.md"]
