<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for aisoc-social-card.png (the Open Graph / Twitter card image).

  The PNG that sat here before was a 277-byte SVG with a .png extension, so
  every crawler that fetched it was handed image/png with an SVG payload and
  failed to decode it  a link to the repo or the docs rendered with no image
  at all. Keep this file and the PNG in step; regenerate with:

      magick -background none apps/docs/static/img/aisoc-social-card.svg \
             -resize 1200x630 apps/docs/static/img/aisoc-social-card.png

  Deliberately carries no counts or metrics. A card is cached by crawlers for
  a long time and cannot be regenerated by a gate, so any number baked into it
  would be a stale claim on a surface nobody re-reads.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="630" fill="#2563eb"/>

  <!-- wordmark -->
  <text x="88" y="214" font-family="Helvetica, Arial, sans-serif" font-size="104"
        font-weight="bold" fill="#ffffff" letter-spacing="-2">AiSOC</text>

  <!-- what it is -->
  <text x="92" y="286" font-family="Helvetica, Arial, sans-serif" font-size="40"
        fill="#93b4f5">Open-source AI Security Operations Center</text>

  <!-- what it does -->
  <text x="92" y="366" font-family="Helvetica, Arial, sans-serif" font-size="29"
        fill="#c3cede">Alert fusion, agent triage, and a replayable</text>
  <text x="92" y="408" font-family="Helvetica, Arial, sans-serif" font-size="29"
        fill="#c3cede">investigation ledger for every decision.</text>

  <!-- rule -->
  <rect x="92" y="470" width="1016" height="1" fill="#26344d"/>

  <!-- footer -->
  <text x="92" y="524" font-family="Helvetica, Arial, sans-serif" font-size="25"
        fill="#8fa0bb">MIT licensed &#183; self-hostable</text>
  <text x="1108" y="524" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="25" fill="#8fa0bb">github.com/beenuar/AiSOC</text>
</svg>
