<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for aisoc-github-social-preview.png, the repository's GitHub social
  preview (Settings -> General -> Social preview).

  1280x640 rather than the 1200x630 of aisoc-social-card.png: GitHub states
  1280x640 for this field and renders it in link unfurls at a fraction of
  that size, so the two cards are deliberately separate files and this one
  carries less text at a larger size.

  Regenerate by screenshotting this file in a headless browser at its exact
  pixel size, which is also how a crawler will rasterise it:

      chrome --headless --window-size=1280,640 \
        --default-background-color=00000000 \
        --screenshot=apps/docs/static/img/aisoc-github-social-preview.png \
        apps/docs/static/img/aisoc-github-social-preview.svg

  Not `magick`, deliberately. ImageMagick renders this file's text only when
  it was built with a Freetype or ghostscript delegate; without one it prints
  "non-conforming drawing primitive definition `text'" and writes a card with
  every word missing. The sibling aisoc-social-card.svg still documents the
  `magick` form and is subject to the same trap.

  Deliberately carries no counts, metrics, logos or names other than this
  project's own. A card is cached by crawlers for a long time and cannot be
  regenerated by a gate, so any number baked into it would become a stale
  claim on a surface nobody re-reads. Every capability named here is one the
  tree implements: fusion is services/fusion, agent triage is
  services/agents, and the decision ledger is what aisoc_replay_decision
  reads back.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="12" height="640" fill="#2563eb"/>

  <!-- logo mark, matching img/logo.svg -->
  <rect x="100" y="128" width="104" height="104" rx="16" fill="#2563eb"/>
  <text x="152" y="203" font-family="Helvetica, Arial, sans-serif" font-size="64"
        font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>

  <!-- wordmark -->
  <text x="236" y="212" font-family="Helvetica, Arial, sans-serif" font-size="112"
        font-weight="bold" fill="#ffffff" letter-spacing="-2">AiSOC</text>

  <!-- value proposition -->
  <text x="104" y="348" font-family="Helvetica, Arial, sans-serif" font-size="48"
        fill="#93b4f5">Open-source AI Security Operations Center</text>

  <!-- what it actually does -->
  <text x="104" y="424" font-family="Helvetica, Arial, sans-serif" font-size="32"
        fill="#c3cede">Alert fusion, agent triage, and a replayable decision ledger.</text>

  <!-- rule -->
  <rect x="104" y="512" width="1072" height="1" fill="#26344d"/>

  <!-- footer -->
  <text x="104" y="566" font-family="Helvetica, Arial, sans-serif" font-size="27"
        fill="#8fa0bb">MIT licensed &#183; self-hostable</text>
  <text x="1176" y="566" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="27" fill="#8fa0bb">github.com/beenuar/AiSOC</text>
</svg>
