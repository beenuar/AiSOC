id: det-cloud-233
name: GCP Compute Instance Service Account Changed
description: Attaching a more privileged service account to an instance you control is privilege escalation
  without touching IAM policy.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: cloud
log_source:
  product: gcp
  service: compute
detection:
  condition: |
    method_name == "v1.compute.instances.setServiceAccount"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
