id: det-cloud-260
name: GCP Cloud Function IAM Policy Set
description: Granting invoker to allUsers makes the function a public endpoint.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudfunctions
detection:
  condition: |
    method_name == "google.cloud.functions.v1.CloudFunctionsService.SetIamPolicy"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
