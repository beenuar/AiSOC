id: det-cloud-221
name: GCP Secret Version Accessed
description: The read that returns the secret value, as distinct from listing secret names.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1552.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: secretmanager
detection:
  condition: |
    method_name == "google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
