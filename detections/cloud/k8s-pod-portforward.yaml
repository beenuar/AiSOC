id: det-cloud-283
name: Kubernetes Port-Forward To A Pod
description: Port-forward tunnels a cluster-internal service to the operator's own machine.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1572
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "pods"
    AND k8s_subresource == "portforward"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
