id: det-cloud-276
name: GCP Workload Identity Provider Created
description: 'A provider is the trust itself: whoever controls the external issuer can obtain GCP access.'
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1199
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.v1.WorkloadIdentityPools.CreateWorkloadIdentityPoolProvider"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
