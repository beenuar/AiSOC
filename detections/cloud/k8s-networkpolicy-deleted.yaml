id: det-cloud-298
name: Kubernetes NetworkPolicy Deleted
description: Deleting a default-deny policy opens the namespace to lateral traffic.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562.004
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "delete"
    AND k8s_resource == "networkpolicies"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
