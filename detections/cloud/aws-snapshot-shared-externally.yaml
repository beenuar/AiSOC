id: det-cloud-308
name: AWS Snapshot Copy Shared With Another Account
description: AWS records this when another account copies a snapshot that was shared with it, which is
  the data leaving.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1537
- tlp.white
category: cloud
log_source:
  product: aws
  service: ec2
detection:
  condition: |
    event_name == "SharedSnapshotCopyInitiated"
false_positives:
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
