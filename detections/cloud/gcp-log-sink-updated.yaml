id: det-cloud-213
name: GCP Log Sink Updated
description: A sink filter narrowed is a sink that no longer carries the events it was written for.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562.008
- tlp.white
category: cloud
log_source:
  product: gcp
  service: logging
detection:
  condition: |
    method_name == "google.logging.v2.ConfigServiceV2.UpdateSink"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
