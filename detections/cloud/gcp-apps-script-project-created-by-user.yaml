id: det-cloud-191
name: GCP Apps Script Project Created By A User Principal
description: Apps Script creates its own projects through its service account. A user principal doing
  it under the same `sys-` prefix is impersonating that path.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "CreateProject"
    AND project_id STARTSWITH "sys-"
    AND actor_is_service_account == false
false_positives:
- Platform engineer reproducing an Apps Script project deliberately
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
