id: det-cloud-274
name: GCP Identity-Aware Proxy IAM Policy Set
description: Granting IAP access is granting the application behind it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iap
detection:
  condition: |
    method_name == "google.cloud.iap.v1.IdentityAwareProxyAdminService.SetIamPolicy"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
