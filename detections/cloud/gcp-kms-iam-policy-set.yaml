id: det-cloud-220
name: GCP KMS Key IAM Policy Set
description: Granting decrypt on a key is equivalent to granting read on everything it protects.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudkms
detection:
  condition: |
    method_name == "google.cloud.kms.v1.KeyManagementService.SetIamPolicy"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
