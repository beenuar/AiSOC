id: det-cloud-205
name: GCP Custom IAM Role Restored
description: A restored role restores every binding that referenced it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.UndeleteRole"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
