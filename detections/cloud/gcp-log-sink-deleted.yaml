id: det-cloud-212
name: GCP Log Sink Deleted
description: Deleting the sink stops the export an investigation reads, while the console still shows
  logs flowing.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1562.008
- tlp.white
category: cloud
log_source:
  product: gcp
  service: logging
detection:
  condition: |
    method_name == "google.logging.v2.ConfigServiceV2.DeleteSink"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
