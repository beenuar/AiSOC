id: det-cloud-293
name: Kubernetes Job Created
description: A one-shot workload, routine in a pipeline and a way to run a container once otherwise.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1610
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "jobs"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
