id: det-cloud-290
name: Kubernetes Service Account Created
description: A service account is an identity the cluster will mint tokens for.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1136
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "serviceaccounts"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
