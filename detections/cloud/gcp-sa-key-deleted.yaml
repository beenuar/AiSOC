id: det-cloud-200
name: GCP Service Account Key Deleted
description: Key rotation looks like this, and so does removing the key that was used.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1070
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.DeleteServiceAccountKey"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
