id: det-cloud-232
name: GCP Compute Serial Port Output Read
description: Serial console output routinely contains credentials printed during boot.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1552
- tlp.white
category: cloud
log_source:
  product: gcp
  service: compute
detection:
  condition: |
    method_name == "v1.compute.instances.getSerialPortOutput"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
