id: det-cloud-243
name: GCP Storage Bucket IAM Policy Set
description: The call that makes a bucket public also makes it private; the method name alone does not
  say which.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: storage
detection:
  condition: |
    method_name == "storage.setIamPermissions"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
