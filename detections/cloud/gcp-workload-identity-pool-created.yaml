id: det-cloud-275
name: GCP Workload Identity Pool Created
description: A workload identity pool lets an external identity provider mint GCP credentials without
  a key.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1199
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.v1.WorkloadIdentityPools.CreateWorkloadIdentityPool"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
