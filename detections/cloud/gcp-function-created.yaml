id: det-cloud-258
name: GCP Cloud Function Created
description: A function is code that runs with a service account and outlives the session that created
  it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1053
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudfunctions
detection:
  condition: |
    method_name == "google.cloud.functions.v1.CloudFunctionsService.CreateFunction"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
