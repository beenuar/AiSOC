id: det-cloud-289
name: Kubernetes Service Account Token Requested
description: A projected token is a bearer credential for the service account that can leave the cluster.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "serviceaccounts"
    AND k8s_subresource == "token"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
