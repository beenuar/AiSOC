id: det-cloud-204
name: GCP Custom IAM Role Deleted
description: Deleting a role revokes it from every principal bound to it at once.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.DeleteRole"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
