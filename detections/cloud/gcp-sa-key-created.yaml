id: det-cloud-199
name: GCP Service Account Key Created
description: A downloadable key is a long-lived credential that leaves the estate with whoever holds it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- mitre.attack.t1528
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.CreateServiceAccountKey"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
