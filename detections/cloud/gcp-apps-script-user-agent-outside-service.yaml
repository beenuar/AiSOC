id: det-cloud-194
name: GCP Apps Script User Agent On A Non-Script Service
description: AiSOC v1 curated detection. Triggers on the cloud signal described by 'GCP Apps Script User
  Agent On A Non-Script Service'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "CreateProject"
    AND caller_user_agent CONTAINS "apps-script"
    AND actor_is_service_account == false
false_positives:
- Apps Script editor acting for a signed-in user, which is legitimate inside the script project
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
