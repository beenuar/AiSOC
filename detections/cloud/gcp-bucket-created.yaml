id: det-cloud-244
name: GCP Storage Bucket Created
description: A bucket created outside the pipeline is one no lifecycle policy covers.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1537
- tlp.white
category: cloud
log_source:
  product: gcp
  service: storage
detection:
  condition: |
    method_name == "storage.buckets.create"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
