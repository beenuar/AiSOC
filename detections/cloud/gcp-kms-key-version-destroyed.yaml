id: det-cloud-217
name: GCP KMS Key Version Destroyed
description: Destroying a key version makes everything it encrypted unrecoverable.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudkms
detection:
  condition: |
    method_name == "google.cloud.kms.v1.KeyManagementService.DestroyCryptoKeyVersion"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
