id: det-cloud-261
name: GCP Cloud Run Service Replaced
description: Replacing a service swaps the container image it runs.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1525
- tlp.white
category: cloud
log_source:
  product: gcp
  service: run
detection:
  condition: |
    method_name == "google.cloud.run.v1.Services.ReplaceService"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
