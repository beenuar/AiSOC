id: det-cloud-270
name: GCP Organisation Policy Deleted
description: Deleting a constraint removes it from every project below it.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1562
- tlp.white
category: cloud
log_source:
  product: gcp
  service: orgpolicy
detection:
  condition: |
    method_name == "google.cloud.orgpolicy.v2.OrgPolicy.DeletePolicy"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
