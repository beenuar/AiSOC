id: det-cloud-208
name: GCP Project Deleted
description: Deleting a project takes its logs with it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "DeleteProject"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
