id: det-cloud-210
name: GCP Project Moved Between Folders
description: Moving a project changes which organisation policies apply to it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1578
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "MoveProject"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
