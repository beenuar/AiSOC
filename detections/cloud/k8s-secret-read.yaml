id: det-cloud-286
name: Kubernetes Secret Read
description: One secret read is routine for a controller and not for a person.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1552.007
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "get"
    AND k8s_resource == "secrets"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
