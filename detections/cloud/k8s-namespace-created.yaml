id: det-cloud-296
name: Kubernetes Namespace Created
description: A namespace created outside the platform pipeline carries none of its policies.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1610
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "namespaces"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
