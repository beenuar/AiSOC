id: det-cloud-218
name: GCP KMS Crypto Key Created
description: A key created outside the usual pipeline is a key nobody rotates.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1486
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudkms
detection:
  condition: |
    method_name == "google.cloud.kms.v1.KeyManagementService.CreateCryptoKey"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
