id: det-cloud-192
name: GCP IAM Policy Set On An Apps Script System Project
description: AiSOC v1 curated detection. Triggers on the cloud signal described by 'GCP IAM Policy Set
  On An Apps Script System Project'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "SetIamPolicy"
    AND project_id STARTSWITH "sys-"
false_positives:
- Platform team granting itself visibility into the folder
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
