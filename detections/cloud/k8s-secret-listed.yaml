id: det-cloud-287
name: Kubernetes Secrets Listed
description: Listing returns every secret in the namespace in one response.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1552.007
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "list"
    AND k8s_resource == "secrets"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
