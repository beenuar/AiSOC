id: det-cloud-272
name: GCP Security Command Center Notification Deleted
description: Deleting the notification config stops findings reaching whoever reads them.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562.008
- tlp.white
category: cloud
log_source:
  product: gcp
  service: securitycenter
detection:
  condition: |
    method_name == "google.cloud.securitycenter.v1.SecurityCenter.DeleteNotificationConfig"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
