id: det-cloud-249
name: GCP BigQuery Dataset Access Updated
description: Dataset access is where BigQuery sharing lives, including sharing with allAuthenticatedUsers.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: bigquery
detection:
  condition: |
    method_name == "google.cloud.bigquery.v2.DatasetService.UpdateDataset"
false_positives:
