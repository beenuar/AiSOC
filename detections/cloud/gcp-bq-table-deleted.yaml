id: det-cloud-252
name: GCP BigQuery Table Deleted
description: Deleting a table after reading it is the cleanup half of an extract.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: bigquery
detection:
  condition: |
    method_name == "google.cloud.bigquery.v2.TableService.DeleteTable"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
