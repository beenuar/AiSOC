id: det-cloud-248
name: GCP Storage HMAC Key Created
description: An HMAC key lets a service account be used through the S3-compatible API, which most tooling
  does not log as GCP access.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: storage
detection:
  condition: |
    method_name == "storage.hmacKeys.create"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
