id: det-cloud-251
name: GCP BigQuery Job Submitted
description: Every query and every export is a job; this is the volume signal rather than an alert.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1530
- tlp.white
category: cloud
log_source:
  product: gcp
  service: bigquery
detection:
  condition: |
    method_name == "google.cloud.bigquery.v2.JobService.InsertJob"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
