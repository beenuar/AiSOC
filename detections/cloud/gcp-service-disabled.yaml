id: det-cloud-268
name: GCP Service API Disabled
description: Disabling an API breaks everything depending on it, including security tooling.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562
- tlp.white
category: cloud
log_source:
  product: gcp
  service: serviceusage
detection:
  condition: |
    method_name == "google.api.serviceusage.v1.ServiceUsage.DisableService"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
