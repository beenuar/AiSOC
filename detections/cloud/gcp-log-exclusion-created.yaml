id: det-cloud-216
name: GCP Log Exclusion Created
description: An exclusion stops matching entries being stored at all, so nothing later recovers them.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562.008
- tlp.white
category: cloud
log_source:
  product: gcp
  service: logging
detection:
  condition: |
    method_name == "google.logging.v2.ConfigServiceV2.CreateExclusion"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
