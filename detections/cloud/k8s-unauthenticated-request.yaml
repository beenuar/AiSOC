id: det-cloud-300
name: Kubernetes Request From An Unauthenticated Caller
description: An anonymous request that was not refused means anonymous access is bound to something.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_user == "system:anonymous"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
