id: det-cloud-224
name: GCP Secret Deleted
description: Deleting a secret breaks whatever reads it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: secretmanager
detection:
  condition: |
    method_name == "google.cloud.secretmanager.v1.SecretManagerService.DeleteSecret"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
