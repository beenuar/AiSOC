id: det-cloud-301
name: Kubernetes Request Used Impersonation
description: Impersonation lets one principal act as another, and the audit event is the only place it
  is visible.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1134
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_impersonated_user != ""
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
