id: det-cloud-264
name: GCP Pub/Sub Subscription Created
description: A subscription on an existing topic copies everything published to it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: cloud
log_source:
  product: gcp
  service: pubsub
detection:
  condition: |
    method_name == "google.pubsub.v1.Subscriber.CreateSubscription"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
