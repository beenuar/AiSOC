id: det-cloud-284
name: Kubernetes Proxy Request To A Pod
description: The API server proxies the request, so it reaches the pod with the API server's network position.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1572
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "pods"
    AND k8s_subresource == "proxy"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
