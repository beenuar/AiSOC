id: det-cloud-265
name: GCP DNS Record Changed
description: A record change redirects whatever resolves through it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1565
- tlp.white
category: cloud
log_source:
  product: gcp
  service: dns
detection:
  condition: |
    method_name == "dns.changes.create"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
