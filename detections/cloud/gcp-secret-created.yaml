id: det-cloud-222
name: GCP Secret Created
description: A secret created outside the deployment pipeline is one nobody rotates.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1552.001
- tlp.white
category: cloud
log_source:
  product: gcp
  service: secretmanager
detection:
  condition: |
    method_name == "google.cloud.secretmanager.v1.SecretManagerService.CreateSecret"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
