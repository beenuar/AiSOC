id: det-cloud-257
name: GCP GKE Node Pool Management Changed
description: Turning off auto-upgrade keeps a known-vulnerable node image in service.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1578
- tlp.white
category: cloud
log_source:
  product: gcp
  service: container
detection:
  condition: |
    method_name == "google.container.v1.ClusterManager.SetNodePoolManagement"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
