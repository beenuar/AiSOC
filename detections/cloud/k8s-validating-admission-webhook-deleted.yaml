id: det-cloud-302
name: Kubernetes Validating Webhook Deleted
description: Deleting the validating webhook removes the admission control that would have refused the
  next object.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "delete"
    AND k8s_resource == "validatingwebhookconfigurations"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
