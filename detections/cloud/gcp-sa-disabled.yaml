id: det-cloud-197
name: GCP Service Account Disabled
description: Disabling an identity an attacker does not control is a denial step; disabling one they do
  is cleanup.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.DisableServiceAccount"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
