id: det-cloud-202
name: GCP Custom IAM Role Created
description: A custom role is the usual way to grant a permission set no predefined role offers.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: cloud
log_source:
  product: gcp
  service: iam
detection:
  condition: |
    method_name == "google.iam.admin.v1.CreateRole"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
