id: det-cloud-241
name: GCP Compute Image Created
description: An image built from a running disk carries whatever was on it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: cloud
log_source:
  product: gcp
  service: compute
detection:
  condition: |
    method_name == "v1.compute.images.insert"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
