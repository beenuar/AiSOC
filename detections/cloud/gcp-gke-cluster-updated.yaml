id: det-cloud-254
name: GCP GKE Cluster Updated
description: Cluster update is where network policy, authorised networks and logging are turned off.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1578
- tlp.white
category: cloud
log_source:
  product: gcp
  service: container
detection:
  condition: |
    method_name == "google.container.v1.ClusterManager.UpdateCluster"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
