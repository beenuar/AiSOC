id: det-cloud-227
name: GCP Compute Instance Deleted
description: Deleting an instance destroys its local disk and anything an investigation wanted from it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: compute
detection:
  condition: |
    method_name == "v1.compute.instances.delete"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
