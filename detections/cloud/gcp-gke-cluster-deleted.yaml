id: det-cloud-256
name: GCP GKE Cluster Deleted
description: Deleting a cluster destroys every workload on it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1485
- tlp.white
category: cloud
log_source:
  product: gcp
  service: container
detection:
  condition: |
    method_name == "google.container.v1.ClusterManager.DeleteCluster"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
