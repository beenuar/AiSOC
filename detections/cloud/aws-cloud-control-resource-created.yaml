id: det-cloud-306
name: AWS Cloud Control Resource Created
description: Cloud Control is a generic API that creates resources of any supported type, so a principal
  that never used it reaching for it is a detection the per-service rules all miss.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1578
- tlp.white
category: cloud
log_source:
  product: aws
  service: cloudcontrolapi
detection:
  condition: |
    event_name == "CreateResource"
false_positives:
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
