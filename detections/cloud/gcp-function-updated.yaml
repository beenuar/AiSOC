id: det-cloud-259
name: GCP Cloud Function Updated
description: Updating a trusted function's source is persistence inside something nobody re-reviews.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1053
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudfunctions
detection:
  condition: |
    method_name == "google.cloud.functions.v1.CloudFunctionsService.UpdateFunction"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
