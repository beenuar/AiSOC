id: det-cloud-282
name: Kubernetes Attach To A Running Pod
description: Attach reaches the main process rather than a new shell.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1609
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "pods"
    AND k8s_subresource == "attach"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
