id: det-cloud-281
name: Kubernetes Exec Into A Running Pod
description: Interactive access to a running container, which leaves no trace in the image.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1609
- tlp.white
category: cloud
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    k8s_verb == "create"
    AND k8s_resource == "pods"
    AND k8s_subresource == "exec"
false_positives:
- Sanctioned automation/IaC pipeline
- Approved patch / maintenance window activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
