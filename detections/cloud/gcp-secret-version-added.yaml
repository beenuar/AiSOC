id: det-cloud-223
name: GCP Secret Version Added
description: Adding a version is how a credential is replaced with one the attacker knows.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: cloud
log_source:
  product: gcp
  service: secretmanager
detection:
  condition: |
    method_name == "google.cloud.secretmanager.v1.SecretManagerService.AddSecretVersion"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
