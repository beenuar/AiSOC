id: det-cloud-310
name: AWS Account Removed From The Organisation
description: An account outside the organisation inherits none of its policies.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1562
- tlp.white
category: cloud
log_source:
  product: aws
  service: organizations
detection:
  condition: |
    event_name == "RemoveAccountFromOrganization"
false_positives:
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
