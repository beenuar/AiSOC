id: det-cloud-209
name: GCP Project Restored
description: A project restored inside the 30-day window returns with everything it held.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1578
- tlp.white
category: cloud
log_source:
  product: gcp
  service: cloudresourcemanager
detection:
  condition: |
    method_name == "UndeleteProject"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
