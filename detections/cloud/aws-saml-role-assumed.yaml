id: det-cloud-307
name: AWS Role Assumed Through SAML
description: Federated assumption is how most human access arrives, and is the step a forged assertion
  lands on.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: cloud
log_source:
  product: aws
  service: sts
detection:
  condition: |
    event_name == "AssumeRoleWithSAML"
false_positives:
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
