id: det-cloud-214
name: GCP Log Sink Created
description: A sink pointing outside the organisation is a supported way to copy every audit event elsewhere.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: cloud
log_source:
  product: gcp
  service: logging
detection:
  condition: |
    method_name == "google.logging.v2.ConfigServiceV2.CreateSink"
false_positives:
- Sanctioned automation/IaC pipeline
- Confirmed test/tuning activity
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
