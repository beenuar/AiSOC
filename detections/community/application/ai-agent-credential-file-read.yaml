id: community-toufiqtoufiqbo-ai-agent-credential-file-read
name: "AI Agent Tool Read a Credential-Bearing File"
description: |
  An AI agent's tool call read a file that stores long-lived credentials:
  SSH private keys, cloud CLI credential caches, container-registry auth,
  package-manager tokens, or `/etc/shadow`.

  Prompt-level secret scanning does not cover this path. The prompt can be
  clean while the agent's file tool reads a private key, and the disclosure
  happens on the way *out* — into the model context, a tool argument, or a
  second tool call. This is a credential-access signal (T1552.001), not proof
  of exfiltration; the case should establish where the file content went next.
version: 1.0.0
severity: high
category: application
tags:
  - mitre.attack.T1552.001
  - tlp.white
log_source:
  product: ai_runtime
  service: runtime
detection:
  selection_tool:
    tool_name:
      - read_file
      - read_text_file
      - read_multiple_files
      - read_media_file
      - get_file_contents
      - get_file
      - download_file
      - fetch_file
      - cat_file
  selection_target:
    resource:
      - id_rsa
      - id_ed25519
      - id_ecdsa
      - id_dsa
      - .aws/credentials
      - '.aws\credentials'
      - application_default_credentials.json
      - accessTokens.json
      - .kube/config
      - '.kube\config'
      - .docker/config.json
      - '.docker\config.json'
      - .git-credentials
      - .npmrc
      - .pypirc
      - .netrc
      - .pgpass
      - /etc/shadow
  filter_public_key:
    resource: .pub
  condition: selection_tool and selection_target and not filter_public_key
false_positives:
  - An approved secrets-rotation job that reads the file it is rotating, with the change recorded.
  - A backup or inventory agent that reads credential stores by design and is allowlisted in the AI estate.
  - A developer pointing an MCP filesystem server at their own home directory while testing locally.
playbook: tpl-credential-access
# Catalogue-only: nothing walks detections/community/ into the rule set the
# engine compiles, so `enabled: true` here would claim a capability that is not
# there — and `scripts/detection_truth_table.py --check` rejects exactly that.
# Promotion means compiling this into
# services/fusion/app/data/detection_ruleset.json, not flipping this flag.
enabled: false
quarantine_reason: "catalogue-only: nothing walks detections/community/ into the engine's compiled rule set; promote it into services/fusion/app/data/detection_ruleset.json to make it fire"
author: Toufiqtoufiqbo
created: '2026-11-10'
modified: '2026-11-10'
references:
  - https://attack.mitre.org/techniques/T1552/001/
  - https://modelcontextprotocol.io/specification/
