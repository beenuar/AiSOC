id: det-application-180
name: Atlassian Bulk Delete Performed
description: Bulk deletion destroys content and the history behind it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1485
- tlp.white
category: application
log_source:
  product: atlassian
  service: audit
detection:
  condition: |
    summary_key == "bulk_delete"
