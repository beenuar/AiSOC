id: det-application-161
name: M365 Mailbox Permission Granted
description: Full-access permission on another mailbox reads it without a sign-in to that account.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.002
- tlp.white
category: application
log_source:
  product: m365
  service: exchange
detection:
  condition: |
    operation == "Add-MailboxPermission"
false_positives:
- Sanctioned automation/IaC pipeline
- First-time provisioning / new-user onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
