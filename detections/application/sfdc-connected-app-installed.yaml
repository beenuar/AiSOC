id: det-application-102
name: Salesforce Connected Application Installed
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Salesforce Connected
  Application Installed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- mitre.attack.t1199
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.insertConnectedApplication"
false_positives:
- Approved integration from the organisation's allow-list
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
