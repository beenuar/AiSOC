id: det-application-192
name: Salesforce User Frozen
description: Freezing is the reversible half of deactivation.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.frozeUser"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
