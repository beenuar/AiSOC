id: det-application-144
name: GitLab Deploy Key Added
description: A deploy key is repository access that no member list shows.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.004
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "added_deploy_key"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
