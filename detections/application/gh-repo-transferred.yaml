id: det-application-127
name: GitHub Repository Transferred
description: A transfer moves the repository to an owner outside the organisation's controls.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.repo.transfer"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
