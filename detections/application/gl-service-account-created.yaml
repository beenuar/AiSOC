id: det-application-154
name: GitLab Service Account Created
description: A non-human identity that survives every member change.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1136
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "created_service_account"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
