id: det-application-142
name: GitHub IP Allow List Entry Created
description: Adding an entry is how an attacker's own address is admitted to an otherwise closed organisation.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.ip_allow_list_entry.create"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
