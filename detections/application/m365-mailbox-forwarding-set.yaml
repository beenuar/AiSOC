id: det-application-163
name: M365 Mailbox Configuration Changed
description: Set-Mailbox is where forwarding addresses and audit settings both live.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1114.003
- tlp.white
category: application
log_source:
  product: m365
  service: exchange
detection:
  condition: |
    operation == "Set-Mailbox"
false_positives:
- Sanctioned automation/IaC pipeline
- First-time provisioning / new-user onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
