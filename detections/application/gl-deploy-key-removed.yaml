id: det-application-145
name: GitLab Deploy Key Removed
description: Removing the key after using it is the cleanup half.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1070
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "removed_deploy_key"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
