id: det-application-124
name: GitHub Repository Created
description: A new repository is a destination, and automation creating one is worth knowing about.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1074
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.repo.create"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
