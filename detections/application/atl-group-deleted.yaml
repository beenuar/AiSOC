id: det-application-189
name: Atlassian Group Deleted
description: Deleting a group revokes everything it granted.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: atlassian
  service: audit
detection:
  condition: |
    summary_key == "group_deleted"
