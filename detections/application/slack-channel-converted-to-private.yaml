id: det-application-098
name: Slack Channel Converted To Private
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Channel
  Converted To Private'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1564
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.channel_converted_to_private"
false_positives:
- Team restricting a channel for ordinary confidentiality
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
