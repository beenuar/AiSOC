id: det-application-092
name: Slack Role Changed To Organisation Owner
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Role Changed
  To Organisation Owner'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.003
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.role_change_to_owner"
false_positives:
- Planned ownership handover
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
