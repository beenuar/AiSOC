id: det-application-148
name: GitLab Member Removed
description: Routine offboarding, and also access removal nobody asked for.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "removed_user_access"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
