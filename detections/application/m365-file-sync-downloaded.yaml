id: det-application-171
name: M365 Full File Sync Downloaded
description: A full sync copies the library to a device.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1530
- tlp.white
category: application
log_source:
  product: m365
  service: onedrive
detection:
  condition: |
    operation == "FileSyncDownloadedFull"
false_positives:
- Sanctioned automation/IaC pipeline
- First-time provisioning / new-user onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
