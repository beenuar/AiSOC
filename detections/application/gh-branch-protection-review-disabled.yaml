id: det-application-132
name: GitHub Required Reviews Disabled On A Protected Branch
description: Dismissing stale reviews automatically is how an approved change becomes a different change.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1562
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.protected_branch.dismiss_stale_reviews"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
