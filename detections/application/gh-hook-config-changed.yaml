id: det-application-139
name: GitHub Webhook Configuration Changed
description: Changing the URL redirects the copy without creating a new hook to notice.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.hook.config_changed"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
