id: det-application-135
name: GitHub Fine-Grained Token Granted Organisation Access
description: A token with organisation access is a credential outside the session model entirely.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.personal_access_token.access_granted"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
