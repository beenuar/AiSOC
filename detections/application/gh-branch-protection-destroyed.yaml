id: det-application-131
name: GitHub Branch Protection Removed
description: Removing protection lets the default branch be rewritten.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1562
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.protected_branch.destroy"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
