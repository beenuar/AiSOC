id: det-application-117
name: GitHub Organisation Member Promoted To Owner
description: Owner reaches every repository, every secret and the audit log itself.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.003
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.update_member"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
