id: det-application-133
name: GitHub Actions Secret Created
description: A secret is a credential every workflow in scope can read.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1552
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.create_actions_secret"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
