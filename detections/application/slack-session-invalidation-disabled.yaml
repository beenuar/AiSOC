id: det-application-096
name: Slack Session Invalidation Disabled
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Session
  Invalidation Disabled'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.user_session_invalidation_disabled"
false_positives:
- Administrator troubleshooting a sign-out loop
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
