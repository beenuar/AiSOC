id: det-application-206
name: Slack Role Changed To Workspace Admin
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Role Changed
  To Workspace Admin'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.role_change_to_admin"
false_positives:
- Administrator onboarding
- First-time provisioning / new-user onboarding
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
