id: det-application-088
name: Hosted Coding Agent MCP Server List Changed
description: The MCP server list decides what a hosted coding agent can reach and what it is told. Adding
  a server is adding a party that can instruct the agent, which is a scope change rather than a settings
  change — and the agent runs on the provider's infrastructure, so no endpoint control sees the result.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1195
- tlp.white
category: application
log_source:
  product: github_copilot
  service: audit
detection:
  condition: |
    event_type ENDSWITH ".copilot.swe_agent_mcp_config_updated"
false_positives:
- A reviewed addition of an internal MCP server
playbook: tpl-supply-chain
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
