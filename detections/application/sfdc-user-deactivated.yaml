id: det-application-191
name: Salesforce User Deactivated
description: Routine offboarding, and also access removal nobody asked for.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.deactivateUser"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
