id: det-application-091
name: Slack Organisation Export Started
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Organisation
  Export Started'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1530
- mitre.attack.t1567
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.organization_export_started"
false_positives:
- Legal hold or discovery export with a recorded authorisation
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
