id: det-application-106
name: Salesforce Permission Set Created
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Salesforce Permission
  Set Created'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.PermSetCreate"
false_positives:
- Administrator building a role for a new team
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
