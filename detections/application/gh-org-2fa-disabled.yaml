id: det-application-118
name: GitHub Organisation Two-Factor Requirement Disabled
description: Removing the requirement lets every member drop their second factor.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.006
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.disable_two_factor_requirement"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
