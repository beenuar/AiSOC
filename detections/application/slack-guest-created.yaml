id: det-application-099
name: Slack Guest Account Created
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Guest
  Account Created'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1136.003
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.guest_created"
false_positives:
- Contractor onboarding
- First-time provisioning / new-user onboarding
playbook: tpl-persistence
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
