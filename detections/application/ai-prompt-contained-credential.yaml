id: det-application-085
name: Credential Material Present in an AI Prompt
description: 'A secret shape appeared in a prompt. Detected without the prompt content ever being transmitted:
  the SDK reports which patterns matched while sending only a digest, so this fires even under the default
  hashed capture mode.'
version: 1.0.0
severity: high
tags:
- mitre.attack.t1552
- tlp.white
category: application
log_source:
  product: ai_runtime
  service: runtime
detection:
  condition: |
    prompt_secret_kinds HAS_ANY ["aws_access_key", "github_token", "openai_key", "private_key", "slack_token"]
false_positives:
- Security testing with a revoked key
- Developer pasting a sample key from documentation
playbook: tpl-account-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
