id: det-application-110
name: Salesforce Certificate Inserted
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Salesforce Certificate
  Inserted'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.insertCertificate"
false_positives:
- Identity-provider certificate rotation
playbook: tpl-persistence
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
