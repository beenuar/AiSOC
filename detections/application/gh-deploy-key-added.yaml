id: det-application-129
name: GitHub Deploy Key Added
description: GitHub logs a deploy key add as public_key.create; the repo field is what distinguishes it
  from a user SSH key.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.004
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.public_key.create"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
