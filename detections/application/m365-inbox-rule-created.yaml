id: det-application-156
name: M365 Inbox Rule Created
description: A forwarding or delete rule is the textbook business-email-compromise persistence step; the
  connector now lifts the rule's parameters so the destination is visible.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1114.003
- tlp.white
category: application
log_source:
  product: m365
  service: exchange
detection:
  condition: |
    operation == "New-InboxRule"
false_positives:
- Sanctioned automation/IaC pipeline
- First-time provisioning / new-user onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
