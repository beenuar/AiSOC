id: det-application-095
name: Slack Two-Factor Policy Changed
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Two-Factor
  Policy Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.006
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.pref.two_factor_auth_changed"
false_positives:
- Policy tightened rather than relaxed; the entry records the direction
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
