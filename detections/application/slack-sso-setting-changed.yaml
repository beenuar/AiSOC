id: det-application-094
name: Slack Single Sign-On Setting Changed
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack Single
  Sign-On Setting Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.pref.sso_setting_changed"
false_positives:
- Identity-provider migration with a change ticket
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
