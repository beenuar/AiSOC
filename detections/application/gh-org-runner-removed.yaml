id: det-application-123
name: GitHub Self-Hosted Runner Removed
description: Removing the runner after using it is the cleanup half.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1070
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.remove_self_hosted_runner"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
