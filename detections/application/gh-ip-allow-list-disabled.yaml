id: det-application-141
name: GitHub Organisation IP Allow List Disabled
description: The allow list is the network control in front of the organisation.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.disable_ip_allow_list"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
