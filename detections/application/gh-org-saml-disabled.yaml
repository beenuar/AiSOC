id: det-application-120
name: GitHub Organisation SAML Disabled
description: Disabling SAML returns the organisation to password authentication.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.disable_saml"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
