id: det-application-187
name: Atlassian User Removed From A Group
description: Routine offboarding, and also access removal nobody asked for.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: atlassian
  service: audit
detection:
  condition: |
    summary_key == "user_removed_from_group"
