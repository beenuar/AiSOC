id: det-application-105
name: Salesforce Permission Set Assigned
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Salesforce Permission
  Set Assigned'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.PermSetAssign"
false_positives:
- First-time provisioning / new-user onboarding
- Role change processed by the identity-governance pipeline
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
