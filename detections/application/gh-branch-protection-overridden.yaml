id: det-application-130
name: GitHub Branch Protection Overridden
description: An override is a push that the protection rule should have refused.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1562
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.protected_branch.policy_override"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
