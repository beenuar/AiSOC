id: det-application-107
name: Salesforce User Profile Changed
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Salesforce User
  Profile Changed'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.changedProfile"
false_positives:
- First-time provisioning / new-user onboarding
- Planned profile migration
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
