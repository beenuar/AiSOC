id: det-application-089
name: AI Application Consented a Write Scope
description: A consent grant handing an AI application the ability to change a mailbox, a drive, a site
  or the directory itself. The read equivalent is an exposure; this one can act. The decisive field is
  the granted scope, which the connector lifts out of the free-text consent property — a grant whose scopes
  stay buried is indistinguishable from one that was granted nothing.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: application
log_source:
  product: entra_consent
  service: audit
detection:
  condition: |
    event_type ENDSWITH ".consent_to_application"
    AND scopes HAS_ANY ["Mail.ReadWrite", "Mail.Send", "Files.ReadWrite.All", "Sites.ReadWrite.All", "Directory.ReadWrite.All", "User.ReadWrite.All"]
false_positives:
- An AI application approved through the organisation's own review process
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
