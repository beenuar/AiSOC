id: det-application-157
name: M365 Inbox Rule Modified
description: Modifying an existing rule leaves the rule count unchanged.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1114.003
- tlp.white
category: application
log_source:
  product: m365
  service: exchange
detection:
  condition: |
    operation == "Set-InboxRule"
false_positives:
- Sanctioned automation/IaC pipeline
- First-time provisioning / new-user onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
