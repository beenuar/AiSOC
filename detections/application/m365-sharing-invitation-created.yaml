id: det-application-168
name: M365 External Sharing Invitation Created
description: An invitation to an address outside the tenant.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: m365
  service: sharepoint
detection:
  condition: |
    operation == "SharingInvitationCreated"
