id: det-application-175
name: Atlassian Permissions Granted To Anyone
description: Anonymous permission makes the content public.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: atlassian
  service: audit
detection:
  condition: |
    summary_key == "permissions_granted_to_anyone"
