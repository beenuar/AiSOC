id: det-application-104
name: Salesforce Administrator Signed In As Another User
description: '`DelegateUser` on the record names the administrator who assumed the identity, which is
  the field an investigation needs and the connector now lifts.'
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.suOrgAdminLogin"
false_positives:
- Support engineer reproducing a reported defect with the user's consent
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
