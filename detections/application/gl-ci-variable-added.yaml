id: det-application-153
name: GitLab CI Variable Added
description: A CI variable is a credential every pipeline in scope reads.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1552
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "added_ci_variable"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
