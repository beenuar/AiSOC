id: det-application-198
name: Salesforce Interface URL Changed
description: An interface URL is where the product sends a user.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1565
- tlp.white
category: application
log_source:
  product: salesforce
  service: setup-audit
detection:
  condition: |
    event_type == "salesforce.changedInterfaceUrl"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
