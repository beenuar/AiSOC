id: det-application-200
name: Slack App Installed With Broad Read Scopes
description: A newly installed app that can read message history or files. The scope list is the clause;
  the install alone is routine.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- mitre.attack.t1199
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.app_installed"
    AND app_scopes HAS_ANY ["files:read", "channels:history", "groups:history", "im:history"]
false_positives:
- Approved integration from the organisation's allow-list
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
