id: det-application-134
name: GitHub Actions Secret Removed
description: Removing a secret breaks whatever used it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1070
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.remove_actions_secret"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
