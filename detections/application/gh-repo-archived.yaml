id: det-application-128
name: GitHub Repository Archived
description: Archiving freezes a repository, which is also how work is hidden from active review.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1485
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.repo.archived"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
