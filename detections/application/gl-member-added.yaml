id: det-application-146
name: GitLab Member Added To A Project Or Group
description: Membership is how GitLab access is granted.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1136
- tlp.white
category: application
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    action_key == "added_user_access"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
