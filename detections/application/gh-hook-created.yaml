id: det-application-138
name: GitHub Webhook Created
description: A webhook copies repository events to whatever endpoint it names.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.hook.create"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
