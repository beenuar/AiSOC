id: det-application-122
name: GitHub Self-Hosted Runner Registered
description: A self-hosted runner executes workflow code on hardware the organisation does not inspect.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1053
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.register_self_hosted_runner"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
