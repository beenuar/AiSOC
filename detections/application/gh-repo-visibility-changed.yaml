id: det-application-126
name: GitHub Repository Visibility Changed
description: GitHub logs a public/private flip as repo.access, not repo.visibility_change — a rule naming
  the latter could never fire.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1537
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.repo.access"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
