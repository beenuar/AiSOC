id: det-application-115
name: GitHub Organisation Member Removed
description: Routine offboarding, and also access removal nobody asked for.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1531
- tlp.white
category: application
log_source:
  product: github
  service: audit
detection:
  condition: |
    event_type == "github.org.remove_member"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
