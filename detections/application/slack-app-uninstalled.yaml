id: det-application-202
name: Slack App Uninstalled
description: AiSOC v1 curated detection. Triggers on the application signal described by 'Slack App Uninstalled'.
  Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1070
- tlp.white
category: application
log_source:
  product: slack
  service: audit
detection:
  condition: |
    event_type == "slack.app_uninstalled"
false_positives:
- Ordinary integration retirement
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
