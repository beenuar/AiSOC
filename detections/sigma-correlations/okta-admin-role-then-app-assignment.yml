---
title: One Okta actor both gained admin privilege and assigned an application
id: aisoc-corr-okta-admin-granted-and-app-assigned
status: experimental
description: >-
  An administrator privilege grant and an application assignment touching the
  same actor inside thirty minutes, in either order. Both are everyday
  identity administration; together in one window they describe privilege and
  reach arriving at once, which is what a new administrator legitimately gets
  on their first day and what an attacker arranges on their only day. The
  unordered form is deliberate — which came first says nothing useful here.
level: medium
category: identity
tags:
  - attack.t1098
correlation:
  type: temporal
  rules:
    - okta-admin-privilege-granted
    - okta-app-assigned
  group-by:
    - actor_email
  timespan: 30m
