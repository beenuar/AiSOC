---
title: An account created an inbox rule and then downloaded files
id: aisoc-corr-m365-inbox-rule-then-download
status: experimental
description: >-
  An inbox-rule creation followed by a file download by the same account
  inside an hour. The order is the detection: a rule that hides or forwards
  mail, created before the account starts pulling documents, is the standard
  business-email-compromise opening — the rule keeps the owner from noticing
  what follows. Users create inbox rules constantly, so this is medium and
  deliberately paired rather than alerting on rules alone.
level: medium
category: saas
tags:
  - attack.t1114.003
  - attack.t1530
correlation:
  type: temporal_ordered
  rules:
    - m365-inbox-rule-created
    - m365-file-downloaded
  group-by:
    - UserId
  timespan: 60m
