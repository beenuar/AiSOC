---
title: A principal was denied a role and then assumed one
id: aisoc-corr-aws-assume-denied-then-success
status: experimental
description: >-
  An AssumeRole denial followed by a successful AssumeRole for the same
  principal inside fifteen minutes. The order carries the meaning: refusals
  alone are ordinary (a misconfigured client retries all day), and a success
  alone is the normal path, but a refusal that becomes a success in minutes is
  either a permission that was just granted or a principal enumerating roles
  until one works. Both are worth a question; only one is routine.
level: medium
category: cloud
tags:
  - attack.t1548
  - attack.t1078.004
correlation:
  type: temporal_ordered
  rules:
    - aws-assume-role-denied
    - aws-assume-role-succeeded
  group-by:
    - user_arn
  timespan: 15m
