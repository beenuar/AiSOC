id: det-data-exfil-042
name: Dropbox Application Linked To The Team
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Application
  Linked To The Team'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- mitre.attack.t1199
- tlp.white
category: data-exfil
log_source:
