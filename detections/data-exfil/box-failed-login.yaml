id: det-data-exfil-054
name: Box Sign-In Failed
description: One failure is a typo; the rule exists so a run of them can be counted.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1110
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.FAILED_LOGIN"
false_positives:
- Sanctioned automation/IaC pipeline
- Routine backup/disaster-recovery exercise
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
