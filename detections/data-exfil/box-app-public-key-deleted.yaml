id: det-data-exfil-033
name: Box Application Public Key Deleted
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Box Application
  Public Key Deleted'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1070
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.APPLICATION_PUBLIC_KEY_DELETED"
false_positives:
- Scheduled key rotation for a sanctioned integration
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
