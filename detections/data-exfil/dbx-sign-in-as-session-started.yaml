id: det-data-exfil-069
name: Dropbox Administrator Signed In As A Member
description: Administrative impersonation, legitimate and otherwise indistinguishable from the member.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.sign_in_as_session_start"
false_positives:
- Sanctioned automation/IaC pipeline
- Routine backup/disaster-recovery exercise
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
