id: det-data-exfil-024
name: Workspace Drive Link Sharing Created
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Workspace Drive
  Link Sharing Created'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: data-exfil
log_source:
  product: google-workspace
  service: drive
detection:
  condition: |
    event_type == "workspace.drive.create_link_sharing"
false_positives:
- Ordinary internal collaboration
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
