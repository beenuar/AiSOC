id: det-data-exfil-072
name: Snowflake User Dropped
description: Dropping a user removes their access and their query history association.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1531
- tlp.white
category: data-exfil
log_source:
  product: snowflake
  service: query-history
detection:
  condition: |
    query_type == "DROP_USER"
false_positives:
- Sanctioned automation/IaC pipeline
- Routine backup/disaster-recovery exercise
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
