id: det-data-exfil-034
name: Box Sign-In From An Anonymizing Or Hosting Network
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Box Sign-In From
  An Anonymizing Or Hosting Network'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- mitre.attack.t1090.003
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.USER_LOGIN"
    AND ip_class IN ["vpn", "tor_exit", "public_proxy", "hosting_provider"]
false_positives:
- Corporate VPN egress classified as a hosting provider
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
