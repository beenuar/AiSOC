id: det-data-exfil-057
name: Box Retention Policy Removed
description: Removing retention lets content be deleted that policy was keeping.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1485
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.DATA_RETENTION_REMOVE_RETENTION"
false_positives:
- Sanctioned automation/IaC pipeline
- Routine backup/disaster-recovery exercise
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
