id: det-data-exfil-025
name: Workspace Shared Drive Settings Changed
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Workspace Shared
  Drive Settings Changed'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1537
- tlp.white
category: data-exfil
log_source:
  product: google-workspace
  service: drive
detection:
  condition: |
    event_type == "workspace.drive.shared_drive_settings_change"
false_positives:
- Confirmed test/tuning activity
- Drive owner relaxing restrictions for a project
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
