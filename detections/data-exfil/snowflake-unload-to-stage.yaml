id: det-data-exfil-047
name: Snowflake Data Unloaded To A Stage
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Snowflake Data
  Unloaded To A Stage'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1537
- mitre.attack.t1567
- tlp.white
category: data-exfil
log_source:
  product: snowflake
  service: query-history
detection:
  condition: |
    query_type == "UNLOAD"
false_positives:
- Scheduled export into the organisation's own object store
- Sanctioned automation/IaC pipeline
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
