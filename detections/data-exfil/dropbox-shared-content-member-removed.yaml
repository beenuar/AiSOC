id: det-data-exfil-038
name: Dropbox Shared Content Member Removed
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Shared
  Content Member Removed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
