id: det-data-exfil-044
name: Dropbox External Password Unmasked
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox External
  Password Unmasked'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1555
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.account_external_password_unmask"
false_positives:
- Password-manager migration performed by the account owner
playbook: tpl-credential-access
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
