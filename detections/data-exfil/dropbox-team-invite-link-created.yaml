id: det-data-exfil-039
name: Dropbox Team Invite Link Created
description: An invite link lets anyone holding it join the team, which is persistence that survives the
  original account being disabled.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1136.003
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.team_member_create_team_invite_link"
false_positives:
- Bulk onboarding with an approved invite link
playbook: tpl-persistence
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
