id: det-data-exfil-070
name: Snowflake Privilege Revoked
description: Revocation is routine governance and also an attacker reducing who can see them.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: data-exfil
log_source:
  product: snowflake
  service: query-history
detection:
  condition: |
    query_type == "REVOKE"
false_positives:
- Sanctioned automation/IaC pipeline
- Routine backup/disaster-recovery exercise
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
