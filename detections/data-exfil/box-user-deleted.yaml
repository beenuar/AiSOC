id: det-data-exfil-035
name: Box User Deleted
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Box User Deleted'.
  Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.DELETE_USER"
false_positives:
- Leaver process running on schedule
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
