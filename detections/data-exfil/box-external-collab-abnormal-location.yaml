id: det-data-exfil-029
name: Box External Collaboration Invite From An Abnormal Location
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Box External
  Collaboration Invite From An Abnormal Location'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1199
- mitre.attack.t1078.004
- tlp.white
category: data-exfil
log_source:
  product: box
  service: events
detection:
  condition: |
    event_type == "box.SHIELD_EXTERNAL_COLLAB_INVITE_ABNORMAL_LOCATION"
false_positives:
- Staff member travelling
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
