id: det-data-exfil-040
name: Dropbox Member Admin Role Changed
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Member
  Admin Role Changed'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.003
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.member_change_admin_role"
false_positives:
- Planned administrator onboarding
- First-time provisioning / new-user onboarding
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
