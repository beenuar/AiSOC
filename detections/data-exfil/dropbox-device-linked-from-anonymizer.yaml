id: det-data-exfil-045
name: Dropbox Device Linked From An Anonymizing Network
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Device
  Linked From An Anonymizing Network'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.device_link_success"
    AND ip_class IN ["vpn", "tor_exit", "public_proxy", "hosting_provider"]
false_positives:
- Staff member on a corporate VPN whose egress is classified as hosting
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
