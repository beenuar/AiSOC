id: det-data-exfil-041
name: Dropbox Single Sign-On Policy Changed
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Single
  Sign-On Policy Changed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.sso_change_policy"
false_positives:
- Identity-provider migration with a change ticket
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
