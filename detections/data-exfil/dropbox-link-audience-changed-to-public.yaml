id: det-data-exfil-036
name: Dropbox Shared Link Audience Changed To Public
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Dropbox Shared
  Link Audience Changed To Public'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1537
- tlp.white
category: data-exfil
log_source:
  product: dropbox
  service: events
detection:
  condition: |
    event_type == "dropbox.shared_content_change_link_audience_to_public"
false_positives:
- Marketing asset published deliberately
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
