id: det-data-exfil-022
name: Workspace Drive Document Opened To Anyone With The Link
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Workspace Drive
  Document Opened To Anyone With The Link'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1537
- tlp.white
category: data-exfil
log_source:
  product: google-workspace
  service: drive
detection:
  condition: |
    event_type == "workspace.drive.change_document_visibility"
    AND param_visibility IN ["people_with_link", "public_on_the_web"]
false_positives:
- Marketing asset published deliberately
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
