id: det-data-exfil-023
name: Workspace Drive Access Granted Outside The Domain
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Workspace Drive
  Access Granted Outside The Domain'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1537
- mitre.attack.t1567.002
- tlp.white
category: data-exfil
log_source:
  product: google-workspace
  service: drive
detection:
  condition: |
    event_type == "workspace.drive.change_user_access"
    AND param_visibility == "shared_externally"
false_positives:
- Sanctioned collaboration with a named partner domain
playbook: tpl-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
