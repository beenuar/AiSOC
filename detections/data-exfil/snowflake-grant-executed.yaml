id: det-data-exfil-048
name: Snowflake Privilege Granted
description: AiSOC v1 curated detection. Triggers on the data-exfil signal described by 'Snowflake Privilege
  Granted'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- tlp.white
category: data-exfil
log_source:
  product: snowflake
  service: query-history
detection:
  condition: |
    query_type == "GRANT"
false_positives:
- Role provisioning through the data-platform pipeline
- Sanctioned automation/IaC pipeline
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
