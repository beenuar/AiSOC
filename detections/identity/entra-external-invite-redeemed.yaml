id: det-identity-225
name: Entra External User Invitation Redeemed
description: Redemption is when the guest identity starts working.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1199
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Redeem external user invite"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
