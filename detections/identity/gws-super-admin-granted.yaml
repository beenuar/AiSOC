id: det-identity-173
name: Workspace Super-Admin Privilege Granted
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Super-Admin
  Privilege Granted'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.003
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: admin
detection:
  condition: |
    event_type == "workspace.admin.grant_admin_privilege"
false_positives:
- Planned administrator onboarding
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
