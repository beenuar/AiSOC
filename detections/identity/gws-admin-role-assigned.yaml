id: det-identity-175
name: Workspace Administrator Role Assigned
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Administrator
  Role Assigned'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: admin
detection:
  condition: |
    event_type == "workspace.admin.assign_role"
false_positives:
- First-time provisioning / new-user onboarding
- Role rotation inside the platform team
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
