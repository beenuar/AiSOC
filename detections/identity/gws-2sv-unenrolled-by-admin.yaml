id: det-identity-164
name: Workspace 2-Step Verification Removed By An Administrator
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace 2-Step
  Verification Removed By An Administrator'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: admin
detection:
  condition: |
    event_type == "workspace.admin.unenroll_user_from_strong_auth"
false_positives:
- Documented break-glass procedure
- Help-desk recovery after a verified identity check
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
