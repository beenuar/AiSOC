id: det-identity-162
name: Workspace Recovery Phone Changed By The Account Holder
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Recovery
  Phone Changed By The Account Holder'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.005
- mitre.attack.t1556
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.recovery_phone_edit"
false_positives:
- Staff member replacing a lost handset
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
