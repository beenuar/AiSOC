id: det-identity-197
name: Entra Service Principal Removed
description: Removing a service principal breaks whatever authenticated as it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Remove service principal"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
