id: det-identity-255
name: Entra Risky Sign-In With No Conditional Access Applied
description: A risky sign-in that no policy evaluated is an exclusion working as configured, which is
  the thing to check.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND conditionalAccessStatus == "notApplied"
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
