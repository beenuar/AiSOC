id: det-identity-262
name: Entra Sign-In Flagged As Atypical Travel
description: Two sign-ins too far apart to be one person.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND riskEventTypes_v2 HAS_ANY ["unlikelyTravel"]
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
