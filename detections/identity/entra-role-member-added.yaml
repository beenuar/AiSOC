id: det-identity-191
name: Entra Member Added To A Directory Role
description: The target account and the role it received are inside targetResources, which the connector
  now lifts.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add member to role"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
