id: det-identity-258
name: Entra Sign-In Using A Legacy Authentication Client
description: Legacy protocols cannot present a second factor, which is why they are the preferred path
  into a tenant.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND client_app IN ["Other clients", "IMAP4", "POP3", "SMTP", "Exchange ActiveSync"]
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
