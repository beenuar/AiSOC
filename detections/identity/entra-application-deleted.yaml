id: det-identity-203
name: Entra Application Deleted
description: Deleting the registration removes the audit trail an investigation would follow.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1485
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Delete application"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
