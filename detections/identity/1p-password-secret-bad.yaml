id: det-identity-293
name: 1Password Account Password Or Secret Key Wrong
description: Both halves are required, so this does not say which was wrong.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1110
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    signin_type == "password_secret_bad"
false_positives:
- Confirmed test/tuning activity
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
