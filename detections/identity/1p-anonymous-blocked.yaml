id: det-identity-291
name: 1Password Sign-In Blocked As Anonymous
description: 1Password's own anonymizer verdict, independent of the ingest dataset.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1090.003
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    signin_type == "anonymous_blocked"
false_positives:
- Confirmed test/tuning activity
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
