id: det-identity-221
name: Entra User Account Updated
description: User update covers the proxy addresses and alternate identifiers sign-in resolves through.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1098
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Update user"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
