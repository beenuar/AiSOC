id: det-identity-199
name: Entra Service Principal Credential Removed
description: Rotation looks like this, and so does removing the credential that was used.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1070
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Remove service principal credentials"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
