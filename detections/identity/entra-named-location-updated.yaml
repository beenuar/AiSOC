id: det-identity-236
name: Entra Named Location Updated
description: Widening a trusted range is the same bypass with no new object to notice.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Update named location"
false_positives:
