id: det-identity-198
name: Entra Service Principal Credential Added
description: A new secret or certificate on an existing service principal is persistence that no user
  sign-in reveals.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.001
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add service principal credentials"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
