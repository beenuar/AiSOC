id: det-identity-196
name: Entra Service Principal Added
description: A service principal is a non-human identity that survives every password reset.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1136
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add service principal"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
