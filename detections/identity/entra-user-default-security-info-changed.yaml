id: det-identity-216
name: Entra Default Authentication Method Changed
description: Moving the default to a weaker method lowers the bar for every later sign-in.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "User changed default security info"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
