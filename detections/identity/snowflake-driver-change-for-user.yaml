id: det-identity-180
name: Snowflake Sign-In From A Programmatic Driver
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Snowflake Sign-In
  From A Programmatic Driver'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: snowflake
  service: login-history
detection:
  condition: |
    event_type == "snowflake.login"
    AND is_success == true
    AND client_type == "JDBC_DRIVER"
false_positives:
- Established extract-transform-load job
- Sanctioned automation/IaC pipeline
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
