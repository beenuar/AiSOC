id: det-identity-257
name: Entra Risky Sign-In From A Non-Compliant Device
description: Compliance is the signal conditional access reads; a risky sign-in from an unmanaged device
  had none of it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND device_compliant == false
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
