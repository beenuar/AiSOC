id: det-identity-176
name: Workspace Managed Mobile Device Reported Compromised
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Managed
  Mobile Device Reported Compromised'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: mobile
detection:
  condition: |
    event_type == "workspace.mobile.device_compromised_event"
false_positives:
- Developer handset deliberately rooted for testing
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
