id: det-identity-252
name: Entra Sign-In At High Risk
description: Microsoft's own risk verdict on the sign-in itself.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND riskLevelDuringSignIn == "high"
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
