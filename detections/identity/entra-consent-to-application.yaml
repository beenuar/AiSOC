id: det-identity-209
name: Entra Consent Granted To An Application
description: Illicit consent is the textbook route to a mailbox without a password.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Consent to application"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
