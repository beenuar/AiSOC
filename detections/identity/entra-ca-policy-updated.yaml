id: det-identity-233
name: Entra Conditional Access Policy Updated
description: An exclusion added to a policy is the usual way multi-factor enforcement is bypassed for
  one account.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Update conditional access policy"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
