id: det-identity-231
name: Entra Administrative Unit Created
description: An administrative unit scopes who may administer whom.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
