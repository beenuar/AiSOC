id: det-identity-249
name: Entra Device Deleted
description: Deleting a device removes the compliance signal conditional access reads.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1531
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Delete device"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
