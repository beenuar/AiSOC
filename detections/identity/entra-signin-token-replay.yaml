id: det-identity-267
name: Entra Sign-In Flagged As Token Issuer Replay
description: An anomalous token is a token used in a way the issuing session does not explain.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1550.001
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND riskEventTypes_v2 HAS_ANY ["suspiciousBrowser", "anomalousToken"]
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
