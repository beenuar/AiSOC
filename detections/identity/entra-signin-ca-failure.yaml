id: det-identity-254
name: Entra Sign-In Blocked By Conditional Access
description: A blocked attempt is evidence of an attempt.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND conditionalAccessStatus == "failure"
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
