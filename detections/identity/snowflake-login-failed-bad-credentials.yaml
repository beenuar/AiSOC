id: det-identity-178
name: Snowflake Sign-In Failed With Incorrect Credentials
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Snowflake Sign-In
  Failed With Incorrect Credentials'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1110
- tlp.white
category: identity
log_source:
  product: snowflake
  service: login-history
detection:
  condition: |
    event_type == "snowflake.login"
    AND is_success == false
    AND error_code == "390100"
false_positives:
- Staff member mistyping a password
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
