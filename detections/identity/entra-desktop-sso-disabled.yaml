id: det-identity-247
name: Entra Seamless Single Sign-On Disabled
description: Turning it off breaks sign-in for everyone relying on it.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1562
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Disable Desktop SSO"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
