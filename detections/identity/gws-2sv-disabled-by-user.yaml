id: det-identity-163
name: Workspace 2-Step Verification Turned Off By The Account Holder
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace 2-Step
  Verification Turned Off By The Account Holder'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.2sv_disable"
false_positives:
- Documented break-glass procedure
- Staff member who lost their second factor
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
