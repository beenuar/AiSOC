id: det-identity-168
name: Workspace Suspicious Programmatic Sign-In
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Suspicious
  Programmatic Sign-In'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- mitre.attack.t1550.001
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.suspicious_programmatic_login"
false_positives:
- Scripted integration authenticating with a user credential rather than a service account
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
