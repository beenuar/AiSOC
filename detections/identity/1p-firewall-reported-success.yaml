id: det-identity-184
name: 1Password Sign-In Succeeded From A Firewall-Reported Address
description: AiSOC v1 curated detection. Triggers on the identity signal described by '1Password Sign-In
  Succeeded From A Firewall-Reported Address'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    event_type == "onepassword.signin.firewall_reported_success"
false_positives:
- Policy in report-only mode during a rollout
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
