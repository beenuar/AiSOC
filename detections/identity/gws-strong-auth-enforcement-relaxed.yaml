id: det-identity-165
name: Workspace Strong Authentication Enforcement Relaxed
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Strong
  Authentication Enforcement Relaxed'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: admin
detection:
  condition: |
    event_type == "workspace.admin.allow_strong_authentication"
false_positives:
- Documented policy change with a change ticket
playbook: tpl-defense-evasion
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
