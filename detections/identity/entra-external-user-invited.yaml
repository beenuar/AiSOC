id: det-identity-224
name: Entra External User Invited
description: A guest is an identity outside the organisation's own controls.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1199
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Invite external user"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
