id: det-identity-177
name: Snowflake Password-Only Sign-In Succeeded
description: Snowflake states both factors on every LOGIN_HISTORY row, so a password-only success is a
  fact rather than an inference.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: snowflake
  service: login-history
detection:
  condition: |
    event_type == "snowflake.login"
    AND is_success == true
    AND first_auth_factor == "PASSWORD"
    AND mfa_satisfied == false
false_positives:
- Service user that cannot hold a second factor and is restricted by network policy instead
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
