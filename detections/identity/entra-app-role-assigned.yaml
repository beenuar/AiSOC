id: det-identity-207
name: Entra App Role Assigned To A Service Principal
description: Application permissions are not scoped to a user, so one grant reaches the whole tenant.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.001
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add app role assignment to service principal"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
