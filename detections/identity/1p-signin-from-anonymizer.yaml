id: det-identity-186
name: 1Password Sign-In From An Anonymizing Or Hosting Network
description: AiSOC v1 curated detection. Triggers on the identity signal described by '1Password Sign-In
  From An Anonymizing Or Hosting Network'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078
- mitre.attack.t1090.003
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    event_type == "onepassword.signin.success"
    AND ip_class IN ["vpn", "tor_exit", "public_proxy", "hosting_provider"]
false_positives:
- Corporate VPN egress classified as a hosting provider
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
