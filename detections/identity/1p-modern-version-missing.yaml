id: det-identity-295
name: 1Password Client Too Old To Sign In
description: An unmanaged or very old client.
version: 1.0.0
severity: low
tags:
- mitre.attack.t1078
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    signin_type == "modern_version_missing"
false_positives:
- Confirmed test/tuning activity
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
