id: det-identity-212
name: Entra Security Information Registered By The User
description: A new authentication method registered from an unfamiliar session is persistence.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "User registered security info"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
