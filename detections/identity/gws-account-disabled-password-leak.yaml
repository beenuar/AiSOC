id: det-identity-171
name: Workspace Account Disabled After A Leaked Password
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Account
  Disabled After A Leaked Password'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.account_disabled_password_leak"
false_positives:
- Credential reused from an unrelated breach, with no access achieved
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
