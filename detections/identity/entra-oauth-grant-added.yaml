id: det-identity-206
name: Entra OAuth2 Permission Grant Added
description: A delegated permission grant is an application acting as a user.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1528
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add OAuth2PermissionGrant"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
