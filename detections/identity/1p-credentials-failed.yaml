id: det-identity-181
name: 1Password Sign-In Failed On Credentials
description: AiSOC v1 curated detection. Triggers on the identity signal described by '1Password Sign-In
  Failed On Credentials'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1110
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    event_type == "onepassword.signin.credentials_failed"
false_positives:
- Staff member mistyping their account password
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
