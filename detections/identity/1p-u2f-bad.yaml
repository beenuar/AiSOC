id: det-identity-285
name: 1Password Security Key Rejected
description: A hardware key cannot be phished, so a rejection is a mismatch worth reading.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1621
- tlp.white
category: identity
log_source:
  product: onepassword
  service: signin-attempts
detection:
  condition: |
    signin_type == "u2f_bad"
false_positives:
- Confirmed test/tuning activity
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
