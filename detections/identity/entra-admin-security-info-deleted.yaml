id: det-identity-215
name: Entra Security Information Deleted By An Administrator
description: Removing another account's factor is the step that makes a password alone sufficient.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1556.006
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Admin deleted security info"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
