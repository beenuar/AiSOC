id: det-identity-193
name: Entra Eligible Member Added To A Privileged Role
description: Eligibility is standing permission to activate the role later, which no active-assignment
  report shows.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.003
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add eligible member to role"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
