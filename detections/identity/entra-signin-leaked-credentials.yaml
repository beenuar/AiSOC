id: det-identity-264
name: Entra Sign-In With Leaked Credentials
description: The password is known to be public.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND riskEventTypes_v2 HAS_ANY ["leakedCredentials"]
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
