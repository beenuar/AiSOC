id: det-identity-244
name: Entra Domain Removed From The Tenant
description: Removing a domain invalidates every identity under it.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1531
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Remove domain from company"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
