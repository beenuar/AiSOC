id: det-identity-167
name: Workspace Suspicious Sign-In Flagged By Google
description: AiSOC v1 curated detection. Triggers on the identity signal described by 'Workspace Suspicious
  Sign-In Flagged By Google'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.suspicious_login"
false_positives:
- Travelling staff on an unfamiliar network
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
