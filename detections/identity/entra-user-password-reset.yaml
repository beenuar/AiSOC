id: det-identity-210
name: Entra User Password Reset By An Administrator
description: An administrator-driven reset locks the owner out and lets whoever asked for it in. Scoped
  to a human initiator, so a self-service reset is not reported as an administrator's.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Reset user password"
    AND initiator_type == "user"
false_positives:
- First-time provisioning / new-user onboarding
- Sanctioned automation/IaC pipeline
- Documented break-glass procedure
- Self-service reset that Graph recorded against the user's own principal name rather than the password-reset
  service
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
