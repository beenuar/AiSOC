id: det-identity-261
name: Entra Sign-In Flagged As Anonymized IP Address
description: Microsoft's own anonymizer verdict, independent of the ingest dataset.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1090.003
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-signin
detection:
  condition: |
    event_type == "azure.entra.signin.risky"
    AND riskEventTypes_v2 HAS_ANY ["anonymizedIPAddress"]
false_positives:
- Staff member travelling, on a corporate VPN, or using a client the tenant still permits
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
