id: det-identity-208
name: Entra App Role Assignment Granted To A User
description: The user-scoped half of the same mechanism.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1098
- tlp.white
category: identity
log_source:
  product: azure
  service: entra-audit
detection:
  condition: |
    activity == "Add app role assignment grant to user"
