id: det-identity-161
name: Workspace Recovery Email Changed By The Account Holder
description: The recovery address moved from the user's own session. Taken before a password reset it
  makes the reset survive the owner noticing.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.005
- mitre.attack.t1556
- tlp.white
category: identity
log_source:
  product: google-workspace
  service: login
detection:
  condition: |
    event_type == "workspace.login.recovery_email_edit"
false_positives:
- Staff member correcting their own recovery address
- First-time provisioning / new-user onboarding
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
