id: det-network-015
name: Outbound Traffic to Rare/Suspicious ASN
description: AiSOC v1 curated detection. Triggers on the network signal described by 'Outbound Traffic
  to Rare/Suspicious ASN'. Watch the 1 documented false-positive case before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1071.001
- tlp.white
category: network
log_source:
  product: ndr
  service: flow
detection:
  condition: |
    dst_asn_seen_count < 5
    AND time_window_days > 30
false_positives:
- First-time use of legitimate hosting providers (must investigate)
playbook: tpl-c2
enabled: false
quarantine_reason: 'not executable (rarity): fires when a destination ASN has been seen *fewer* than five
  times in thirty days. The engine fires when a count is high; a rarity signal needs the first-seen store
  (depth plan 3.3) and the baseline module (3.4).'
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
