# QA-only host port remap (untracked, never committed). Another stack on this
# machine already publishes 5432, 8123 and 9000. Container ports are unchanged,
# so service-to-service traffic over the compose network is identical to the
# documented deployment; only the host-side bindings move.
services:
  postgres:
    ports: !override
      - "127.0.0.1:55432:5432"
  clickhouse:
    ports: !override
      - "127.0.0.1:58123:8123"
      - "127.0.0.1:59000:9000"
